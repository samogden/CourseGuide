  CST-300:
    code: CST 300
    title: Graduation Writing Assessment for Computing and Design
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course develops critical reading and writing skills for Computing, Design, and Technology fields. Students will learn to adapt their writing for different audiences and purposes, adhering to disciplinary conventions. The curriculum covers expository and academic writing, professional communication, source selection, and effective communication with diverse audiences.
    offered:
      terms:
        - spring
    prerequisites: []
    minimumStanding: junior
    prerequisiteNotes:
      - GE Area 1A and 1B and 1C with a C- or better) and (Junior or Senior Standing
  CST-311:
    code: CST 311
    title: Introduction to Computer Networks
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Survey of Telecomm and Data Comm Technology Fundamentals, Local Area Network, Wide Area Network, Internet and internetworking protocols including TCP/IP, network security and performance, emerging industry trends such as voice over the network and high speed networking. Designed as a foundation for students who wish to pursue more advanced network studies including certificate programs. Includes hands-on networking labs that incorporate Cisco CCNA lab components.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - courseId: CST-238
      - courseId: MATH-130
  CST-315:
    code: CST 315
    title: Introduction to Cybersecurity
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course provides a comprehensive introduction to cybersecurity fundamentals and the core technologies protecting digital assets. Students will explore key areas including cryptography, access control mechanisms, malware analysis, and social engineering tactics. By integrating technical concepts with human factors in security, the course equips participants with essential skills to navigate and address contemporary cybersecurity challenges.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - courseId: CST-238
      - courseId: MATH-130
  CST-325:
    code: CST 325
    title: Graphics Programming
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course teaches the students the fundamentals of game programming and skills needed for game development, including GPU programming, matrix and quaternion algebra for physics calculation, animation, lighting and basics of implementing 3D models into a framework.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - courseId: CST-238
      - courseId: MATH-130
  CST-326:
    code: CST 326
    title: Game Development
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course provides students with fundamental and transferable game programming skills. Students will learn how to develop games using a game engine and a toolset of object- oriented programming techniques, design patterns and software engineering paradigms. Additionaly, the course discusses ethical considerations in game development, develops interpersonal and oral communication skills, and game design document writing.
    offered:
      terms:
        - spring
    prerequisites:
      - courseId: CST-238
  CST-334:
    code: CST 334
    title: Operating Systems
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Students in this course will learn about the use and design of modern operating systems, focusing on Linux. On the “use” side, students will learn the Linux command line, to write shell scripts, and to build programs with GNU utilities like awk, sed, and make. On the “design” side, students will develop a deep understanding of process management, memory management, file systems, and concurrency, and how they apply to modern technologies like virtualization and cloud computing.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - courseId: CST-237
      - courseId: CST-238
  CST-336:
    code: CST 336
    title: Internet Programming
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Provides students with dynamic web application development skills, focusing on the integration of server-side programming, database connectivity, and client-side scripting. Coverage includes the Internet architecture, responsive design, RESTful web services, and Web APIs.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - courseId: CST-238
  CST-338:
    code: CST 338
    title: Software Design
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This is an intermediate-level programming course covering techniques for developing large- scale software systems using object-oriented programming. Coverage includes software development life cycle models, requirements analysis, and graphical user interface development.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - courseId: CST-238
      - courseId: MATH-130
  CST-349:
    code: CST 349
    title: Computer Science Proseminar
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: The Proseminar course helps students prepare for ‘life after college’ by connecting their major to their broader personal and professional goals. In this course, students will critically analyze information from diverse sources, including academic and business literature and conversations with industry mentors. They will also develop crucial problem- solving, communication, and teamwork skills throughout the course. This analysis and skill development will guide them in crafting their personal value proposition and a plan for developing a professional portfolio.
    offered:
      terms:
        - fall
        - spring
    prerequisites: []
    minimumStanding: junior
    prerequisiteNotes:
      - Junior Standing Required
  CST-363:
    code: CST 363
    title: Introduction to Database Systems
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course provides balanced coverage of database use and design,focusing on relational databases. Students will learn to design relational schemas, write SQL queries, access a DB programmatically,and perform database administration. Students will gain a working knowledge of the algorithms and data structures used in query evaluation and transaction processing. Students will also learn to apply newer database technologies such as XML, NoSQL, and Hadoop.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - courseId: CST-238
      - courseId: MATH-130
  CST-370:
    code: CST 370
    title: Design and Analysis of Algorithms
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Students learn important data structures in computer science and acquire fundamental algorithm design techniques to get the efficient solutions to several computing problems from various disciplines. Topics include the analysis of algorithm efficiency, hash, heap, graph, tree, sorting and searching, brute force, divide-and-conquer, decrease-and-conquer, transform-and-conquer, dynamic programming, and greedy programming.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - courseId: CST-238
      - courseId: MATH-170
  CST-380:
    code: CST 380
    title: Mobile and Ubiquitous Computing
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course focuses on mobile-oriented development and the specific challenges and considerations that must be made. Students will learn how to develop applications for mobile and ubiquitous devices, as well as important topics related to the deployment of mobile- oriented applications. Topics include distributed data management, user interaction design, energy management, and programming languages.
    offered:
      terms:
        - spring
    prerequisites:
      - courseId: CST-238
  CST-383:
    code: CST 383
    title: Introduction to Data Science
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: In data science, data analysis and machine learning techniques are applied to visualize data, understand trends, and make predictions. In this course students will learn how to obtain data, preprocess it, apply machine learning methods, and visualize the results. A student who completes the course will have enough theoretical knowledge, and enough skill with modern statistical programming languages and their libraries, to define and perform complete data science projects.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-238
            minimumGrade: C-
          - courseId: BIO-380
            minimumGrade: C-
          - allOf:
              - courseId: CST-319
                minimumGrade: C-
              - anyOf:
                  - courseId: STAT-100
                    minimumGrade: C-
                  - courseId: STAT-250
                    minimumGrade: C-
                  - courseId: MATH-320
                    minimumGrade: C-
                  - courseId: BUS-204
                    minimumGrade: C-
  CST-415:
    code: CST 415
    title: Advanced Cybersecurity
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course explores concepts in network security, web application defense, and other emerging cyber threats. Building on basic cybersecurity knowledge, this course examines advanced attack methods and protection techniques across different digital systems. Students will develop offensive and defensive skills, learning to identify vulnerabilities and implement robust security measures. Through hands-on labs and practical activities, students will apply these techniques in realistic scenarios, enhancing their ability to secure and test digital systems effectively.
    offered:
      terms:
        - fall
    prerequisites:
      - courseId: CST-311
      - courseId: CST-315
  CST-426:
    code: CST 426
    title: Advanced Game Development
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course provides students with advanced game development skills. Students will learn how to develop procedural content generation techniques for various platforms, and advanced game input techniques . Students will also learn how to apply gamification technique to serious games development. Additionaly, the course discusses ethical considerations in game development, develops interpersonal and oral communication skills, and game design document writing.
    offered:
      availability: periodic
    prerequisites:
      - courseId: CST-325
      - courseId: CST-326
  CST-438:
    code: CST 438
    title: Software Engineering
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Prepares students for large-scale software development using software engineering principles and techniques. Coverage includes software process, requirements analysis and specification, software design, implementation, testing, and project management. Students are expected to work in teams to carry out a realistic software project.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - courseId: CST-338
  CST-462S:
    code: CST 462S
    title: Race, Gender, Class in the Digital World
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Provides students with key knowledge of race, gender, class and social justice especially in relation to technology in today’s digital world. Students challenge the barriers of expertise, gender, race, class, and location that restrict wider access to and understanding of the production and usage of new technologies. Students will engage in a practical experience in the community via their service placements, which will provide depth and context for considering questions of justice, equality, social responsibilities and the complexities of technology and its societal impact. The course uses scenario based approach combining presentations, discussions, and reflections to allow students explore the relationship between critical reflection and action on the topics mentioned above.
    offered:
      terms:
        - fall
        - spring
    prerequisites: []
    prerequisiteNotes:
      - GE Area 1A and 1B and 1C and 2 with a C- or better
  CST-463:
    code: CST 463
    title: Advanced Machine Learning
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: In this course students learn to use advanced machine learning methods. The advanced machine learning methods include support vector machines, dimensionality reduction, ensemble methods, methods for machine learning with time series data, and especially neural networks.
    offered:
      terms:
        - fall
    prerequisites:
      - courseId: CST-383
        minimumGrade: C-
  CST-499:
    code: CST 499
    title: Computer Science Capstone
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: The course offers students a culminating experience by integrating the knowledge and skills acquired throughout their academic program into a comprehensive project. Students often work on a large group real-world project, exploring the problem space, developing requirement specifications, and proposing a solution followed by design and development of the solution. Concurrently, students will acquire and refine essential project management, collaboration, and presentation skills that are critical for their future professional careers.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - courseId: CST-349
      - anyOf:
          - courseId: CST-334
            minimumGrade: C-
          - courseId: CST-370
            minimumGrade: C-
  CST-195:
    code: CST 195
    title: Special Topics
    teachingStatus: inactive
    credits:
      minimum: 1
      maximum: 4
    description: Specialized study of a particular topic within the School of Information Technology and Communication Design. May be repeated for additional credit when topics vary and as subjects permit.
    offered:
      availability: periodic
  CST-196:
    code: CST 196
    title: Field Studies
    teachingStatus: inactive
    credits:
      minimum: 1
      maximum: 6
    description: Students work with faculty to collect data and user feedback by going to the site of the user and unobtrusively observing the user function in their own environment. This course is usually conducted as part of a large research project.
    offered:
      availability: periodic
  CST-197:
    code: CST 197
    title: Independent Study
    teachingStatus: inactive
    credits:
      minimum: 1
      maximum: 6
    description: Working with a faculty advisor, a student selects topic of study and number of credits appropriate to the student’s learning plan. An independent study proposal must be submitted and approved before registration.
    offered:
      availability: periodic
  CST-201:
    code: CST 201
    title: Media Tools I
    teachingStatus: inactive
    credits:
      minimum: 4
      maximum: 4
    description: Explores computer-based tools used in the design and creation of electronic media. Includes designing, creating, and editing electronic images, sounds, videos, text, and motion.
    offered:
      terms:
        - fall
        - spring
  CST-202:
    code: CST 202
    title: Drawing for Digital Media
    teachingStatus: inactive
    credits:
      minimum: 2
      maximum: 2
    description: This course covers concepts and drawing skills related to the use of drawing and visualization in both the studio and digital environment. The course integrates studio drawing and illustration with digital technology, covering hand rendering, scanning, auto- tracing, photo conversion, vector art and bitmap drawing using digital visualization and illustration hardware and software. Included topics are 2D and 3D design, drawing, storyboarding and illustration (traditional and digital).
    offered:
      terms:
        - fall
        - spring
    corequisites:
      - courseId: CST-202L
  CST-203:
    code: CST 203
    title: Digital Color
    teachingStatus: inactive
    credits:
      minimum: 1
      maximum: 1
    description: This course introduces students to the nomenclature, technical components, theories and principles, and cultural associations of color relevant to professional communication designers. Students will demonstrate understanding of key concepts by completing design projects using Illustrator, InDesign, Photoshop and Dreamweaver.
    offered:
      availability: periodic
  CST-203L:
    code: CST 203L
    title: Digital Color Lab
    teachingStatus: inactive
    credits:
      minimum: 1
      maximum: 1
    description: This course introduces students to the nomenclature, technical components, theories and principles, and cultural associations of color relevant to professional communication designers. Students will demonstrate understanding of key concepts by completing design projects using Illustrator, InDesign, Photoshop and Dreamweaver.
    offered:
      availability: periodic
  CST-204:
    code: CST 204
    title: Introduction to Typography
    teachingStatus: inactive
    credits:
      minimum: 3
      maximum: 3
    description: Introduces the history of type, type fonts, principles of letterform design, professional typesetting skills, layout for screen and print delivery. Subjects include the history and construction of letter forms, typographic composition and typesetting principles and techniques.
    offered:
      terms:
        - fall
  CST-226:
    code: CST 226
    title: Digital Photography
    teachingStatus: inactive
    credits:
      minimum: 3
      maximum: 3
    description: "Teaches use of digitally based image acquisition and manipulation tools to capture and modify photographic images for use in print and screen-based media. Has two major instructional components. The initial instruction sets are based around conventional photographic principles such as lighting, composition, subject matter, and how digital capture processes affect these. The second component deals with image adjustment and delivery. Deals with aesthetic aspects of photography. General Education: 3A Arts"
    offered:
      terms:
        - fall
        - spring
  CST-227:
    code: CST 227
    title: Design Fundamentals
    teachingStatus: inactive
    credits:
      minimum: 3
      maximum: 3
    description: This project-based course combines the study of visual design and aesthetic principles while developing skills to produce digital graphic media. Students study historic design trends, typography, color theory, and production for cross-media production. Students apply the steps of the Design Process to create original vector and bitmapped imagery to solve visual communication design problems.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - courseId: CST-201
  CST-230:
    code: CST 230
    title: Media Tools II
    teachingStatus: inactive
    credits:
      minimum: 4
      maximum: 4
    description: Integrates audio, video, and animation authoring software to design, manage, and create a multimedia project. Includes planning, sketching, and storyboarding a video project. Introduces tools and techniques to create audio and visual digital effects. Covers essential design principles and video composition.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - courseId: CST-201
    prerequisiteNotes:
      - equivalent
  CST-234:
    code: CST 234
    title: Intro to Operating Systems
    teachingStatus: inactive
    credits:
      minimum: 4
      maximum: 4
    description: Introduces modern operating systems such as Unix and topics such as process management (creation, synchronization, and communication); processor scheduling; deadlock prevention, avoidance, and recovery; main-memory management; virtual memory management (swapping, paging, segmentation and page-replacement algorithms); control of disks and other input/output devices; file-system structure and implementation; and protection and security.
    offered:
      availability: periodic
  CST-236:
    code: CST 236
    title: Computing for Designers
    teachingStatus: inactive
    credits:
      minimum: 3
      maximum: 3
    description: Introduction to the use of computers for digital media creations, this course covers the fundamentals of how computers work in the creation of digital media for commercial entertainment and fine art purposes; including hardware components, operating principles, software basics, memory management, storage, programming basics for vector and bitmap functions, compression schemes and basic scripting.
    offered:
      terms:
        - spring
  CST-251:
    code: CST 251
    title: Web Tools
    teachingStatus: inactive
    credits:
      minimum: 4
      maximum: 4
    description: Introduces students to the tools and methods of web design and production. Students will learn basic HTML, web design tools, Cascading Style Sheets (CSS) and browser compatibility while applying the design principles of information architecture, color, layout, and type.
    offered:
      terms:
        - fall
        - spring
  CST-252:
    code: CST 252
    title: Scripting for Multimedia
    teachingStatus: inactive
    credits:
      minimum: 3
      maximum: 3
    description: Students learn HTML5 and related technologies including HTML, CSS3, Canvas, JavaScript and jQuery to create dynamic multimedia content. Students learn the fundamental concepts of web programming plus designing, coding, testing, debugging, and documenting of computer programs. Using JavaScript, students apply those concepts to create programs utilizing digital media, including images, animation, audio, video and text. This is a laboratory class using Windows or Macintosh computers.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - courseId: CST-251
  CST-263:
    code: CST 263
    title: Intro to Database Systems
    teachingStatus: inactive
    credits:
      minimum: 3
      maximum: 4
    description: This course is an introduction to Relational Database Management Systems. Topics covered will include relational database theory and the logical and physical design, implementation, and management of databases. Additional topics will include Entity-Relationship Diagrams, Normalization and an introduction to SQL (Structured Query Language).
    offered:
      availability: periodic
  CST-273:
    code: CST 273
    title: Cyberdemocracy
    teachingStatus: inactive
    credits:
      minimum: 3
      maximum: 3
    description: Explores the implications of new communication technologies with regard to democracy, social activism, cultural identity, and social equity in the United States. Democracy cannot be separated from the issue of social identity since throughout our history many groups were excluded from political participation. Explores whether new media like the Internet will increasingly make identity irrelevant, or will create greater fragmentation.
    offered:
      terms:
        - fall
        - spring
  CST-274:
    code: CST 274
    title: History of Communication Technologies and Politics in America
    teachingStatus: inactive
    credits:
      minimum: 4
      maximum: 4
    description: "Examines the history of communication technologies and how they shaped and have been shaped by politics throughout American history. The story begins in pre-revolutionary America, when newspapers united the colonies, and moves through the telegraph, the telephone, motion pictures, radio, broadcasting, network and cable television, personal computers, the Internet, mobile phones, and social media. Students leverage their understanding of communication history to address some of constitutive choices facing our nation, including foreign interference in elections, net neutrality, and data privacy. General Education: 4A Social & Behavioral Sciences University Requirement: US1 U.S. Histories Typically Offered: Fall, Spring Units: 3 CST 286 - Physics of Computing Print (opens a new window) CST 286 - Physics of Computing Introduces the basic principles of physical science and the application of these principles to electronics and computing. Students will learn fundamental concepts of physics in the first half of the course and build on it with topics that are relevant to the function of electronic devices and computers. Computational Physics tools and procedures will also be covered through assignments and project."
    offered:
      terms:
        - fall
    prerequisites:
      - courseId: MATH-130
  CST-304:
    code: CST 304
    title: Typography
    teachingStatus: inactive
    credits:
      minimum: 4
      maximum: 4
    description: Typography is the art of designing letterforms, alphabets and creating compositions with letters and words. This course explains typographic practices to develop an eye for type and how to use it effectively.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - courseId: CST-227
  CST-312:
    code: CST 312
    title: Network Security
    teachingStatus: inactive
    credits:
      minimum: 4
      maximum: 4
    description: Focuses on the theory, practice and technologies for securing computers on the web and the Internet. Students will learn cryptographic tools and how they are used by standard network security protocols like SSL/TLS, IPSEC, Kerberos, PGP, S/MIME, and wireless. Students will also learn about ethical hacking and policies and procedures to protect against such hacking.
    offered:
      terms:
        - fall
    prerequisites:
      - courseId: CST-311
      - courseId: MATH-170
  CST-316:
    code: CST 316
    title: Computing for Designers
    teachingStatus: inactive
    credits:
      minimum: 4
