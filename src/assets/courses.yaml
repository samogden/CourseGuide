courses:
  defaults:
    units: 4
  catalog:
    CST 205:
      name: Multimedia Design and Programming
      units: 4
      description: |-
        Introduces design, creation, and manipulation of interactive applications and electronic media for communication purpose. Focuses on creating media, understanding media concepts, and manipulating the created media using basic programming concepts of control flow, functions, expressions and data types in the Python language. Students acquire a basic understanding for digital media formats, how to design, create such media using basic programming skills.
      offered: Fall, Spring
    CST 231:
      name: Problem Solving/Programming
      units: 4
      description: |-
        This is an introductory programming course to develop problem-solving techniques for numerical and non-numerical problems. Students will design the solution to each problem and implement it in a programming language. Coverage includes introduction to computer systems, programming language basics, flow control, functions, I/O, arrays, strings, and classes.
      offered: Fall, Spring
    CST 237:
      name: Intro to Computer Architecture
      units: 4
      description: |-
        Provides students with the fundamental knowledge of computer architectures, hardware and software components of computer systems, interrelationship among different components. Coverage includes introduction to data representation, CPU, assembly programming, memory systems, input/output devices, pipelining, multi-processing systems, operating systems and network architecture.
      prereqs:
      - course: CST 231
      - course: MATH 170
      offered: Fall, Spring
    CST 238:
      name: Introduction to Data Structures
      units: 4
      description: |-
        This is an intermediate-level programming course with an emphasis on data structures. Coverage includes object-oriented programming, lists, stacks, queues, recursion, trees, sorting, searching, and basic concepts of algorithm analysis.
      prereqs:
      - all_of:
        - course: CST 231
          min_grade: C-
        - any_of:
          - course: MATH 130
            min_grade: C-
          - course: MATH 150
            min_grade: C-
      offered: Fall, Spring
    CST 300:
      name: Graduation Writing Assessment for Computing and Design
      units: 3
      description: |-
        This course develops critical reading and writing skills for Computing, Design, and Technology fields. Students will learn to adapt their writing for different audiences and purposes, adhering to disciplinary conventions. The curriculum covers expository and academic writing, professional communication, source selection, and effective communication with diverse audiences.
      prereqs: []
      offered: Spring term only
      prereq_notes:
      - GE Area 1A and 1B and 1C with a C- or better) and (Junior or Senior Standing
    CST 311:
      name: Introduction to Computer Networks
      units: 4
      description: |-
        Survey of Telecomm and Data Comm Technology Fundamentals, Local Area Network, Wide Area Network, Internet and internetworking protocols including TCP/IP, network security and performance, emerging industry trends such as voice over the network and high speed networking. Designed as a foundation for students who wish to pursue more advanced network studies including certificate programs. Includes hands-on networking labs that incorporate Cisco CCNA lab components.
      prereqs:
      - course: CST 238
      - course: MATH 130
      offered: Fall, Spring
    CST 315:
      name: Introduction to Cybersecurity
      units: 4
      description: |-
        This course provides a comprehensive introduction to cybersecurity fundamentals and the core technologies protecting digital assets. Students will explore key areas including cryptography, access control mechanisms, malware analysis, and social engineering tactics. By integrating technical concepts with human factors in security, the course equips participants with essential skills to navigate and address contemporary cybersecurity challenges.
      prereqs:
      - course: CST 238
      - course: MATH 130
      offered: Fall, Spring
    CST 325:
      name: Graphics Programming
      units: 4
      description: |-
        This course teaches the students the fundamentals of game programming and skills needed for game development, including GPU programming, matrix and quaternion algebra for physics calculation, animation, lighting and basics of implementing 3D models into a framework.
      prereqs:
      - course: CST 238
      - course: MATH 130
      offered: Fall, Spring
    CST 326:
      name: Game Development
      units: 4
      description: |-
        This course provides students with fundamental and transferable game programming skills. Students will learn how to develop games using a game engine and a toolset of object- oriented programming techniques, design patterns and software engineering paradigms. Additionaly, the course discusses ethical considerations in game development, develops interpersonal and oral communication skills, and game design document writing.
      prereqs:
      - course: CST 238
      offered: Spring term only
    CST 334:
      name: Operating Systems
      units: 4
      description: |-
        Students in this course will learn about the use and design of modern operating systems, focusing on Linux. On the “use” side, students will learn the Linux command line, to write shell scripts, and to build programs with GNU utilities like awk, sed, and make. On the “design” side, students will develop a deep understanding of process management, memory management, file systems, and concurrency, and how they apply to modern technologies like virtualization and cloud computing.
      prereqs:
      - course: CST 237
      - course: CST 238
      offered: Fall, Spring
    CST 336:
      name: Internet Programming
      units: 4
      description: |-
        Provides students with dynamic web application development skills, focusing on the integration of server-side programming, database connectivity, and client-side scripting. Coverage includes the Internet architecture, responsive design, RESTful web services, and Web APIs.
      prereqs:
      - course: CST 238
      offered: Fall, Spring
    CST 338:
      name: Software Design
      units: 4
      description: |-
        This is an intermediate-level programming course covering techniques for developing large- scale software systems using object-oriented programming. Coverage includes software development life cycle models, requirements analysis, and graphical user interface development.
      prereqs:
      - course: CST 238
      - course: MATH 130
      - course: MATH 150
      offered: Fall, Spring
    CST 349:
      name: Computer Science Proseminar
      units: 2
      description: |-
        The Proseminar course helps students prepare for ‘life after college’ by connecting their major to their broader personal and professional goals. In this course, students will critically analyze information from diverse sources, including academic and business literature and conversations with industry mentors. They will also develop crucial problem- solving, communication, and teamwork skills throughout the course. This analysis and skill development will guide them in crafting their personal value proposition and a plan for developing a professional portfolio.
      prereqs: []
      offered: Fall, Spring
      prereq_notes:
      - Junior Standing Required
    CST 363:
      name: Introduction to Database Systems
      units: 4
      description: |-
        This course provides balanced coverage of database use and design,focusing on relational databases. Students will learn to design relational schemas, write SQL queries, access a DB programmatically,and perform database administration. Students will gain a working knowledge of the algorithms and data structures used in query evaluation and transaction processing. Students will also learn to apply newer database technologies such as XML, NoSQL, and Hadoop.
      prereqs:
      - course: CST 238
      - course: MATH 130
      offered: Fall, Spring
    CST 370:
      name: Design and Analysis of Algorithms
      units: 4
      description: |-
        Students learn important data structures in computer science and acquire fundamental algorithm design techniques to get the efficient solutions to several computing problems from various disciplines. Topics include the analysis of algorithm efficiency, hash, heap, graph, tree, sorting and searching, brute force, divide-and-conquer, decrease-and-conquer, transform-and-conquer, dynamic programming, and greedy programming.
      prereqs:
      - course: CST 238
      - course: MATH 170
      offered: Fall, Spring
    CST 380:
      name: Mobile and Ubiquitous Computing
      units: 4
      description: |-
        This course focuses on mobile-oriented development and the specific challenges and considerations that must be made. Students will learn how to develop applications for mobile and ubiquitous devices, as well as important topics related to the deployment of mobile- oriented applications. Topics include distributed data management, user interaction design, energy management, and programming languages.
      prereqs:
      - course: CST 238
      offered: Spring term only
    CST 383:
      name: Introduction to Data Science
      units: 4
      description: |-
        In data science, data analysis and machine learning techniques are applied to visualize data, understand trends, and make predictions. In this course students will learn how to obtain data, preprocess it, apply machine learning methods, and visualize the results. A student who completes the course will have enough theoretical knowledge, and enough skill with modern statistical programming languages and their libraries, to define and perform complete data science projects.
      prereqs:
      - any_of:
        - course: CST 238
          min_grade: C-
        - course: BIO 380
          min_grade: C-
        - all_of:
          - course: CST 319
            min_grade: C-
          - any_of:
            - course: STAT 100
              min_grade: C-
            - course: STAT 250
              min_grade: C-
            - course: MATH 320
              min_grade: C-
            - course: BUS 204
              min_grade: C-
      offered: Fall, Spring
    CST 415:
      name: Advanced Cybersecurity
      units: 4
      description: |-
        This course explores concepts in network security, web application defense, and other emerging cyber threats. Building on basic cybersecurity knowledge, this course examines advanced attack methods and protection techniques across different digital systems. Students will develop offensive and defensive skills, learning to identify vulnerabilities and implement robust security measures. Through hands-on labs and practical activities, students will apply these techniques in realistic scenarios, enhancing their ability to secure and test digital systems effectively.
      prereqs:
      - course: CST 311
      - course: CST 315
      offered: Fall term only
    CST 426:
      name: Advanced Game Development
      units: 4
      description: |-
        This course provides students with advanced game development skills. Students will learn how to develop procedural content generation techniques for various platforms, and advanced game input techniques . Students will also learn how to apply gamification technique to serious games development. Additionaly, the course discusses ethical considerations in game development, develops interpersonal and oral communication skills, and game design document writing.
      prereqs:
      - course: CST 325
      - course: CST 326
      offered: Periodically offered
    CST 438:
      name: Software Engineering
      units: 4
      description: |-
        Prepares students for large-scale software development using software engineering principles and techniques. Coverage includes software process, requirements analysis and specification, software design, implementation, testing, and project management. Students are expected to work in teams to carry out a realistic software project.
      prereqs:
      - course: CST 338
      offered: Fall, Spring
    CST 462S:
      name: Race, Gender, Class in the Digital World
      units: 3
      description: |-
        Provides students with key knowledge of race, gender, class and social justice especially in relation to technology in today’s digital world. Students challenge the barriers of expertise, gender, race, class, and location that restrict wider access to and understanding of the production and usage of new technologies. Students will engage in a practical experience in the community via their service placements, which will provide depth and context for considering questions of justice, equality, social responsibilities and the complexities of technology and its societal impact. The course uses scenario based approach combining presentations, discussions, and reflections to allow students explore the relationship between critical reflection and action on the topics mentioned above.
      prereqs: []
      offered: Fall, Spring
      prereq_notes:
      - GE Area 1A and 1B and 1C and 2 with a C- or better
    CST 463:
      name: Advanced Machine Learning
      units: 4
      description: |-
        In this course students learn to use advanced machine learning methods. The advanced machine learning methods include support vector machines, dimensionality reduction, ensemble methods, methods for machine learning with time series data, and especially neural networks.
      prereqs:
      - course: CST 383
        min_grade: C-
      offered: Fall term only
    CST 499:
      name: Computer Science Capstone
      units: 4
      description: |-
        The course offers students a culminating experience by integrating the knowledge and skills acquired throughout their academic program into a comprehensive project. Students often work on a large group real-world project, exploring the problem space, developing requirement specifications, and proposing a solution followed by design and development of the solution. Concurrently, students will acquire and refine essential project management, collaboration, and presentation skills that are critical for their future professional careers.
      prereqs:
      - course: CST 349
      - any_of:
        - course: CST 334
          min_grade: C-
        - course: CST 370
          min_grade: C-
      offered: Fall, Spring
  other_courses:
    CST 195:
      name: Special Topics
      units: 1-4
      description: |-
        Specialized study of a particular topic within the School of Information Technology and Communication Design. May be repeated for additional credit when topics vary and as subjects permit.
      offered: Periodically offered
    CST 196:
      name: Field Studies
      units: 1-6
      description: |-
        Students work with faculty to collect data and user feedback by going to the site of the user and unobtrusively observing the user function in their own environment. This course is usually conducted as part of a large research project.
      offered: Periodically offered
    CST 197:
      name: Independent Study
      units: 1-6
      description: |-
        Working with a faculty advisor, a student selects topic of study and number of credits appropriate to the student’s learning plan. An independent study proposal must be submitted and approved before registration.
      offered: Periodically offered
    CST 201:
      name: Media Tools I
      units: 4
      description: |-
        Explores computer-based tools used in the design and creation of electronic media. Includes designing, creating, and editing electronic images, sounds, videos, text, and motion.
      offered: Fall, Spring
    CST 202:
      name: Drawing for Digital Media
      units: 2
      description: |-
        This course covers concepts and drawing skills related to the use of drawing and visualization in both the studio and digital environment. The course integrates studio drawing and illustration with digital technology, covering hand rendering, scanning, auto- tracing, photo conversion, vector art and bitmap drawing using digital visualization and illustration hardware and software. Included topics are 2D and 3D design, drawing, storyboarding and illustration (traditional and digital).
      coreqs:
      - course: CST 202L
      offered: Fall, Spring
    CST 203:
      name: Digital Color
      units: 1
      description: |-
        This course introduces students to the nomenclature, technical components, theories and principles, and cultural associations of color relevant to professional communication designers. Students will demonstrate understanding of key concepts by completing design projects using Illustrator, InDesign, Photoshop and Dreamweaver.
      offered: Periodically offered
    CST 203L:
      name: Digital Color Lab
      units: 1
      description: |-
        This course introduces students to the nomenclature, technical components, theories and principles, and cultural associations of color relevant to professional communication designers. Students will demonstrate understanding of key concepts by completing design projects using Illustrator, InDesign, Photoshop and Dreamweaver.
      offered: Periodically offered
    CST 204:
      name: Introduction to Typography
      units: 3
      description: |-
        Introduces the history of type, type fonts, principles of letterform design, professional typesetting skills, layout for screen and print delivery. Subjects include the history and construction of letter forms, typographic composition and typesetting principles and techniques.
      offered: Fall term only
    CST 226:
      name: Digital Photography
      units: 3
      description: |-
        Teaches use of digitally based image acquisition and manipulation tools to capture and modify photographic images for use in print and screen-based media. Has two major instructional components. The initial instruction sets are based around conventional photographic principles such as lighting, composition, subject matter, and how digital capture processes affect these. The second component deals with image adjustment and delivery. Deals with aesthetic aspects of photography. General Education: 3A Arts
      offered: Fall, Spring
    CST 227:
      name: Design Fundamentals
      units: 3
      description: |-
        This project-based course combines the study of visual design and aesthetic principles while developing skills to produce digital graphic media. Students study historic design trends, typography, color theory, and production for cross-media production. Students apply the steps of the Design Process to create original vector and bitmapped imagery to solve visual communication design problems.
      prereqs:
      - course: CST 201
      offered: Fall, Spring
    CST 230:
      name: Media Tools II
      units: 4
      description: |-
        Integrates audio, video, and animation authoring software to design, manage, and create a multimedia project. Includes planning, sketching, and storyboarding a video project. Introduces tools and techniques to create audio and visual digital effects. Covers essential design principles and video composition.
      prereqs:
      - course: CST 201
      offered: Fall, Spring
      prereq_notes:
      - equivalent
    CST 234:
      name: Intro to Operating Systems
      units: 4
      description: |-
        Introduces modern operating systems such as Unix and topics such as process management (creation, synchronization, and communication); processor scheduling; deadlock prevention, avoidance, and recovery; main-memory management; virtual memory management (swapping, paging, segmentation and page-replacement algorithms); control of disks and other input/output devices; file-system structure and implementation; and protection and security.
      offered: Periodically offered
    CST 236:
      name: Computing for Designers
      units: 3
      description: |-
        Introduction to the use of computers for digital media creations, this course covers the fundamentals of how computers work in the creation of digital media for commercial entertainment and fine art purposes; including hardware components, operating principles, software basics, memory management, storage, programming basics for vector and bitmap functions, compression schemes and basic scripting.
      offered: Spring term only
    CST 251:
      name: Web Tools
      units: 4
      description: |-
        Introduces students to the tools and methods of web design and production. Students will learn basic HTML, web design tools, Cascading Style Sheets (CSS) and browser compatibility while applying the design principles of information architecture, color, layout, and type.
      offered: Fall, Spring
    CST 252:
      name: Scripting for Multimedia
      units: 3
      description: |-
        Students learn HTML5 and related technologies including HTML, CSS3, Canvas, JavaScript and jQuery to create dynamic multimedia content. Students learn the fundamental concepts of web programming plus designing, coding, testing, debugging, and documenting of computer programs. Using JavaScript, students apply those concepts to create programs utilizing digital media, including images, animation, audio, video and text. This is a laboratory class using Windows or Macintosh computers.
      prereqs:
      - course: CST 251
      offered: Fall, Spring
    CST 263:
      name: Intro to Database Systems
      units: 3-4
      description: |-
        This course is an introduction to Relational Database Management Systems. Topics covered will include relational database theory and the logical and physical design, implementation, and management of databases. Additional topics will include Entity-Relationship Diagrams, Normalization and an introduction to SQL (Structured Query Language).
      offered: Periodically offered
    CST 271:
      name: Digital Culture
      units: 3
      description: |-
        Focuses on the philosophical roots (as evidenced in literature) of contemporary digital culture. From Armageddon to the Matrix; from Frankenstein to Lawnmower man; from the library at Alexandria to the archives of the Internet; the world of the digital intelligentsia owes its vision and mythology to the resonant themes found in literature and philosophy. Explores the essence of humanity that defines the natural world and strives to remake it in a more perfect fashion. General Education: 3B Humanities
      offered: Fall, Spring
    CST 273:
      name: Cyberdemocracy
      units: 3
      description: |-
        Explores the implications of new communication technologies with regard to democracy, social activism, cultural identity, and social equity in the United States. Democracy cannot be separated from the issue of social identity since throughout our history many groups were excluded from political participation. Explores whether new media like the Internet will increasingly make identity irrelevant, or will create greater fragmentation.
      offered: Fall, Spring
    CST 274:
      name: History of Communication Technologies and Politics in America
      units: 4
      description: |-
        Examines the history of communication technologies and how they shaped and have been shaped by politics throughout American history. The story begins in pre-revolutionary America, when newspapers united the colonies, and moves through the telegraph, the telephone, motion pictures, radio, broadcasting, network and cable television, personal computers, the Internet, mobile phones, and social media. Students leverage their understanding of communication history to address some of constitutive choices facing our nation, including foreign interference in elections, net neutrality, and data privacy. General Education: 4A Social & Behavioral Sciences University Requirement: US1 U.S. Histories Typically Offered: Fall, Spring Units: 3 CST 286 - Physics of Computing Print (opens a new window) CST 286 - Physics of Computing Introduces the basic principles of physical science and the application of these principles to electronics and computing. Students will learn fundamental concepts of physics in the first half of the course and build on it with topics that are relevant to the function of electronic devices and computers. Computational Physics tools and procedures will also be covered through assignments and project.
      prereqs:
      - course: MATH 130
      offered: Fall term only
    CST 304:
      name: Typography
      units: 4
      description: |-
        Typography is the art of designing letterforms, alphabets and creating compositions with letters and words. This course explains typographic practices to develop an eye for type and how to use it effectively.
      prereqs:
      - course: CST 227
      offered: Fall, Spring
    CST 312:
      name: Network Security
      units: 4
      description: |-
        Focuses on the theory, practice and technologies for securing computers on the web and the Internet. Students will learn cryptographic tools and how they are used by standard network security protocols like SSL/TLS, IPSEC, Kerberos, PGP, S/MIME, and wireless. Students will also learn about ethical hacking and policies and procedures to protect against such hacking.
      prereqs:
      - course: CST 311
      - course: MATH 170
      offered: Fall term only
    CST 316:
      name: Computing for Designers
      units: 4
      description: |-
        This course encompasses the fundamental principles of computer operations relevant to the creation of digital media. The curriculum covers essential topics including hardware components, operating principles, basic software functionalities, memory management, data storage, programming fundamentals, compression techniques, and advanced technologies that enhance the efficiency and effectiveness of the design process. Additionally, the course introduces students to artificial intelligence concepts and the practical application in production.
      offered: Spring term only
    CST 319:
      name: Computing Across the Disciplines
      units: 3
      description: |-
        Students will develop basic programming skills by writing Python programs. Besides learning programming concepts such as data types, functions, expressions and control flow, students will work with real-world data to practice their problem-solving techniques. The programs students write will also strengthen programming skills using concepts in probability, linear algebra, and modeling.
      prereqs: []
      offered: Fall term only
      prereq_notes:
      - GE Area 1A and 1B and 1C and 2 with a C- or better
    CST 320:
      name: Intro to Digital Games
      units: 4
      description: |-
        Focuses on the fundamental issues in the development of digital games. Discusses components of modern digital games and their relationships, historical development of contemporary video and computer gaming, team member roles and tasks within the production process. Covers relationships of the conceptual creative and technical production to overall game development and analyzes the business, marketing and industry components of game development.
      prereqs:
      - course: CST 238
      offered: Fall, Spring
    CST 321:
      name: Game Design and Interactive Media I
      units: 4
      description: |-
        Presents the principles of game and related interactive media design. Students design and create games and interactives using analog and digitally-based authoring tools. Includes project management, production, and asset management of images, text, sound, animation, and computer code.
      prereqs:
      - course: CST 227
      offered: Spring term only
    CST 322:
      name: Environment Modeling
      units: 2
      description: |-
        The course equips students with the fundamental skills needed for the development of games. After first developing with basic 3D modelling skills, student learn how to model, texture and light complex objects and scenes using industry standard tools.
      offered: Fall term only
    CST 323:
      name: Character Design
      units: 2
      description: |-
        The course equips students with the fundamental skills needed for the design of 3D character models. Students learn how to apply industry best-practice and tools to character designing and modeling process. Drawing skills are recommended, but not required to succeed in the class.
      prereqs:
      - course: CST 202
      offered: Fall term only
    CST 327:
      name: Experimental Typography
      units: 4
      description: |-
        Explores an advanced study of typography across various domains of design. Solves complex problems with conceptual and experimental approaches that challenge typographic conventions through the production of innovative and dynamic communication designs.
      prereqs:
      - course: CST 304
      offered: Spring term only
    CST 328:
      name: Digital Art and Design
      units: 3
      description: |-
        A survey course that combines the study of technology, design and aesthetic principles as they apply to twenty-first century visual media. Students learn how fundamental concepts of art and design apply to a broad range of commercial, expressive and entertainment forms. Students also study the democratization of the creative process through digital media, using current technology to produce sophisticated and expressive examples of personal digital creativity.
      prereqs: []
      offered: Fall, Spring
      prereq_notes:
      - GE Area 1A and 1B and 1C and 2 with a C- or better
    CST 329:
      name: Reasoning with Logic
      units: 3
      description: |-
        In this course students learn to develop skill in using logic to describe and assess arguments. Students will learn to write formulas in propositional and first-order logic, and more importantly, to write and check proofs. Students will also learn to write formulas in three-valued and modal logic, know how to choose an appropriate logic, and understand the limitations of logic in capturing human reasoning.
      prereqs:
      - course: MATH 170
      offered: Fall, Spring
      prereq_notes:
      - GE Area 1A and 1B and 1C and 2
    CST 330:
      name: Media Tools II
      units: 3
      description: |-
        Integrates audio, video, and animation authoring software to design, manage, and create a multimedia project. Includes planning, sketching, and storyboarding a video project. Introduces tools and techniques to create audio and visual digital effects. Covers essential design principles and video composition.
      prereqs:
      - course: CST 201
      offered: Fall, Spring
      prereq_notes:
      - equivalent
    CST 333:
      name: Topics In Object-Oriented Prog
      units: 4
      prereqs:
      - course: CST 231
      offered: Periodically offered
    CST 337:
      name: Computer Architecture
      units: 4
      description: |-
        Provides students with the fundamental knowledge of computer architectures, hardware and software components of computer systems, interrelationship among different components. Coverage includes introduction to data representation, CPU, assembly programming, memory systems, input/output devices, pipelining, multi-processing systems, operating systems and network architecture.
      prereqs:
      - course: CST 231
      - course: MATH 170
      offered: Fall, Spring
    CST 341:
      name: Intro Instructional Design
      units: 4
      description: |-
        Introduces instructional design to create training and educational materials in business and education. Includes the principles of design for job aids, videos, programming, and computer-based training.
      offered: Periodically offered
    CST 345:
      name: Visual Thinking
      units: 4
      description: |-
        Students use the design process to strengthen their visual intelligence and vocabulary for communicating ideas. Course emphasizes ideation, systems thinking, and translating complex ideas using various tools and strategies.
      prereqs:
      - course: CST 227
      offered: Fall, Spring
    CST 346:
      name: Human-Computer Interaction
      units: 3
      description: |-
        Explores the fundamental concepts and design processes of the interdisciplinary field of human-computer interaction (HCI) that integrates theories and methodologies across multiple domains, such as cognitive psychology, human factors, and systems design. Through readings and hands-on exercises, students gain an understanding of the components involved in designing for universal audiences, social and emotional user experiences, usable products, emerging technologies and the impact on society.
      prereqs: []
      offered: Fall, Spring
      prereq_notes:
      - Junior OR Senior Standing
    CST 348:
      name: Communication Design Proseminar
      units: 2
      description: |-
        The course offers a comprehensive overview of the Communication Design major and its requirements. Students are guided in identifying and articulating personal, professional, and social objectives while formulating a plan to achieve their learning goals. Additionally, students engage in the analysis, prediction, and articulation of industry trends as they begin to establish their professional creative portfolios.
      prereqs: []
      offered: Fall term only
      prereq_notes:
      - Junior Standing Required
    CST 350:
      name: Web Scripting
      units: 4
      description: |-
        Students learn the fundamental concepts of web programming plus designing, coding, testing, debugging, and documenting of computer programs. Using JavaScript, students apply those concepts to create interactive programs including incorporating images, animation, audio, video, and text.
      prereqs:
      - course: CST 251
      offered: Fall, Spring
    CST 351:
      name: Web Design
      units: 4
      description: |-
        Covers web design aesthetics, layout, structure and universal design. Applies the design process and systems design principles using web templates and web content management systems.
      prereqs:
      - course: CST 201
      - course: CST 251
      offered: Fall term only
    CST 352:
      name: Web Scripting
      units: 4
      description: |-
        Introduces technical skills required to create dynamic websites using scripting languages and database integration. Covers frontend and backend web technologies that allow users to retrieve, add, delete, and update records from a website.
      prereqs:
      - course: CST 252
      offered: Periodically offered
    CST 362S:
      name: Technology & Communities SL
      units: 4
      offered: Periodically offered
    CST 373:
      name: Ethics in Comm & Tech
      units: 4
      description: |-
        Investigates through an ethical perspective how communication technology affects our lives. Discusses individual and institutional values represented through technological choices. Using case studies and current events, explores such issues as intellectual property rights, information access and privacy, and the digital divide.
      offered: Periodically offered
    CST 375:
      name: Brand Strategies for Designers
      units: 3
      description: |-
        Covers the essential components and elements that make up successful brands and how to map out a brand strategy employing current brand development tools and processes. Through readings, lectures and hands-on projects, students explore how brands go beyond logos and visual identity systems to include all aspects of a business that connect consumer needs, emotions and the competitive market environment.
      prereqs:
      - course: CST 227
      offered: Spring term only
      prereq_notes:
      - Instructor Consent
    CST 377:
      name: Business of Design
      units: 4
      description: |-
        Introduces design industry best practices and prepares students for a design career. Identifies the roles and responsibilities of employers, clients and designers. Topics include the recent legal and technological developments that affect the design profession. It addresses the different design trade customs, rates, salaries, copyrights, contracts, pricing and state and federal taxes.
      prereqs:
      - course: CST 348
      offered: Fall term only
    CST 381:
      name: Foundations of Data Science for AI
      units: 4
      description: |-
        This course introduces the core ideas and tools of data science for students from any discipline. You will learn how to explore, visualize, analyze data, and apply basic machine learning methods to real-world datasets. By the end of the course, you will be able to make sense of data and communicate insights clearly.
      prereqs:
      - any_of:
        - course: CST 319
        - course: BIO 380
      offered: Spring term only
    CST 390:
      name: Portfolio Development
      units: 1-3
      description: |-
        Covers planning, production and presentation of a Communication Design portfolio. May be repeated.
      offered: Periodically offered
    CST 394:
      name: Internship
      units: 1-4
      description: |-
        Students work with practicing professionals in the community in a volunteer or paid internship that requires critical thinking and specialized telecommunication, multimedia, or applied computing skills. The amount of academic work done, not total hours of internship commitment, determines the amount of academic credit.
      offered: Fall, Spring
    CST 395:
      name: Special Topics
      units: 1-6
      description: |-
        Specialized study of a particular topic within the School of Information Technology and Communications Design. May be repeated for additional credit when topics vary and as subjects permit.
      offered: Fall, Spring
    CST 396:
      name: Field Studies
      units: 1-6
      description: |-
        Individualizes student placement for field study as related to Information Technology and Communications Design.
      offered: Periodically offered
    CST 397:
      name: Independent Study
      units: 1-6
      description: |-
        Student and faculty member select topic of study and number of credits.
      offered: Fall, Spring
    CST 400:
      name: Senior Capstone Project Planning
      units: 2
      description: |-
        Students create a detailed proposal of and produce a prototype of a substantial, professional level project with an approval of the student’s capstone advisor. Students learn and practice project management, collaboration and presentation skills required in the industry.
      prereqs:
      - any_of:
        - course: CST 404
          min_grade: C-
        - course: CST 421
          min_grade: C-
        - course: CST 451
          min_grade: C-
      offered: Fall term only
      coreqs:
      - course: CST 496
      prereq_notes:
      - Instructor Consent
    CST 401:
      name: Capstone Lab
      units: 2
      description: |-
        Laboratory course supports students during the creation of their Capstone projects and assessment for Capstone outcomes.
      prereqs:
      - course: CST 400
        min_grade: C-
      offered: Spring term only
      coreqs:
      - course: CST 496
      prereq_notes:
      - Exclude Freshman and Sophomore and Junior
    CST 404:
      name: Publication Design
      units: 4
      description: |-
        This project-based course uses the steps of the design process to create publications for print and screen delivery. Principles of page layout design, information architecture, and digital production skills are emphasized. A laptop and knowledge of InDesign and Illustrator are required.
      prereqs:
      - course: CST 304
      offered: Spring term only
    CST 406:
      name: Graphic Identity
      units: 4
      description: |-
        Students experience the design process for creating a Graphic Identity system for a real- world client. Includes Graphic Standards Guides and client communication.
      prereqs:
      - course: CST 304
      offered: Fall term only
    CST 412:
      name: Network Administration
      units: 4
      description: |-
        Introduces management tools, skills, and information to design, implement, and manage telecommunications and data communications networks. Includes network design, monitoring, and security.
      prereqs:
      - course: CST 311
      offered: Fall term only
    CST 421:
      name: Game Design & Interactive Media II
      units: 4
      description: |-
        Continues the development of game and interactive design and production through collaborative projects with clients. Emphasizes game and interactive design and production skills. Addresses project critique and the proper application of basic principles of game and interactive design and development.
      prereqs:
      - course: CST 321
      offered: Fall term only
    CST 422:
      name: Level Design
      units: 2
      description: |-
        This advanced course provides students with the theory and practice of game level design. The course builds upon the students 3D modeling skills. The major learning outcomes include: using pre-existing assets in a creation of a playable game level, applying adequate theories to directing player’s movement and locus of attention during gameplay.
      prereqs:
      - course: CST 322
      offered: Spring term only
    CST 423:
      name: Character Animation
      units: 2
      description: |-
        This advanced course provides students with the theory and practice of 3D character animation, including development, reference, and acting. It applies advanced rigging principles to animation of characters for computer games, including facial and body dynamics, facial animation capture and motion capture, and animation re-targetting.
      prereqs:
      - course: CST 323
      offered: Spring term only
    CST 446:
      name: User Research and Experience Design
      units: 4
      description: |-
        Covers in-depth user research methodologies used at various stages of product design and development, from conception to product launch. Through hands-on projects, students apply user experience design processes, methods and industry best practices that include design research, interaction design, information architecture, scenario development, user flows, prototyping, user testing and high fidelity visual design specifications.
      prereqs:
      - course: CST 346
      - course: CST 348
      offered: Fall, Spring
    CST 451:
      name: Web Production
      units: 4
      description: |-
        Web-based design and project management continuing the development of skills and techniques introduced in CST 351 . Includes integration of current web technologies and techniques to produce a fully functional website for a client. Topics include Content Management Systems, Project Management, and Usability and Testing.
      prereqs:
      - course: CST 351
      offered: Periodically offered
    CST 461S:
      name: Communication Design Service Learning
      units: 3
      description: |-
        A project-driven Service Learning course in which advanced Communication Design students analyze and solve a design or technical problem for their community partners and their constituents. Students address social injustice issues and combine design and technical skills with professional knowledge to solve the problem. Requirement: concurrent enrollment in a 400-level Communication Design course.
      prereqs: []
      offered: Fall, Spring
      coreqs:
      - any_of:
        - course: CST 451
        - course: CST 421
        - course: CST 404
      prereq_notes:
      - Junior or Senior Standing
    CST 481:
      name: Introduction to Deep Learning
      units: 4
      description: |-
        This course provides an accessible introduction to modern AI methods that power today’s intelligent systems. You will learn how deep learning models are built and trained, explore various deep learning architectures, and gain a practical understanding of how large language models are created. Special attention is given to both the possibilities and the limitations of deep learning, including ethical considerations.
      prereqs:
      - course: CST 381
      offered: Fall term only
      prereq_notes:
      - equivalent
    CST 489:
      name: Capstone Project Planning
      units: 1
      description: |-
        Students create a detailed proposal of a substantial, professional level project with an approval of the student’s capstone advisor. Students learn and practice project planning, collaboration and writing skills required in the industry.
      prereqs:
      - course: CST 349
      offered: Fall, Spring
    CST 495:
      name: Special Topics
      units: 1-4
      description: |-
        Specialized study of a particular topic within the School of Information Technology and Communications Design. May be repeated for additional credit when topics vary and as subjects permit.
      offered: Fall, Spring
    CST 495L:
      name: Special Topics Laboratory
      units: 1-4
      offered: Periodically offered
    CST 496:
      name: Directed Study
      units: 1-6
      description: |-
        Provides a framework for a substantial research and development effort: ideation, proposal writing, project management, presentation, documentation, and/or evaluation. Provides one- on-one guidance on students’ research and development effort within the School of Information Technology and Communications Design disciplines. All students, including non- majors, working on their Capstone projects with faculty members in ITCD must register for CST 496.
      offered: Periodically offered
    CST 497:
      name: Independent Study
      units: 1-4
      description: |-
        Working closely with faculty advisor(s), students finish their capstone project independent of the regular CST 400 / CST 401 sequence. The Capstone Independent Study is offered when there is a compelling reason the student can not participate the CST 400 / CST 401 class.
      offered: Fall, Spring
    CST 498:
      name: Communication Design Capstone
      units: 4
      description: |-
        The course offers students a culminating experience by integrating the knowledge and skills acquired throughout their academic program into a comprehensive communication design project. Students are guided through established design methodologies to produce a prototype of a significant and professionally-oriented project. The course includes user evaluation and the development of detailed documentation reports. Concurrently, students will acquire and refine essential project management, collaboration, and presentation skills that are critical for their future professional careers.
      prereqs:
      - course: CST 346
      - course: CST 348
      offered: Fall, Spring
    CST 500:
      name: Graduate Proseminar
      units: 2
      description: |-
        This course introduces key skills and topics for success in a master’s program in Computer Science. Students will develop competencies in advanced technical communication, research methodologies, and professional ethics. Additional topics include analyzing research papers, formulating research questions, and presenting technical content. Collaborative projects and discussions will prepare students for academic research, professional practice, and career development.
      offered: Fall term only
    CST 501:
      name: Tech Tools for Faculty & Staff
      units: 4-8
      offered: Periodically offered
    CST 511:
      name: Computer Networks
      units: 2
      description: |-
        This course covers fundamental networking concepts, including Local Area Networks (LANs), Wide Area Networks (WANs), and key internet protocols such as TCP/IP. Emphasis is placed on practical applications, network design, and the latest trends in modern networking technologies. Through hands-on activities and case studies, students will explore real-world networking scenarios and emerging developments in the field.
      offered: Spring term only
    CST 515:
      name: Computer Security
      units: 4
      description: |-
        This course covers key concepts in computer security, including cryptography, access control, operating systems security, network security, software security, and blockchain technology. Students will also explore malware analysis, social engineering, and strategies to address modern cybersecurity challenges by understanding both technical and human factors in security.
      offered: Fall term only
    CST 521:
      name: Principles of Programming Languages
      units: 2
      description: |-
        This course provides a focused study of the fundamental principles behind programming language design and implementation. Key topics include syntax, semantics, and type systems, with an introduction to control structures. Students will explore major programming paradigms, such as procedural and functional programming, gaining an understanding of their practical applications and trade-offs.
      offered: Spring term only
