  JAPN-350:
    code: JAPN 350
    title: "World Culture and Language: Japanese"
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course focuses on language use related to the cultures of the Japanese-speaking community. It addresses culture-specific practices and concepts that cannot be translated into English. Students will also learn the use of Japanese to communicate at basic levels in culturally appropriate ways. Taught in English and Japanese.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - GE Areas 1A and 1B and 1C and 2 with a C- or better.
  SPAN-350:
    code: SPAN 350
    title: "World Culture and Language: Spanish"
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course focuses on language use related to the cultures of the Spanish-speaking world. It addresses culture-specific practices and concepts that cannot be translated into English. Students will also learn the use of Spanish to communicate at basic levels in culturally appropriate ways. Taught in English and Spanish. Spanish language functions are taught in cultural context.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - GE Areas 1A and 1B and 1C and 2 with a C- or better.
  CST-205:
    code: CST 205
    title: Multimedia Design and Programming
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Introduces design, creation, and manipulation of interactive applications and electronic media for communication purpose. Focuses on creating media, understanding media concepts, and manipulating the created media using basic programming concepts of control flow, functions, expressions and data types in the Python language. Students acquire a basic understanding for digital media formats, how to design, create such media using basic programming skills.
    offered:
      terms:
        - fall
        - spring
  CST-231:
    code: CST 231
    title: Problem Solving/Programming
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This is an introductory programming course to develop problem-solving techniques for numerical and non-numerical problems. Students will design the solution to each problem and implement it in a programming language. Coverage includes introduction to computer systems, programming language basics, flow control, functions, I/O, arrays, strings, and classes.
    offered:
      terms:
        - fall
        - spring
  CST-237:
    code: CST 237
    title: Intro to Computer Architecture
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Provides students with the fundamental knowledge of computer architectures, hardware and software components of computer systems, interrelationship among different components. Coverage includes introduction to data representation, CPU, assembly programming, memory systems, input/output devices, pipelining, multi-processing systems, operating systems and network architecture.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - courseId: CST-231
      - courseId: MATH-170
  CST-238:
    code: CST 238
    title: Introduction to Data Structures
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This is an intermediate-level programming course with an emphasis on data structures. Coverage includes object-oriented programming, lists, stacks, queues, recursion, trees, sorting, searching, and basic concepts of algorithm analysis.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - allOf:
          - courseId: CST-231
            minimumGrade: C-
          - anyOf:
              - courseId: MATH-130
                minimumGrade: C-
              - courseId: MATH-150
                minimumGrade: C-
