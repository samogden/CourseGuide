    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Students experience the design process for creating a Graphic Identity system for a real-world client. Includes Graphic Standards Guides and client communication.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: CST-304
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 304   with a C- or better)"
  CST-412:
    code: CST 412
    title: Network Administration
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Introduces management tools, skills, and information to design, implement, and manage telecommunications and data communications networks. Includes network design, monitoring, and security.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: CST-311
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 311   with a C- or better)"
  CST-415:
    code: CST 415
    title: Advanced Cybersecurity
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course explores concepts in network security, web application defense, and other emerging cyber threats. Building on basic cybersecurity knowledge, this course examines advanced attack methods and protection techniques across different digital systems. Students will develop offensive and defensive skills, learning to identify vulnerabilities and implement robust security measures. Through hands-on labs and practical activities, students will apply these techniques in realistic scenarios, enhancing their ability to secure and test digital systems effectively.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: CST-311
            minimumGrade: C-
          - courseId: CST-315
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 311   and CST 315   with a C- or better)"
  CST-421:
    code: CST 421
    title: Game Design & Interactive Media II
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Continues the development of game and interactive design and production through collaborative projects with clients. Emphasizes game and interactive design and production skills. Addresses project critique and the proper application of basic principles of game and interactive design and development.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: CST-321
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 321   with a C- or better)"
  CST-422:
    code: CST 422
    title: Level Design
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: "This advanced course provides students with the theory and practice of game level design. The course builds upon the students 3D modeling skills. The major learning outcomes include: using pre-existing assets in a creation of a playable game level, applying adequate theories to directing player’s movement and locus of attention during gameplay."
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-322
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 322   with a C- or better)"
  CST-423:
    code: CST 423
    title: Character Animation
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: This advanced course provides students with the theory and practice of 3D character animation, including development, reference, and acting. It applies advanced rigging principles to animation of characters for computer games, including facial and body dynamics, facial animation capture and motion capture, and animation re-targetting.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-323
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 323   with a C- or better)"
  CST-426:
    code: CST 426
    title: Advanced Game Development
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course provides students with advanced game development skills. Students will learn how to develop procedural content generation techniques for various platforms, and advanced game input techniques . Students will also learn how to apply gamification technique to serious games development. Additionaly, the course discusses ethical considerations in game development, develops interpersonal and oral communication skills, and game design document writing.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: CST-325
            minimumGrade: C-
          - courseId: CST-326
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 325   and CST 326   with a C- or better)"
  CST-438:
    code: CST 438
    title: Software Engineering
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Prepares students for large-scale software development using software engineering principles and techniques. Coverage includes software process, requirements analysis and specification, software design, implementation, testing, and project management. Students are expected to work in teams to carry out a realistic software project.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-338
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 338   with a C- or better)"
  CST-446:
    code: CST 446
    title: User Research and Experience Design
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Covers in-depth user research methodologies used at various stages of product design and development, from conception to product launch. Through hands-on projects, students apply user experience design processes, methods and industry best practices that include design research, interaction design, information architecture, scenario development, user flows, prototyping, user testing and high fidelity visual design specifications.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-346
            minimumGrade: C-
          - courseId: CST-348
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 346   and CST 348   with a C- or better)"
  CST-451:
    code: CST 451
    title: Web Production
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Web-based design and project management continuing the development of skills and techniques introduced in CST 351   . Includes integration of current web technologies and techniques to produce a fully functional website for a client. Topics include Content Management Systems, Project Management, and Usability and Testing.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: CST-351
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 351   with a C- or better)"
  CST-461S:
    code: CST 461S
    title: Communication Design Service Learning
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: "A project-driven Service Learning course in which advanced Communication Design students analyze and solve a design or technical problem for their community partners and their constituents. Students address social injustice issues and combine design and technical skills with professional knowledge to solve the problem. Requirement: concurrent enrollment in a 400-level Communication Design course."
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-451
          - courseId: CST-421
          - courseId: CST-404
    prerequisiteNotes:
      - "[Prereq: (Junior or Senior Standing) and (Coreq: CST 451   or CST 421   or CST 404   )]"
    minimumStanding: junior
  CST-462S:
    code: CST 462S
    title: Race, Gender, Class in the Digital World
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Provides students with key knowledge of race, gender, class and social justice especially in relation to technology in today’s digital world. Students challenge the barriers of expertise, gender, race, class, and location that restrict wider access to and understanding of the production and usage of new technologies. Students will engage in a practical experience in the community via their service placements, which will provide depth and context for considering questions of justice, equality, social responsibilities and the complexities of technology and its societal impact. The course uses scenario based approach combining presentations, discussions, and reflections to allow students explore the relationship between critical reflection and action on the topics mentioned above.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  CST-463:
    code: CST 463
    title: Advanced Machine Learning
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: In this course students learn to use advanced machine learning methods. The advanced machine learning methods include support vector machines, dimensionality reduction, ensemble methods, methods for machine learning with time series data, and especially neural networks.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: CST-383
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 383   with a C- or better)"
  CST-481:
    code: CST 481
    title: Introduction to Deep Learning
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course provides an accessible introduction to modern AI methods that power today’s intelligent systems. You will learn how deep learning models are built and trained, explore various deep learning architectures, and gain a practical understanding of how large language models are created. Special attention is given to both the possibilities and the limitations of deep learning, including ethical considerations.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: CST-381
    prerequisiteNotes:
      - "(Prereq: CST 381   or equivalent)"
  CST-482:
    code: CST 482
    title: AI in Practice
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course focuses on building practical applications with modern AI tools and techniques. You will explore how AI can support productivity, creativity, and problem-solving across domains, with special attention to large language models as a current leading technology. You will learn strategies for interacting effectively with AI systems, including prompt design, and practice integrating models into simple applications using APIs and frameworks. A final project lets you design and present an AI-powered prototype relevant to your field of study.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-381
          - courseId: CST-481
    prerequisiteNotes:
      - "[(Prereq: CST 381   ) and (Prereq or Coreq: CST 481   )]"
