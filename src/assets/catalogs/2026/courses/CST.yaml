      minimum: 4
      maximum: 4
    description: The course offers students a culminating experience by integrating the knowledge and skills acquired throughout their academic program into a comprehensive communication design project. Students are guided through established design methodologies to produce a prototype of a significant and professionally-oriented project. The course includes user evaluation and the development of detailed documentation reports. Concurrently, students will acquire and refine essential project management, collaboration, and presentation skills that are critical for their future professional careers.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-346
            minimumGrade: C-
          - courseId: CST-348
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 346   and CST 348   with a C- or better)"
  CST-499:
    code: CST 499
    title: Computer Science Capstone
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: The course offers students a culminating experience by integrating the knowledge and skills acquired throughout their academic program into a comprehensive project. Students often work on a large group real-world project, exploring the problem space, developing requirement specifications, and proposing a solution followed by design and development of the solution. Concurrently, students will acquire and refine essential project management, collaboration, and presentation skills that are critical for their future professional careers.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - allOf:
          - courseId: CST-349
          - anyOf:
              - courseId: CST-334
              - courseId: CST-370
    prerequisiteNotes:
      - "(Prereq: CST 349   and ( CST 334   or CST 370   ))"
  CST-500:
    code: CST 500
    title: Graduate Proseminar
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: This course introduces key skills and topics for success in a master’s program in Computer Science. Students will develop competencies in advanced technical communication, research methodologies, and professional ethics. Additional topics include analyzing research papers, formulating research questions, and presenting technical content. Collaborative projects and discussions will prepare students for academic research, professional practice, and career development.
    offered:
      terms:
        - fall
  CST-501:
    code: CST 501
    title: Tech Tools for Faculty & Staff
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 8
    offered:
      availability: periodic
  CST-511:
    code: CST 511
    title: Computer Networks
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: This course covers fundamental networking concepts, including Local Area Networks (LANs), Wide Area Networks (WANs), and key internet protocols such as TCP/IP. Emphasis is placed on practical applications, network design, and the latest trends in modern networking technologies. Through hands-on activities and case studies, students will explore real-world networking scenarios and emerging developments in the field.
    offered:
      terms:
        - spring
  CST-515:
    code: CST 515
    title: Computer Security
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course covers key concepts in computer security, including cryptography, access control, operating systems security, network security, software security, and blockchain technology. Students will also explore malware analysis, social engineering, and strategies to address modern cybersecurity challenges by understanding both technical and human factors in security.
    offered:
      terms:
        - fall
  CST-521:
    code: CST 521
    title: Principles of Programming Languages
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: This course provides a focused study of the fundamental principles behind programming language design and implementation. Key topics include syntax, semantics, and type systems, with an introduction to control structures. Students will explore major programming paradigms, such as procedural and functional programming, gaining an understanding of their practical applications and trade-offs.
    offered:
      terms:
        - spring
  CST-523:
    code: CST 523
    title: Compiler Construction
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: This course covers the principles of compiler design, focusing on front-end components such as lexical analysis, syntax analysis, parsing, semantic analysis, and code optimization. Emphasis is placed on translating high-level programming languages into intermediate representations. Students will gain practical experience in constructing front-end components of simple compilers through hands-on projects.
    offered:
      terms:
        - spring
  CST-534:
    code: CST 534
    title: Distributed Systems and Cloud Computing
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course begins with an overview of computer architectures and operating systems as an introduction to modern computer systems. It then delves into distributed systems, focusing on the principles, design, and implementation of scalable, fault-tolerant, and high-performance systems. Topics include distributed algorithms, consensus mechanisms, consistency models, and fault tolerance, as well as computer systems concepts such as resource management, process scheduling, and memory architecture. The course also covers cloud computing architectures, including virtualization and containerization technologies. Students will analyze and develop distributed applications using cloud platforms, with an emphasis on data-intensive systems, resource management, and security.
    offered:
      terms:
        - spring
  CST-538:
    code: CST 538
    title: Advanced Software Engineering
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: "Students work in teams to build modern, concurrent, systems following industry best practices such as: Cl/CD pipelines, test driven development, containerization, and version control. Students will develop a pitch for a project and create a fully functioning demonstration including documentation and a testing suite."
    offered:
      terms:
        - fall
  CST-539:
    code: CST 539
    title: Software Testing
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: This course provides an overview of key software testing techniques and methodologies, focusing on practical applications. Students will learn to design test cases, implement automated scripts, and perform regression and integration testing. Emphasis is placed on adapting testing strategies to agile and DevOps environments using industry-standard tools. Through hands-on exercises, students will gain foundational skills to ensure software quality and reliability.
    offered:
      terms:
        - fall
  CST-542:
    code: CST 542
    title: Computational Thinking
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: An investigation of computing pedagogy through the lens of object-oriented programming. Students will explore computer science curriculum by designing and completing assignments, selecting appropriate content, and evaluating teaching efficacy.
    offered:
      terms:
        - fall
  CST-545:
    code: CST 545
    title: Embedded Development
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: This course introduces embedded systems development, focusing on programming directly on hardware and handling low-level 1/0 interfacing. Key topics include memory-mapped 1/0, interfacing with General Purpose lnpuUOutput (GPIO), and working with development boards. The course also covers considerations for power consumption in embedded systems. Through hands-on projects, students will gain practical experience designing and implementing programs that interact directly with hardware components.
    offered:
      terms:
        - fall
  CST-546:
    code: CST 546
    title: Very Large-Scale Integration Design
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: This course introduces students to the principles of Very Large-Scale Integration (VLSI) design, focusing on the design and development of digital systems from the transistor level up. Key topics include transistor-level design, logic gates, and the use of Field-Programmable Gate Arrays (FPGAs) for prototyping and development. Students will gain practical experience in designing and simulating VLSI circuits, with an emphasis on the real-world applications of VLSI in computer hardware design.
    offered:
      terms:
        - spring
  CST-557:
    code: CST 557
    title: Quantum Computing
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: This course introduces concepts of quantum computing through theoretical exploration and hands-on experimentation. Students will learn about qubits, superposition, and entanglement, and will implement quantum circuits and algorithms using open-source software tools for quantum simulation. Key topics include quantum gates, entanglement, Shor’s and Grover’s algorithms, and quantum error correction. By the end of the course, students will have a practical understanding of quantum computing principles and the ability to experiment with quantum circuits.
    offered:
      terms:
        - spring
  CST-563:
    code: CST 563
    title: Advanced Machine Learning
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: In this course, students learn to use advanced machine learning methods. The advanced machine learning methods include support vector machines, dimensionality reduction, ensemble methods, methods for machine learning with time series data, and especially neural networks.
    offered:
      terms:
        - fall
  CST-570:
    code: CST 570
    title: Design and Analysis of Algorithms
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course provides an in-depth exploration of advanced data structures and algorithmic techniques, designed for graduate students who have a foundational understanding of data structures and algorithms. The course emphasizes both theoretical analysis and practical implementation of efficient solutions to complex problems. Topics include balanced trees, segment trees, amortized analysis, graph algorithms, network flows, dynamic programming, backtracking, complexity theory (P, NP, NP-completeness), and approximation algorithms. Students will engage in advanced topics and current research in the field.
    offered:
      terms:
        - fall
  CST-575:
    code: CST 575
    title: Theory of Computation
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: This course introduces the fundamental theoretical foundations of computer science, with a focus on formal languages, automata theory, and computability. Students will explore regular languages, context-free languages, and Turing machines, along with the concepts of decidability and undecidability.
    offered:
      terms:
        - spring
  CST-583:
    code: CST 583
    title: Advanced Data Science
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course covers key topics in data science, including data preparation, exploratory data analysis, statistics, machine learning, and data visualization. Students will learn how to manage, preprocess, analyze, and visualize data, as well as apply machine learning methods to uncover patterns and make predictions.
    offered:
      terms:
        - spring
  CST-594:
    code: CST 594
    title: Graduate Internship/Practicum
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 4
    description: Students work with practicing professionals in the community in a volunteer or paid internship that requires critical thinking and applied computing skills.
    offered:
      availability: periodic
  CST-597:
    code: CST 597
    title: Graduate Independent Study in Computer Science
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 4
    description: Research and/or project work under the supervision of a program faculty.
    offered:
      availability: periodic
  CST-695:
    code: CST 695
    title: Graduate Special Topics in Computer Science
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 4
    description: This course covers selected advanced topics in computer science, varying by semester and based on current trends or faculty expertise.
    offered:
      availability: periodic
  CST-696:
    code: CST 696
    title: Graduate Directed Study
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 4
    description: This course offers students the opportunity for independent study or research under the supervision of a faculty member. A formal study plan, including objectives and deliverables, is developed in collaboration with the supervising faculty.
    offered:
      availability: periodic
  CST-697:
    code: CST 697
    title: Thesis Planning
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: This course prepares students for the development and completion of a graduate thesis by guiding them through the process of selecting a research topic, formulating research questions, and developing a thesis proposal. Working closely with a faculty advisor, students will engage in literature review, refine their research methodologies, and establish a clear research plan. By the end of the course, students will have an approved thesis proposal and be ready to proceed with their research in the Graduate Thesis course.
    offered:
      terms:
        - fall
        - spring
  CST-698:
    code: CST 698
    title: Graduate Thesis
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course is the culmination of the thesis research process. Under the supervision of a faculty advisor, students will conduct their approved research, analyze their findings, and produce a formal written thesis. Emphasis is placed on rigorous research methodologies, critical analysis, and effective presentation of results. Students will be required to defend their thesis through both written and oral presentations to a faculty committee. Successful completion of the course requires the approval of the thesis committee.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - courseId: CST-697
    prerequisiteNotes:
      - "(Prereq: CST 697)"
  CST-699:
    code: CST 699
    title: Graduate Capstone
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course serves as the culminating experience for the MS in Computer Science, focused on the completion of a project-based capstone. Students will apply advanced concepts, technical skills, and methodologies acquired throughout the program to design, implement, and present a comprehensive project that addresses a real-world problem or provides an innovative solution in computer science. The course emphasizes project planning, development, testing, documentation, and effective communication of results. Under the guidance of a faculty or project advisor, students will produce a professional-quality project report and deliver a formal presentation that demonstrates their technical expertise and readiness for the professional field.
    offered:
      terms:
        - fall
        - spring
