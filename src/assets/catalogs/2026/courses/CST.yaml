      availability: periodic
  CST-345:
    code: CST 345
    title: Visual Thinking
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Students use the design process to strengthen their visual intelligence and vocabulary for communicating ideas. Course emphasizes ideation, systems thinking, and translating complex ideas using various tools and strategies.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-227
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 227   with a C- or better)"
  CST-346:
    code: CST 346
    title: Human-Computer Interaction
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Explores the fundamental concepts and design processes of the interdisciplinary field of human-computer interaction (HCI) that integrates theories and methodologies across multiple domains, such as cognitive psychology, human factors, and systems design. Through readings and hands-on exercises, students gain an understanding of the components involved in designing for universal audiences, social and emotional user experiences, usable products, emerging technologies and the impact on society.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "(Prereq: Junior OR Senior Standing)"
    minimumStanding: junior
  CST-348:
    code: CST 348
    title: Communication Design Proseminar
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: The course offers a comprehensive overview of the Communication Design major and its requirements. Students are guided in identifying and articulating personal, professional, and social objectives while formulating a plan to achieve their learning goals. Additionally, students engage in the analysis, prediction, and articulation of industry trends as they begin to establish their professional creative portfolios.
    offered:
      terms:
        - fall
    prerequisiteNotes:
      - (Junior Standing Required)
    minimumStanding: junior
  CST-349:
    code: CST 349
    title: Computer Science Proseminar
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: The Proseminar course helps students prepare for ‘life after college’ by connecting their major to their broader personal and professional goals. In this course, students will critically analyze information from diverse sources, including academic and business literature and conversations with industry mentors. They will also develop crucial problem-solving, communication, and teamwork skills throughout the course. This analysis and skill development will guide them in crafting their personal value proposition and a plan for developing a professional portfolio.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - (Junior Standing Required)
    minimumStanding: junior
  CST-350:
    code: CST 350
    title: Web Scripting
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Students learn the fundamental concepts of web programming plus designing, coding, testing, debugging, and documenting of computer programs. Using JavaScript, students apply those concepts to create interactive programs including incorporating images, animation, audio, video, and text.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-251
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 251   with a C- or better)"
  CST-351:
    code: CST 351
    title: Web Design
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Covers web design aesthetics, layout, structure and universal design. Applies the design process and systems design principles using web templates and web content management systems.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: CST-201
            minimumGrade: C-
          - courseId: CST-251
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 201   and CST 251   with a C- or better)"
  CST-352:
    code: CST 352
    title: Web Scripting
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Introduces technical skills required to create dynamic websites using scripting languages and database integration. Covers frontend and backend web technologies that allow users to retrieve, add, delete, and update records from a website.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: CST-252
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 252   with a C- or better)"
  CST-362S:
    code: CST 362S
    title: Technology & Communities SL
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    offered:
      availability: periodic
  CST-363:
    code: CST 363
    title: Introduction to Database Systems
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course provides balanced coverage of database use and design,focusing on relational databases. Students will learn to design relational schemas, write SQL queries, access a DB programmatically,and perform database administration. Students will gain a working knowledge of the algorithms and data structures used in query evaluation and transaction processing. Students will also learn to apply newer database technologies such as XML, NoSQL, and Hadoop.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-238
            minimumGrade: C-
          - courseId: MATH-130
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 238   and MATH 130   with a C- or better)"
  CST-370:
    code: CST 370
    title: Design and Analysis of Algorithms
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Students learn important data structures in computer science and acquire fundamental algorithm design techniques to get the efficient solutions to several computing problems from various disciplines. Topics include the analysis of algorithm efficiency, hash, heap, graph, tree, sorting and searching, brute force, divide-and-conquer, decrease-and-conquer, transform-and-conquer, dynamic programming, and greedy programming.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-238
            minimumGrade: C-
          - courseId: MATH-170
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 238   and MATH 170   with a C- or better)"
  CST-373:
    code: CST 373
    title: Ethics in Comm & Tech
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Investigates through an ethical perspective how communication technology affects our lives. Discusses individual and institutional values represented through technological choices. Using case studies and current events, explores such issues as intellectual property rights, information access and privacy, and the digital divide.
    offered:
      availability: periodic
  CST-375:
    code: CST 375
    title: Brand Strategies for Designers
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Covers the essential components and elements that make up successful brands and how to map out a brand strategy employing current brand development tools and processes. Through readings, lectures and hands-on projects, students explore how brands go beyond logos and visual identity systems to include all aspects of a business that connect consumer needs, emotions and the competitive market environment.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-227
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 227   with a C- or better or (Instructor Consent)"
  CST-377:
    code: CST 377
    title: Business of Design
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Introduces design industry best practices and prepares students for a design career. Identifies the roles and responsibilities of employers, clients and designers. Topics include the recent legal and technological developments that affect the design profession. It addresses the different design trade customs, rates, salaries, copyrights, contracts, pricing and state and federal taxes.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: CST-348
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 348   with a C- or better)"
  CST-380:
    code: CST 380
    title: Mobile and Ubiquitous Computing
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course focuses on mobile-oriented development and the specific challenges and considerations that must be made. Students will learn how to develop applications for mobile and ubiquitous devices, as well as important topics related to the deployment of mobile-oriented applications. Topics include distributed data management, user interaction design, energy management, and programming languages.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-238
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 238   with a C- or better)"
  CST-381:
    code: CST 381
    title: Foundations of Data Science for AI
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course introduces the core ideas and tools of data science for students from any discipline. You will learn how to explore, visualize, analyze data, and apply basic machine learning methods to real-world datasets. By the end of the course, you will be able to make sense of data and communicate insights clearly.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-319
          - courseId: BIO-380
    prerequisiteNotes:
      - "(Prereq: CST 319   or BIO 380   )"
  CST-383:
    code: CST 383
    title: Introduction to Data Science
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: In data science, data analysis and machine learning techniques are applied to visualize data, understand trends, and make predictions. In this course students will learn how to obtain data, preprocess it, apply machine learning methods, and visualize the results. A student who completes the course will have enough theoretical knowledge, and enough skill with modern statistical programming languages and their libraries, to define and perform complete data science projects.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-238
            minimumGrade: C-
          - courseId: BIO-380
            minimumGrade: C-
          - allOf:
              - courseId: CST-319
                minimumGrade: C-
              - anyOf:
                  - courseId: STAT-100
                    minimumGrade: C-
                  - courseId: STAT-250
                    minimumGrade: C-
                  - courseId: MATH-320
                    minimumGrade: C-
                  - courseId: BUS-204
