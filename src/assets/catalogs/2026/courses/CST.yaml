    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This project-based course uses the steps of the design process to create publications for print and screen delivery. Principles of page layout design, information architecture, and digital production skills are emphasized. A laptop and knowledge of InDesign and Illustrator are required.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-304
