schemaVersion: 1
prefix: CST
courses:
  CST-195:
    code: CST 195
    title: Special Topics
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 4
    description: Specialized study of a particular topic within the School of Information Technology and Communication Design. May be repeated for additional credit when topics vary and as subjects permit.
    offered:
      availability: periodic
  CST-196:
    code: CST 196
    title: Field Studies
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 6
    description: Students work with faculty to collect data and user feedback by going to the site of the user and unobtrusively observing the user function in their own environment. This course is usually conducted as part of a large research project.
    offered:
      availability: periodic
  CST-197:
    code: CST 197
    title: Independent Study
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 6
    description: Working with a faculty advisor, a student selects topic of study and number of credits appropriate to the student’s learning plan. An independent study proposal must be submitted and approved before registration.
    offered:
      availability: periodic
  CST-201:
    code: CST 201
    title: Media Tools I
    teachingStatus: inactive
    credits:
      minimum: 4
      maximum: 4
    description: Explores computer-based tools used in the design and creation of electronic media. Includes designing, creating, and editing electronic images, sounds, videos, text, and motion.
    offered:
      terms:
        - fall
        - spring
  CST-202:
    code: CST 202
    title: Drawing for Digital Media
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: This course covers concepts and drawing skills related to the use of drawing and visualization in both the studio and digital environment. The course integrates studio drawing and illustration with digital technology, covering hand rendering, scanning, auto-tracing, photo conversion, vector art and bitmap drawing using digital visualization and illustration hardware and software. Included topics are 2D and 3D design, drawing, storyboarding and illustration (traditional and digital).
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "(Coreq: CST 202L   )"
  CST-202L:
    code: CST 202L
    title: Drawing for Digital Media Lab
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 1
    description: "Drawing for Digital Media Lab: This lab is offered as a co-requisite with the CST 202   lecture section. Students will use studio and digital tools to complete projects that relate directly to the lecture content. Students are expected to be comfortable with studio drawing tools as well as digital image software and have an ability to functionally adapt to new software. Students must take the lab during the same semester as the lecture. Students are expected to supply their own studio drawing materials, such as pencils, tablets of drawing paper, etc."
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "(Coreq: CST 202)"
  CST-203:
    code: CST 203
    title: Digital Color
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 1
    description: "Digital Color: This course introduces students to the nomenclature, technical components, theories and principles, and cultural associations of color relevant to professional communication designers. Students will demonstrate understanding of key concepts by completing design projects using Illustrator, InDesign, Photoshop and Dreamweaver."
    offered:
      availability: periodic
  CST-203L:
    code: CST 203L
    title: Digital Color Lab
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 1
    description: "Digital Color Lab: This course introduces students to the nomenclature, technical components, theories and principles, and cultural associations of color relevant to professional communication designers. Students will demonstrate understanding of key concepts by completing design projects using Illustrator, InDesign, Photoshop and Dreamweaver."
    offered:
      availability: periodic
  CST-204:
    code: CST 204
    title: Introduction to Typography
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Introduces the history of type, type fonts, principles of letterform design, professional typesetting skills, layout for screen and print delivery. Subjects include the history and construction of letter forms, typographic composition and typesetting principles and techniques.
    offered:
      terms:
        - fall
  CST-205:
    code: CST 205
    title: Multimedia Design and Programming
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Introduces design, creation, and manipulation of interactive applications and electronic media for communication purpose. Focuses on creating media, understanding media concepts, and manipulating the created media using basic programming concepts of control flow, functions, expressions and data types in the Python language. Students acquire a basic understanding for digital media formats, how to design, create such media using basic programming skills.
    offered:
      terms:
        - fall
        - spring
  CST-226:
    code: CST 226
    title: Digital Photography
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Teaches use of digitally based image acquisition and manipulation tools to capture and modify photographic images for use in print and screen-based media. Has two major instructional components. The initial instruction sets are based around conventional photographic principles such as lighting, composition, subject matter, and how digital capture processes affect these. The second component deals with image adjustment and delivery. Deals with aesthetic aspects of photography.
    offered:
      terms:
        - fall
        - spring
  CST-227:
    code: CST 227
    title: Design Fundamentals
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This project-based course combines the study of visual design and aesthetic principles while developing skills to produce digital graphic media. Students study historic design trends, typography, color theory, and production for cross-media production. Students apply the steps of the Design Process to create original vector and bitmapped imagery to solve visual communication design problems.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-201
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 201   with a C- or better)"
  CST-230:
    code: CST 230
    title: Media Tools II
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Integrates audio, video, and animation authoring software to design, manage, and create a multimedia project. Includes planning, sketching, and storyboarding a video project. Introduces tools and techniques to create audio and visual digital effects. Covers essential design principles and video composition.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-201
    prerequisiteNotes:
      - "(Prereq: CST 201   or equivalent)"
  CST-231:
    code: CST 231
    title: Problem Solving/Programming
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This is an introductory programming course to develop problem-solving techniques for numerical and non-numerical problems. Students will design the solution to each problem and implement it in a programming language. Coverage includes introduction to computer systems, programming language basics, flow control, functions, I/O, arrays, strings, and classes.
    offered:
      terms:
        - fall
        - spring
  CST-234:
    code: CST 234
    title: Intro to Operating Systems
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Introduces modern operating systems such as Unix and topics such as process management (creation, synchronization, and communication); processor scheduling; deadlock prevention, avoidance, and recovery; main-memory management; virtual memory management (swapping, paging, segmentation and page-replacement algorithms); control of disks and other input/output devices; file-system structure and implementation; and protection and security.
    offered:
      availability: periodic
  CST-236:
    code: CST 236
    title: Computing for Designers
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Introduction to the use of computers for digital media creations, this course covers the fundamentals of how computers work in the creation of digital media for commercial entertainment and fine art purposes; including hardware components, operating principles, software basics, memory management, storage, programming basics for vector and bitmap functions, compression schemes and basic scripting.
    offered:
      terms:
        - spring
  CST-237:
    code: CST 237
    title: Intro to Computer Architecture
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Provides students with the fundamental knowledge of computer architectures, hardware and software components of computer systems, interrelationship among different components. Coverage includes introduction to data representation, CPU, assembly programming, memory systems, input/output devices, pipelining, multi-processing systems, operating systems and network architecture.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-231
            minimumGrade: C-
          - courseId: MATH-170
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 231   and MATH 170   with a C- or better)"
  CST-238:
    code: CST 238
    title: Introduction to Data Structures
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This is an intermediate-level programming course with an emphasis on data structures. Coverage includes object-oriented programming, lists, stacks, queues, recursion, trees, sorting, searching, and basic concepts of algorithm analysis.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - allOf:
          - courseId: CST-231
            minimumGrade: C-
          - anyOf:
              - courseId: MATH-130
                minimumGrade: C-
              - courseId: MATH-150
                minimumGrade: C-
    prerequisiteNotes:
      - "[(Prereq: CST 231)   and (Coreq or Prereq: MATH 130   or MATH 150   ) with a C- or better]"
  CST-251:
    code: CST 251
    title: Web Tools
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Introduces students to the tools and methods of web design and production. Students will learn basic HTML, web design tools, Cascading Style Sheets (CSS) and browser compatibility while applying the design principles of information architecture, color, layout, and type.
    offered:
      terms:
        - fall
        - spring
  CST-252:
    code: CST 252
    title: Scripting for Multimedia
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Students learn HTML5 and related technologies including HTML, CSS3, Canvas, JavaScript and jQuery to create dynamic multimedia content. Students learn the fundamental concepts of web programming plus designing, coding, testing, debugging, and documenting of computer programs. Using JavaScript, students apply those concepts to create programs utilizing digital media, including images, animation, audio, video and text. This is a laboratory class using Windows or Macintosh computers.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-251
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 251   with a C- or better)"
  CST-263:
    code: CST 263
    title: Intro to Database Systems
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 4
    description: This course is an introduction to Relational Database Management Systems. Topics covered will include relational database theory and the logical and physical design, implementation, and management of databases. Additional topics will include Entity-Relationship Diagrams, Normalization and an introduction to SQL (Structured Query Language).
    offered:
      availability: periodic
  CST-271:
    code: CST 271
    title: Digital Culture
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Focuses on the philosophical roots (as evidenced in literature) of contemporary digital culture. From Armageddon to the Matrix; from Frankenstein to Lawnmower man; from the library at Alexandria to the archives of the Internet; the world of the digital intelligentsia owes its vision and mythology to the resonant themes found in literature and philosophy. Explores the essence of humanity that defines the natural world and strives to remake it in a more perfect fashion.
    offered:
      terms:
        - fall
        - spring
  CST-273:
    code: CST 273
    title: Cyberdemocracy
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Explores the implications of new communication technologies with regard to democracy, social activism, cultural identity, and social equity in the United States. Democracy cannot be separated from the issue of social identity since throughout our history many groups were excluded from political participation. Explores whether new media like the Internet will increasingly make identity irrelevant, or will create greater fragmentation.
    offered:
      terms:
        - fall
        - spring
  CST-274:
    code: CST 274
    title: History of Communication Technologies and Politics in America
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Examines the history of communication technologies and how they shaped and have been shaped by politics throughout American history. The story begins in pre-revolutionary America, when newspapers united the colonies, and moves through the telegraph, the telephone, motion pictures, radio, broadcasting, network and cable television, personal computers, the Internet, mobile phones, and social media. Students leverage their understanding of communication history to address some of constitutive choices facing our nation, including foreign interference in elections, net neutrality, and data privacy.
    offered:
      terms:
        - fall
        - spring
  CST-286:
    code: CST 286
    title: Physics of Computing
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Catalog details are still being added.
    offered:
      terms:
        - fall
    placeholder: true
  CST-300:
    code: CST 300
    title: Graduation Writing Assessment for Computing and Design
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course develops critical reading and writing skills for Computing, Design, and Technology fields. Students will learn to adapt their writing for different audiences and purposes, adhering to disciplinary conventions. The curriculum covers expository and academic writing, professional communication, source selection, and effective communication with diverse audiences.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "[Prereq: ( GE   Area 1A and 1B and 1C with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  CST-302:
    code: CST 302
    title: History of Communication Design
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Surveys the development of communication design in modern history, viewed in the context of contemporary political, scientific, and cultural influences. Communication design includes disciplines such as graphic design, web design, advertising, instructional design, digital media, animation, digital illustration, interactive design and motion graphics.
    offered:
      terms:
        - spring
    prerequisiteNotes:
      - "[Prereq: ( GE   Area 1A and 1B and 1C and 2 with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  CST-304:
    code: CST 304
    title: Typography
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Typography is the art of designing letterforms, alphabets and creating compositions with letters and words. This course explains typographic practices to develop an eye for type and how to use it effectively.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-227
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 227   with a C- or better)"
  CST-311:
    code: CST 311
    title: Introduction to Computer Networks
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Survey of Telecomm and Data Comm Technology Fundamentals, Local Area Network, Wide Area Network, Internet and internetworking protocols including TCP/IP, network security and performance, emerging industry trends such as voice over the network and high speed networking. Designed as a foundation for students who wish to pursue more advanced network studies including certificate programs. Includes hands-on networking labs that incorporate Cisco CCNA lab components.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-238
            minimumGrade: C-
          - courseId: MATH-130
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 238   and MATH 130   with a C- or better)"
  CST-312:
    code: CST 312
    title: Network Security
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Focuses on the theory, practice and technologies for securing computers on the web and the Internet. Students will learn cryptographic tools and how they are used by standard network security protocols like SSL/TLS, IPSEC, Kerberos, PGP, S/MIME, and wireless. Students will also learn about ethical hacking and policies and procedures to protect against such hacking.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: CST-311
            minimumGrade: C-
          - courseId: MATH-170
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 311   and MATH 170   with a C- or better)"
  CST-315:
    code: CST 315
    title: Introduction to Cybersecurity
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course provides a comprehensive introduction to cybersecurity fundamentals and the core technologies protecting digital assets. Students will explore key areas including cryptography, access control mechanisms, malware analysis, and social engineering tactics. By integrating technical concepts with human factors in security, the course equips participants with essential skills to navigate and address contemporary cybersecurity challenges.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-238
            minimumGrade: C-
          - courseId: MATH-130
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 238   and MATH 130   with a C- or better)"
  CST-316:
    code: CST 316
    title: Computing for Designers
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course encompasses the fundamental principles of computer operations relevant to the creation of digital media. The curriculum covers essential topics including hardware components, operating principles, basic software functionalities, memory management, data storage, programming fundamentals, compression techniques, and advanced technologies that enhance the efficiency and effectiveness of the design process. Additionally, the course introduces students to artificial intelligence concepts and the practical application in production.
    offered:
      terms:
        - spring
  CST-319:
    code: CST 319
    title: Computing Across the Disciplines
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Students will develop basic programming skills by writing Python programs. Besides learning programming concepts such as data types, functions, expressions and control flow, students will work with real-world data to practice their problem-solving techniques. The programs students write will also strengthen programming skills using concepts in probability, linear algebra, and modeling.
    offered:
      terms:
        - fall
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  CST-320:
    code: CST 320
    title: Intro to Digital Games
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Focuses on the fundamental issues in the development of digital games. Discusses components of modern digital games and their relationships, historical development of contemporary video and computer gaming, team member roles and tasks within the production process. Covers relationships of the conceptual creative and technical production to overall game development and analyzes the business, marketing and industry components of game development.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-238
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 238   with a C- or better)"
  CST-321:
    code: CST 321
    title: Game Design and Interactive Media I
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Presents the principles of game and related interactive media design. Students design and create games and interactives using analog and digitally-based authoring tools. Includes project management, production, and asset management of images, text, sound, animation, and computer code.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-227
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 227   with a C- or better)"
  CST-322:
    code: CST 322
    title: Environment Modeling
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: The course equips students with the fundamental skills needed for the development of games. After first developing with basic 3D modelling skills, student learn how to model, texture and light complex objects and scenes using industry standard tools.
    offered:
      terms:
        - fall
  CST-323:
    code: CST 323
    title: Character Design
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: The course equips students with the fundamental skills needed for the design of 3D character models. Students learn how to apply industry best-practice and tools to character designing and modeling process. Drawing skills are recommended, but not required to succeed in the class.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: CST-202
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 202   with a C- or better)"
  CST-325:
    code: CST 325
    title: Graphics Programming
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course teaches the students the fundamentals of game programming and skills needed for game development, including GPU programming, matrix and quaternion algebra for physics calculation, animation, lighting and basics of implementing 3D models into a framework.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-238
            minimumGrade: C-
          - courseId: MATH-130
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 238   and MATH 130   with a C- or better)"
  CST-326:
    code: CST 326
    title: Game Development
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course provides students with fundamental and transferable game programming skills. Students will learn how to develop games using a game engine and a toolset of object-oriented programming techniques, design patterns and software engineering paradigms. Additionaly, the course discusses ethical considerations in game development, develops interpersonal and oral communication skills, and game design document writing.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-238
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 238   with a C- or better)"
  CST-327:
    code: CST 327
    title: Experimental Typography
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Explores an advanced study of typography across various domains of design. Solves complex problems with conceptual and experimental approaches that challenge typographic conventions through the production of innovative and dynamic communication designs.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-304
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 304   with a C- or better)"
  CST-328:
    code: CST 328
    title: Digital Art and Design
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: A survey course that combines the study of technology, design and aesthetic principles as they apply to twenty-first century visual media. Students learn how fundamental concepts of art and design apply to a broad range of commercial, expressive and entertainment forms. Students also study the democratization of the creative process through digital media, using current technology to produce sophisticated and expressive examples of personal digital creativity.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  CST-329:
    code: CST 329
    title: Reasoning with Logic
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: In this course students learn to develop skill in using logic to describe and assess arguments. Students will learn to write formulas in propositional and first-order logic, and more importantly, to write and check proofs. Students will also learn to write formulas in three-valued and modal logic, know how to choose an appropriate logic, and understand the limitations of logic in capturing human reasoning.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: MATH-170
            minimumGrade: C-
    prerequisiteNotes:
      - "[(Prereq: ( GE   Area 1A and 1B and 1C and 2) and ( MATH 170   ) with a C- or better)]"
  CST-330:
    code: CST 330
    title: Media Tools II
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Integrates audio, video, and animation authoring software to design, manage, and create a multimedia project. Includes planning, sketching, and storyboarding a video project. Introduces tools and techniques to create audio and visual digital effects. Covers essential design principles and video composition.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-201
    prerequisiteNotes:
      - "(Prereq: CST 201   or equivalent)"
  CST-333:
    code: CST 333
    title: Topics In Object-Oriented Prog
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: CST-231
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 231   with a C- or better)"
  CST-334:
    code: CST 334
    title: Operating Systems
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Students in this course will learn about the use and design of modern operating systems, focusing on Linux. On the “use” side, students will learn the Linux command line, to write shell scripts, and to build programs with GNU utilities like awk, sed, and make. On the “design” side, students will develop a deep understanding of process management, memory management, file systems, and concurrency, and how they apply to modern technologies like virtualization and cloud computing.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-237
            minimumGrade: C-
          - courseId: CST-238
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 237   and CST 238   with a C- or better)"
  CST-336:
    code: CST 336
    title: Internet Programming
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Provides students with dynamic web application development skills, focusing on the integration of server-side programming, database connectivity, and client-side scripting. Coverage includes the Internet architecture, responsive design, RESTful web services, and Web APIs.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-238
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 238   with a C- or better)"
  CST-337:
    code: CST 337
    title: Computer Architecture
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Provides students with the fundamental knowledge of computer architectures, hardware and software components of computer systems, interrelationship among different components. Coverage includes introduction to data representation, CPU, assembly programming, memory systems, input/output devices, pipelining, multi-processing systems, operating systems and network architecture.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: CST-231
            minimumGrade: C-
          - courseId: MATH-170
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: CST 231   and MATH 170   with a C- or better)"
  CST-338:
    code: CST 338
    title: Software Design
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This is an intermediate-level programming course covering techniques for developing large-scale software systems using object-oriented programming. Coverage includes software development life cycle models, requirements analysis, and graphical user interface development.
    offered:
      terms:
