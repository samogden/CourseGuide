  MPA-373:
    code: MPA 373
    title: Advanced Chromatic Theory
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course provides an advanced investigation into the application of principles established in the music theory sequence through advanced musical analysis and composition that builds upon the theoretical principles and concepts presented in lower division music theory courses, including an array of secondary dominant functions, modulations using diatonic common chords, and other modulatory techniques, such as larger form terminology and analysis. Along with concepts related to mode mixtures and the Neapolitan Chords, students will practice augmented sixth chords and gain a deeper understanding of tonal harmony from the nineteenth century to the present. A general comprehension of chromatic harmony concepts and an introduction to composing software are highly recommended for this course.
    offered:
      terms:
        - spring
    prerequisiteNotes:
      - "(Prereq: Junior or Senior Standing)"
    minimumStanding: junior
