  SSCI-450:
    code: SSCI 450
    title: Congress/Intrnshp/Adm/Leg/Oper
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Students are assigned to the office of a U.S. Representative who is a member of the California congressional delegation in Washington D.C. and spend a semester participating firsthand in American government. Participants examine administrative organization, methods, systems and procedures, problem solving, and systems analysis. Formerly known as SBSC 450.
