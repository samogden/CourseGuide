        - spring
  ENVS-660:
    code: ENVS 660
    title: Professional Environmental Science
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Addresses current environmental issues using advanced research methods and sound science. Students work in teams to complete applied research projects with regional stakeholders addressing real-world problems. Considers issues from multiple perspectives, including legal, political, diverse communities, and natural sciences. Students present project results in both written and oral formats, utilizing innovative visualizations to communicate technical science to stakeholders and/or decision makers.
    offered:
      terms:
        - fall
    prerequisites:
      - courseId: ENVS-560
    prerequisiteNotes:
      - "(Prereq: ENVS 560   )"
