  WLC-201:
    code: WLC 201
    title: Intermediate World Languages
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Alternative assessment for the third semester of World Languages. Freshmen and Sophomore transfers attempting to satisfy the Language Requirement through assessment must enroll in WLC 201. Junior and senior transfers attempting to satisfy the Language Requirement through assessment, must also enroll in WLC 201. (Letter Grade Available)
    offered:
      availability: periodic
  WLC-212:
    code: WLC 212
    title: Language and Culture for Heritage Speakers
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course is for heritage speakers who have a moderate proficiency in their Heritage language, other than Spanish, but have completed little or no formal study of that language. The course emphasizes the linguistic and cultural aspects of language ability, and learning strategies; provides an introduction to linguistics, and second language acquisition; incorporates 21st Century Skills and National Standards; and encourages students to explore the social implications of language use. Students will demonstrate language proficiency through assessment. Conducted in English.
    offered:
      terms:
        - spring
  WLC-230:
    code: WLC 230
    title: "Academic Life in U.S: Cross Cultural Studies"
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: Your study abroad experience in America is potentially a rich opportunity for you to enhance your language skills and deepen your understanding of other cultures, people and their practices. This course provides the resources to help you have meaningful American College experiences.
    offered:
      terms:
        - fall
  WLC-250:
    code: WLC 250
    title: Academic English Reading and Writing
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course is offered to students who are non-native speakers of English and who wish to develop advanced academic reading and writing skills. These skills include understanding the structure and conventions of written work in various academic disciplines, analyzing and responding to assigned texts, and making effective choices in writing for specific academic situations. The course will cover strategies for reading, writing, and conducting research at an American university.
    offered:
      terms:
        - fall
        - spring
