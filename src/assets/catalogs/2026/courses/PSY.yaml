  PSY-348:
    code: PSY 348
    title: How to Love
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: "How to Love is an interdisciplinary course on the art and science of love. Examine relevant scholarship on love and intimacy from psychology, feminism, philosophy, and human development. Learn evidence-informed practices to cultivate healthy development and love, including how to: identify feelings, communicate respectfully, set boundaries, and foster self-love. Though this class may be therapeutic, it is not therapy. This course is simply one avenue to enrich students’ ongoing self-development."
    offered:
      terms:
        - fall
        - spring
    prerequisites:
