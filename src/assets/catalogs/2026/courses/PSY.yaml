          - courseId: PSY-300
    prerequisiteNotes:
      - "[(Prereq: ( PSY 100 and STAT 100 and PSY 200 and PSY 200L ) OR ( PSY 300 ))]"
  PSY-353:
    code: PSY 353
    title: Social Psychology of Gender
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Explores the ways in which social psychological processes are influenced by societal norms around notions of gender. In doing so, students will be introduced to how culture, social class, and sexuality shape people’s experiences of what it means to be a woman or man in contemporary U.S. society. The course also includes discussions of how power dynamics influence people’s understanding of gender from a social psychological perspective.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: PSY-100
          - courseId: STAT-100
          - courseId: PSY-200
          - courseId: PSY-200L
          - courseId: PSY-300
    prerequisiteNotes:
      - "[(Prereq: ( PSY 100 and STAT 100 and PSY 200 and PSY 200L ) OR ( PSY 300 ))]"
  PSY-355:
    code: PSY 355
    title: Social Psychology and Social Justice
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: "This course explores the relationship between social psychology as an academic discipline and struggles towards social justice. We address questions such as: How can social psychology be used to improve the material lives of disadvantaged groups? How does academic scholarship relate to the lives of those not present in academic settings? Discussions will include implications for social policy."
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: PSY-100
          - courseId: STAT-100
          - courseId: PSY-200
          - courseId: PSY-200L
          - courseId: PSY-300
    prerequisiteNotes:
      - "[(Prereq: ( PSY 100 and STAT 100 and PSY 200 and PSY 200L ) OR ( PSY 300 ))]"
  PSY-357:
    code: PSY 357
    title: Psychology of Liberation and Healing
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Grounded in liberation psychology, the readings and class discussions explore practices to heal oneself and our communities amidst historical and contemporary oppression. Emphasis will be placed on how Communities of Color have resisted oppression and worked to heal disconnections. The course creates an opportunity for hands-on research experience and an opportunity to catalyze social change by planting “seeds” in order to sow liberation. (Crosslisted/Equivalent with ES 357 )
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: PSY-100
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( GE Area 1A and 1B and 1C and 2 with a C- or better) and ( PSY 100 )]"
