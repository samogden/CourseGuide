          - courseId: PSY-200L
          - courseId: PSY-300
          - courseId: PSY-350L
    prerequisiteNotes:
      - "[(Prereq: ( PSY 100 and STAT 100 and PSY 200 and PSY 200L ) OR ( PSY 300 )) and (Coreq: PSY 350L )]"
