    title: Cognitive Development
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: "Cognition in children from infancy through adolescence. Basic and current research on children’s understanding of the social and physical world. Focus on major theoretical perspectives: Piaget’s constructivist approach, information processing approach, and sociocultural approach."
