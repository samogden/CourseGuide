    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Psychology theories and research will be used to critically examine issues of justice, diversity, ethics, empathy, and social responsibility in the context of community service. Reflection through seminar discussions will enhance exploration of mental health stigma, multicultural identities, and professional growth. The course will be enhanced by instructor expertise and community partnerships for the semester. Requires 3-5 hours of community service each week, for a total of at least 30 hours.
