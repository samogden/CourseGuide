    title: Social & Emotional Development
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: An examination of contemporary theory and research on social and emotional psychological development from infancy through childhood.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
