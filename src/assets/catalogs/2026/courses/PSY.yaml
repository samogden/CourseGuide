  PSY-350:
    code: PSY 350
    title: Social Psychology
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: "Social psychology is a scientific area in the discipline of psychology that seeks an understanding of how people feel, think, and behave in social situations. Students are introduced to the theories, research methods, and seminal findings of social psychology. Topics covered include: attitudes, perceptions of others, social influence, social identity and the self, attraction, aggression, and intergroup dynamics."
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: PSY-100
          - courseId: STAT-100
