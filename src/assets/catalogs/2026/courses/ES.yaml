schemaVersion: 1
prefix: ES
courses:
  ES-191:
    code: ES 191
    title: Comp. Ethnic Experiences
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Using texts from several genres including short stories and poems, as well as film and other cultural forms, students examine ethnic American experiences. Students explore how human experiences may be mediated by social differences, and how affinities between ethnic groups are rendered visible when we approach works comparatively. A first year seminar, the course integrates these topics with orientation, academic planning and skill development to support student success in the university. (Crosslisted/Equivalent with FYS 191   )
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - (Freshman Standing)
  ES-220:
    code: ES 220
    title: Afro Cuba Hip Hop - Music and Dance in the Black Atlantic
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Explores the social history of music and dance throughout the African Diaspora. Students learn specific styles from Cuba, Puerto Rico, Brazil and the United States including Afro-Cuban liturgical dance, rumba, salsa, samba, and hip hop. Students dance the music they study. Students become familiar with basic concepts in African Diaspora music and dance; identify and analyze trends therein; and develop a choreography based on the movements taught in class. (Crosslisted/Equivalent with HCOM 220   )
    offered:
      terms:
        - fall
  ES-221:
    code: ES 221
    title: Shifting Flavor Landscapes & Unseen/Hidden Populations
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Introduces the myriad of cultural influences on U.S. cuisines from various racial and ethnic groups via core concepts of ethnic studies. Explores the influence of cultural and historical traditions on the food landscape through an interdisciplinary lens focused on justice, equity, diversity, and inclusion. Examines the lived experiences of various ethnic groups while assessing the hierarchical social/organizational structures and power dynamics that restrict or inhibit opportunities for growth among unseen/hidden populations in the U.S. hospitality and tourism sector. (Crosslisted/Equivalent with HOSP 221   )
    offered:
      terms:
        - fall
        - spring
  ES-224:
    code: ES 224
    title: American Indigenous Literatures and Cultures
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Students study the literary expressions of Native peoples of the Americas. The course engages the literature as aesthetic, spiritual, and political expression. Examines the indigenous ways of being and knowing represented in the texts. Cultural aesthetics are studied within social and historical contexts, including but not limited to colonization, removals, assimilation, and resistance. Questions of cultural identity and sovereignty are central. (Crosslisted/Equivalent with HCOM 224   )
    offered:
      terms:
        - fall
  ES-229:
    code: ES 229
    title: Multicultural Poetry
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Students focus on multicultural poetry as artistic and cultural representation. Students read works by poets of many cultures, watch poets read and talk about their work on video, and create their own original poetry. Students develop the tools to do literary and cultural analysis of poetry, as well as write their own poems. (Crosslisted/Equivalent with HCOM 229   )
    offered:
      terms:
        - fall
        - spring
  ES-236:
    code: ES 236
    title: Global Policing
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: In the course, you will be introduced to the role of modern policing in the liberal and neoliberal world order. We look at how state violence works through local, national, and transnational systems of law and security. We ask, what role does policing play in maintaining unequal social orders including race, class, gender, caste and others? How have movements resisted and sought to transform and/or abolish policing in their societies? (Crosslisted/Equivalent with GS 236   )
    offered:
      terms:
        - fall
  ES-243:
    code: ES 243
    title: Introduction to Ethnic Studies
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course provides students with an introduction to the study of race, ethnicity and culture in the United States. The course reviews the main ideas and key debates in Ethnic Studies, paying attention to the ways in which race and ethnicity intersect with other social identities such as gender, sexual orientation, class, nationality, and citizenship/legal status. Students who complete the course will be equipped with the analytic tools to apply a framework of race/ethnicity to better interpret, engage, and transform the world around them. (Crosslisted/Equivalent with HCOM 243   )
    offered:
      terms:
        - fall
        - spring
  ES-246:
    code: ES 246
    title: Introduction to Mexican American Studies
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Introduces students to the experiences of Chicana/o communities in the United States and in a transnational context. Students learn about Chicanos/as in relationship to issues of race, ethnicity, citizenship, class, gender, and other social formations. Students are introduced to Chicano/a historical experiences with an emphasis on understanding the struggles and social movements for justice and equality that have been foundational to the development of Chicano/a identities. (Crosslisted/Equivalent with HCOM 246   )
    offered:
      terms:
        - spring
  ES-247:
    code: ES 247
    title: African Legacy Worldwide
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Examines how historical, cultural, and social processes have influenced the development of African diaspora communities in the United States, Latin America, the Caribbean, Europe, and Asia. Special attention will be given to the impact of race and culture on the formation of diasporic communities. (Crosslisted/Equivalent with HCOM 247   )
    offered:
      terms:
        - spring
  ES-249:
    code: ES 249
    title: Native American Societies
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Examines Native American societies and cultures in North America, more precisely, the geographic areas of Mexico, the United States and Canada. Emphasizes the development of Native American societies over time, their influence on North America and the broader global community, and Native American relationships with US political and social institutions. Gender, identity, and comparative indigenous world views will be central themes. (Crosslisted/Equivalent with SSCI 249   )
    offered:
      terms:
        - fall
        - spring
  ES-260:
    code: ES 260
    title: "Contemporary Chicanx Literature: Survey"
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course serves as an introduction to Chicanx poetry and narrative by representative contemporary writers, considering their literary, cultural and historical contexts. The course also explores the place and evolution of the Chicanx literary tradition within the United States and Latin America. Genres such as Chicana feminist literature, Chicanx detective fiction, Chicana solidarity fiction, and Chicanx young adult literature will also be considered. Taught in English. (Crosslisted/Equivalent with SPAN 260   )
    offered:
      terms:
        - spring
  ES-307:
    code: ES 307
    title: Japan-American Experience
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course focuses on Japanese-American experience from the 1860s to the present as an ongoing study in ethnographic assimilation, including early immigration and response; immigration and labor laws; property rights; and WWII internment. Students identify and evaluate the issues of the ethics of assimilation, racial and ethnic discrimination, educational opportunity, social justice, and cultural identity. Taught in English. (Crosslisted/Equivalent with JAPN 307   )
    offered:
      terms:
        - spring
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  ES-311:
    code: ES 311
    title: Educational Issues and the Latino Community
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: An analysis of the key political, legal and sociocultural issues in the K-16 education of Latino students, the largest and fastest growing (majority-minority) population in the U.S. The course examines the historical and contemporary ways that Latino students are socially constructed along race, gender, language, and immigration status within the public schools. The Latino K-16 experience is tied to family and community involvement and examines how educational equity is a critical aspiration. (Crosslisted/Equivalent with LS 311)
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "[Prereq: (GE Area 1A and 1B and 1C and 2 with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  ES-314:
    code: ES 314
    title: Language and Education Policy for Linguistically Diverse Students
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: "We will examine policy & how it connects to local, national, & international contexts; analyze policy research & how it’s defined, theoretically framed, & studied; look at language policy at different levels: international, national, state, and local; explore special topics and application of language policy in our lives and research; pay attention to the impact of policy in education and the role of teachers in the language policy-making process. Course is taught bilingually (Spanish/English). (Crosslisted/Equivalent with ED 314   )"
    offered:
      terms:
        - fall
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  ES-317:
    code: ES 317
    title: Pacific Food Empires
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course examines the historical processes that have informed the food on our plates. In particular, we will look at food as a medium through which to understand the processes of migration, invention, colonialism, imperialism, and capitalism that have shaped much of the Asia-Pacific world, including Japan and the United States. Students will have a clear understanding of the processes of colonialism and globalization that informed the spread and invention of different food cultures and cuisines. (Crosslisted/Equivalent with JAPN 317   )
    offered:
      terms:
        - spring
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  ES-322:
    code: ES 322
    title: Immigrant Families Across the Lifespan
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Students critically examine the interdisciplinary research literature on diverse immigrant families in the US within a global context and explore contemporary and historical immigration issues that affect families and children’s development. In addition, students apply their learning in these areas toward maximizing strengths and functioning of immigrant families across the lifespan. (Crosslisted/Equivalent with HDFS 322   )
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  ES-357:
    code: ES 357
    title: Psychology of Liberation and Healing
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Grounded in liberation psychology, the readings and class discussions explore practices to heal oneself and our communities amidst historical and contemporary oppression. Emphasis will be placed on how Communities of Color have resisted oppression and worked to heal disconnections. The course creates an opportunity for hands-on research experience and an opportunity to catalyze social change by planting “seeds” in order to sow liberation. (Crosslisted/Equivalent with PSY 357   )
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: PSY-100
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( GE   Area 1A and 1B and 1C and 2 with a C- or better) and ( PSY 100   )]"
  ES-363:
    code: ES 363
    title: Immigrants & Equity Issues in Education
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Focus on multicultural concepts of culturally diverse groups. Students examine differing perspectives and experiences of immigrants, including 5 Southeast Asian groups in U.S., including their historical struggles and how power determines social, economic and political stratification associated with race, gender, sexual orientation and abilities. Consideration of how these factors impact equity, access, schools/schooling, and teaching and learning. (Crosslisted/Equivalent with LS 363   )
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  ES-370:
    code: ES 370
    title: The Chicanx Community
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course will critically examine cultural, social, economic, and political aspects relevant to the local Chicanx community in a historical and contemporary context, and will incorporate literary and community studies. Taught in English. (Crosslisted/Equivalent with SPAN 370   )
    offered:
      terms:
        - spring
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  ES-391:
    code: ES 391
    title: Race and Ethnicity in the United States
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course examines race and ethnicity, and the experiences of people of color in the United States. The course is intersectional and transnational, reflecting the global context of the U.S., and engaging other social categories such as class, gender, sexuality, and ability in studying people¿s experiences. Various ways race and ethnicity operate in culture and social life are surveyed, highlighting culture, institutions, and everyday life as sites where racial and ethnic dynamics are seen. (Crosslisted/Equivalent with HCOM 391   )
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  ES-462:
    code: ES 462
    title: Equity, Justice & Public Trust
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course examines the principles of democracy, equity, and justice in the public sector, and the impact of systemic racism, colonialism, and racialization on historically disadvantaged communities. Using contemporary media, literature and case studies, this course explores the duality of race and privilege in the United States and their role in shaping public policymaking and the implementation of public policies. (Equivalent/crosslisted with CHHS 462)
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "[Prereq: (GE Area 1A and 1B and 1C and 2) and (GWAR) with a C- or better]"
