    teachingStatus: active
    credits:
      minimum: 1
      maximum: 1
    description: Student works with advisor(s) to complete a Marine Science Honors Capstone project, including a written product and some form of presentation (including an oral presentation and/or a poster presentation). The precise structure of the course will vary among advisors. Students must have an approved research project prior to enrolling in this course.
