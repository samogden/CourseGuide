  MSCI-530:
    code: MSCI 530
    title: Marine Experimental Physiology
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course uses a group project approach to address a real-world marine environmental physiology problem. This course will increase knowledge retention and integration of concepts in marine science, physiology and biology, and teach students what it is like to work in a research laboratory setting.
    offered:
      terms:
        - spring
  MSCI-537:
    code: MSCI 537
    title: Ocean Instrumentation Projects
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This is a project-based course designed for graduate students interested in developing instrumentation such as tagging, biologging, or monitoring systems to investigate ocean organisms and their ecology. Lecture topics and exercises will cover a range of ocean instrumentation subjects and build on previous experience with electronics, mechanical design, and programming. In Lab, students work individually or in groups to design, build, and test new instrumentation for marine research or to evaluate and improve existing instrumentation, such as sensors, tag application and recovery mechanisms, automated sampling systems, or other electronic devices.
    offered:
      terms:
        - spring
    prerequisiteNotes:
      - (Graduate Standing) and (Instructor Consent Required)
  MSCI-555:
    code: MSCI 555
    title: Marine Fish Ecology
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Explores the ecology of marine fishes and associated conservation and management. Focuses upon fish distribution and the environmental drivers underlying that distribution in California and other locales. Students will complete a semester-long project involving field sampling along the central coast using a suite of tools, including remotely operated vehicles, towed camera sleds, and SCUBA. Students must have completed coursework in marine biology and ecology. (Cross-listed with MSCI 455 ).
    offered:
      availability: periodic
  MSCI-572:
    code: MSCI 572
    title: Biological Oceanography Projects
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course is a lecture, field, and computing-based exploration of biological oceanographic concepts using the Monterey Bay as a model. It uses a group project-based approach to understanding the oceanographic system with a focus on bio-physical coupling, aquatic optics, remote sensing, and mechanistic models.
    offered:
      terms:
        - spring
  MSCI-574:
    code: MSCI 574
    title: Marine Landscape Ecology
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Course covers the theory and application of landscape ecology to studies of the marine environment. Students will be introduced to the use of mapping and statistical tools that can be used in studies focused on understanding how marine landscapes drive patterns of species distribution and abundance.
    offered:
      availability: periodic
  MSCI-575:
    code: MSCI 575
    title: Marine Conservation Biology
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course covers the science and issues surrounding the loss of marine species and habitats resulting from overexploitation, habitat loss, species introductions, climate change, and other threats. Students will examine the science behind management decisions, especially place-based management, and will develop a project addressing marine conservation within the Monterey Bay area.
    offered:
      terms:
        - fall
