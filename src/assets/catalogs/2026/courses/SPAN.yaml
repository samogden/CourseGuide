  SPAN-370:
    code: SPAN 370
    title: The Chicanx Community
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course will critically examine cultural, social, economic, and political aspects relevant to the local Chicanx community in a historical and contemporary context, and will incorporate literary and community studies. Taught in English. (Crosslisted/Equivalent with ES 370 )
