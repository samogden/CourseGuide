    title: The Chicano Narrative
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Focuses on the reading and analysis of selected Chicano writers whose literary works have left a distinctive mark on Chicano Literature. Emphasizes the understanding of Chicano cosmology (society, culture, behavior and values) through the literary texts. Taught in English.
    offered:
      terms:
        - fall
    prerequisiteNotes:
