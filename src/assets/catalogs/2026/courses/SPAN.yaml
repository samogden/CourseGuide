  SPAN-420:
    code: SPAN 420
    title: Language & Cultural Internalization in the Hispanic Community
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: Through the completion of a community project or study abroad experience, students will demonstrate that they have actively immersed themselves in authentic Hispanic cultural and linguistic environments and have internalized the language and cultural experience, from which they have developed personal understanding and new perspectives of Hispanic communities.
