  SPAN-425:
    code: SPAN 425
    title: La Literatura Mexicana
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Exposes students to Mexican literature from its indigenous and Hispanic origins to its more contemporary expressions. Examines and discusses representative authors from all literary periods, including such literary icons as Sor Juana Ines de la Cruz, Manuel Gutierrez Najera, Mariano Azuela, Ignacio Altamirano, Rosario Castellanos, Juan Rulfo, Octavio Paz, Carlos Fuentes, Jose Agustin, and Laura Esquivel. Taught in Spanish.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: SPAN-304
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: SPAN 304 with a C- or better)"
  SPAN-426:
    code: SPAN 426
    title: Narrativa Hispanoamericana
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course studies Spanish American writers of the 20th century by emphasizing short stories and novels from the last 50 years. Uses literary texts to gain an understanding of Latino cultures, societies, and values. Taught in Spanish.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: SPAN-304
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: SPAN 304 with a C- or better)"
  SPAN-427:
    code: SPAN 427
    title: Latin American Women Writers
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course focuses on reading and analyzing works from Latin American women writers. Examines fiction by and about women from varied sociocultural backgrounds to discover the diversity and the commonality of female experience in different geographical regions. Students examine the narrative strategies employed by these writers in interpreting social, political, cultural, and religious forces that create gender, class, and ethnic barriers in Latin American society. Taught in Spanish.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: SPAN-304
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: SPAN 304 with a C- or better)"
  SPAN-428:
    code: SPAN 428
    title: La Literatura Afrolatina
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course critically examines contemporary works of Afro-Latin American literature and U.S. Afro-Latinx literature in a variety of genres including poetry, film, and narrative. Students in the course will examine the literary, historical, and cultural contexts of the works studied, along with intersecting themes such as feminism, queer theory, globalization, speculative fiction, magical realism, detective fiction, mental health, and Latin American folk beliefs. Taught in Spanish.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
