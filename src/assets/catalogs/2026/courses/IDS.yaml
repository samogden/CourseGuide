  IDS-397:
    code: IDS 397
    title: Independent Study
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 6
    description: Working with a faculty advisor, a student selects topic of study and number of credits appropriate to the student’s learning plan. An independent study proposal must be submitted and approved before registration.
    offered:
      availability: periodic
    prerequisiteNotes:
      - (Department Consent Required)
  IDS-400:
    code: IDS 400
    title: Senior Capstone
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Students engage in focused inquiry into an interdisciplinary issue in this online course. Requires demonstration of ability to synthesize and integrate knowledge from multiple disciplines, articulate an understanding of the issue, and advocate an ethical response. Involves intensive research, writing, oral communication, and collaboration, with opportunities for analysis, action, and reflection. Culminating activity is an oral and/or written summation of the capstone project.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - courseId: IDS-300
    prerequisiteNotes:
      - "[(Prereq: GE Areas 1A and 1B and 1C and 2) and ( IDS 300 ) and (IDS majors only)]"
