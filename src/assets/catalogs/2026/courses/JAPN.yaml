  JAPN-300:
    code: JAPN 300
    title: Introduction to Advanced Communication
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This is a bridge course from intermediate to advanced Japanese language. Students expand their cultural knowledge and language by investigating and comparing a broader range of topics in Japanese. Taught in Japanese.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: JAPN-201
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: JAPN 201   or equivalent with a C- or better)"
  JAPN-301:
    code: JAPN 301
    title: Advanced Japanese Culture, Language and Communication
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course continues to develop advanced level Japanese competency through further acquisition of Japanese cultural knowledge on a variety of fields and disciplines in content-based instruction. Taught in Japanese.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: JAPN-201
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: JAPN 201   or equivalent with a C- or better)"
  JAPN-302:
    code: JAPN 302
    title: History of Japan
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course further develops advanced level Japanese through building and expanding knowledge of Japanese history as a dynamic, interrelated system and employs a variety of processes to identify, analyze and evaluate cultural themes, values and ideas. Students will demonstrate ability to accurately comprehend ideas across a range of historical content. Taught in Japanese.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: JAPN-201
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: JAPN 201   or equivalent with a C- or better)"
  JAPN-303:
    code: JAPN 303
    title: Business Japanese
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course develops functional use of Japanese language for various types of situations and events that occur in the daily business environment. The types of situations include formal introductions, basic business rules, business etiquette, honorifics, and how to write business documents and email. It also presents and expands on cultural perspectives and concepts as they impact the business world. Taught in Japanese.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: JAPN-201
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: JAPN 201   or equivalent with C- or better)"
  JAPN-304:
    code: JAPN 304
    title: Introduction to Translation & Interpretation
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course is an introduction to translating and interpreting that provides an overview of the knowledge necessary for the fields of translation and interpretation. Students will study general issues involved in translating and interpreting and building the foundation of knowledge and techniques including rapid reading, analyzing, summarizing and paraphrasing, listening comprehension and shadowing. Taught in Japanese.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: JAPN-300
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: JAPN 300   or equivalent with a C- or better)"
  JAPN-305:
    code: JAPN 305
    title: Introduction to Japanese Culture & Civilization
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course introduces various aspects of Japanese culture, including history, geography, religion, government, politics, customs and traditions. After a broad historical overview beginning in prehistory, this course focuses on the Tokugawa period as the bedrock for understanding modern Japanese society as a mass society. Taught in English.
    offered:
      terms:
        - fall
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  JAPN-306:
    code: JAPN 306
    title: The Japanese Mind
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This project-based course looks behind the Japanese social mask to understand Japanese people’s thoughts, behaviors, aesthetics and ideology. It covers modes of thinking, making friends and influencing others, decision making, ethical systems and hierarchical relationships. Taught in English.
    offered:
      terms:
        - fall
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  JAPN-307:
    code: JAPN 307
    title: Japan-American Experience
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course focuses on Japanese-American experience from the 1860s to the present as an ongoing study in ethnographic assimilation, including early immigration and response; immigration and labor laws; property rights; and WWII internment. Students identify and evaluate the issues of the ethics of assimilation, racial and ethnic discrimination, educational opportunity, social justice, and cultural identity. Taught in English. (Crosslisted/Equivalent with ES 307   )
    offered:
      terms:
        - spring
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  JAPN-308:
    code: JAPN 308
    title: Japanese Pop-Culture
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course explores post WWII Japanese music, literature, artistic media, and hi-tech products. Investigates social themes ranging from post-holocaust Japanese hedonism to childhood fantasies by looking at Manga comic books, Animation, and popular music, as well as fashion and style, popular technology, consumerism, and environmental issues. Explores the evolution of pop culture and its impact on society. Taught in English.
    offered:
      terms:
        - fall
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  JAPN-309:
    code: JAPN 309
    title: Masterpieces in Japanese Literature
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course explores early Japanese prose and poetry to detect native motifs that continue into modern literature. Dramatic scripts, I-Novels, surrealistic fiction, and contemporary authors including Yoshimoto Banana and Murakami Haruki will be read and written about in a student-created literary online diary. Taught in English.
    offered:
      terms:
        - spring
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  JAPN-310:
    code: JAPN 310
    title: Japanese Cinema
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course provides an introductory scrutiny of major Japanese directors and genres with attention to film composition, choices of subject and character, and the relationship of cinema to Japanese culture and society. Students will analyze and discuss cinematographic elements and cultural codes among a variety of film genres, production of their historical and socio-cultural context, as well as issues dealing with popular culture and equity. Taught in English.
    offered:
      terms:
        - fall
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  JAPN-311:
    code: JAPN 311
    title: Social Issues In Japan
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: In the course, we’ll learn about the ways that people in Japan have engaged with the vast cultural, economic, and political changes since 1945. Among other topics, we’ll read about the fights over environmental concerns, anti-war protests (including anti-U.S. military base protests), economic and gender inequalities, and the ongoing struggle for life-work balance. This course is infused with a strong focus on social movements and fights for justice, in its many forms. Taught in English.
    offered:
      terms:
        - fall
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  JAPN-312:
    code: JAPN 312
    title: Advanced Japanese for Careers
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course is designed to develop a functional use of Japanese and cultural perspectives and concepts for professional occupations such as education, business, technology, and hospitality. Students will learn how to interact and collaborate in a variety of situations that focus on business etiquette and effective communication as members of the business community. Taught in Japanese.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: JAPN-300
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: JAPN 300   or equivalent with a C- or better)"
  JAPN-314:
    code: JAPN 314
    title: Japanese Visual Culture and Media
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: An analysis of historical and modern Japanese society through works of art and media including photography, film, maps, and other visual materials. Students learn to extract information from images as part of a visual analysis, while dealing with socio-geographical methods for understanding urban flows, economic disparities, transportation, and built environments. Students compare what they understand about Japanese culture with their own familiar environments. Taught in English.
    offered:
      terms:
        - spring
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  JAPN-315:
    code: JAPN 315
    title: Japanese Business Culture
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course examines a variety of business practices and norms in present-day Japan while introducing the historical development of Japanese corporate systems. Students will analyze the socio-cultural concepts that underlie Japanese business structure and new development and trends in Japanese business. It offers an understanding of how to communicate efficiently, build credibility, and form viable business relationships. Taught in English.
    offered:
      availability: periodic
  JAPN-316:
    code: JAPN 316
    title: Japanese Myth and Folktales
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course examines the native belief systems and the supernatural as reflected in a rich tradition of folktales, myths, songs, and proverbs in Japan. Students analyze the ways in which social practice and cultural norms/codes have been linked to folklore in Japan. The course also employs a variety of media such as woodblock prints, animation, and films to study the various manifestations of the supernatural in Japanese culture. Taught in English.
    offered:
      terms:
        - spring
  JAPN-317:
    code: JAPN 317
    title: Pacific Food Empires
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course examines the historical processes that have informed the food on our plates. In particular, we will look at food as a medium through which to understand the processes of migration, invention, colonialism, imperialism, and capitalism that have shaped much of the Asia-Pacific world, including Japan and the United States. Students will have a clear understanding of the processes of colonialism and globalization that informed the spread and invention of different food cultures and cuisines. (Crosslisted/Equivalent with ES 317   )
    offered:
      terms:
        - spring
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  JAPN-320S:
    code: JAPN 320S
    title: Japanese for the Global Community
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Students will have the opportunity to engage with community projects of import and relevance, while examining issues of justice, compassion, diversity and social responsibility. Students will have the opportunity to deepen their knowledge of Japanese language and culture through their community service to promote global citizens and develop communication skills through discussions, reflection essays and presentations.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: JAPN-300
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: JAPN 300   or equivalent with a C- or better)"
  JAPN-340:
    code: JAPN 340
    title: "Language for Professions: Japanese"
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course is designed to develop a functional use of Japanese for the professions. Students will learn how to respond to a variety of situations that focus on professional matters such as customer service, telephone conversations, and effective communication as a member of the professional community. It also presents and expands on cultural practices with perspectives and concepts. Taught in Japanese.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: JAPN-102
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( GE   Area 1A and 1B and 1C and 2 with a C- or better) and ( JAPN 102   or equivalent) with C- or better]"
  JAPN-350:
    code: JAPN 350
    title: "World Culture and Language: Japanese"
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course focuses on language use related to the cultures of the Japanese speaking community. It addresses culture-specific practices and concepts that cannot be translated into English. Students will also learn the use of Japanese to communicate at basic levels in culturally appropriate ways. Taught in English and Japanese.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  JAPN-374:
    code: JAPN 374
    title: Japanese Internship
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 4
    description: Students complete an internship experience within the Japanese major.
    offered:
      availability: periodic
  JAPN-380:
    code: JAPN 380
    title: "Japan: Land and People"
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course introduces the language and culture of Japan through a thematic approach. Selected topics include geography, climate, population, and industry. This course is designed to develop advanced Japanese language competency and to introduce various aspects of related Japanese culture using technology and web-based materials. Taught in Japanese.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: JAPN-300
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: JAPN 300   or equivalent with a C- or better)"
  JAPN-395:
    code: JAPN 395
    title: Special Topics
    teachingStatus: active
    credits:
      minimum: 0
      maximum: 12
    description: Studies a particular topic relative to the Japanese language or cultures. May be repeated for credit when topics vary.
    offered:
