    title: Independent Study
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 6
    description: Individual study of a particular aspect of Japanese language, culture, or civilization. A written proposal for the study/research must be approved in advance by the sponsoring faculty member and the program coordinator. Number of credits depends on the nature of the student’s academic goals and the consent of the faculty advisor.
    offered:
      availability: periodic
  JAPN-401:
    code: JAPN 401
    title: Structure of Japanese Language
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course aims to develop basic understanding of structural features of Japanese language. Students will be introduced to basic phonetic, phonological, morphological, syntactic, and discourse levels of Japanese. Taught in Japanese.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: JAPN-300
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: JAPN 300   or equivalent with a C- or better)"
  JAPN-402:
    code: JAPN 402
    title: Japanese Literature
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course aims to develop an advanced level of communication by interpreting and analyzing various aspects of modern Japanese literature, including short stories and significant works by authors of the modern period. Taught in Japanese.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: JAPN-300
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: JAPN 300   or equivalent with a C- or better)"
  JAPN-403:
    code: JAPN 403
    title: Pre-Capstone
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: This course aims to develop an advanced level of academic communication through the formulation of research questions on linguistic and cultural topics, using appropriate research methods and critical thinking skills. Students utilize a variety of information sources to investigate, organize, and analyze the information. Taught in Japanese.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: JAPN-300
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: JAPN 300   or equivalent with a C- or better)"
  JAPN-404:
    code: JAPN 404
    title: Advanced Japanese for Presentational Communication
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: This course aims to develop an advanced level of academic communication to finalize research projects using appropriate research methods. Students analyze and synthesize their research findings to orally present and to write academic papers using APA style. This course is a companion course for WLC 400   (Major Capstone). Taught in Japanese.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: JAPN-300
            minimumGrade: C-
          - courseId: WLC-400
            minimumGrade: C-
    prerequisiteNotes:
      - "[(Prereq: JAPN 300   or equivalent with a C- or better) and (Coreq: WLC 400   )]"
  JAPN-405:
    code: JAPN 405
    title: Cultural Landscape of Japan
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course examines a variety of Japanese socio-cultural contexts while introducing the significant aspects of diverse geographic regions, as well as ways of landscape use. Through the exploration of Japanese landscapes, students learn to analyze the unique senses of space, the concepts of nature and culture, the roles of tourism, and the growing tensions between urban and rural centers in Japan. Taught in English.
    offered:
      availability: periodic
  JAPN-407:
    code: JAPN 407
    title: The Making of Modern East Asia
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: "The class traces the flows of ideas, people, and capital in East Asia over the last two centuries. While focusing on Japan, Korea, and China, our lectures will be organized around three social science-related themes: Human Geography, Gender and Labor Theme; State, Economies of Scale, and Nationalism Theme; Technology and the Everyday Theme. We will learn about each of these countries within their own contexts with an eye towards understanding the deep historical interconnectedness of East Asian societies. Central to our study is the understanding that none of the countries exist in isolation. Though Japan and its history and society are frequently taught and understood to exist as separate or distinct from the Asian continent (and other parts of the world), our focus is on the overlapping experiences and histories of modern East Asia."
    offered:
      terms:
        - spring
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  JAPN-410:
    code: JAPN 410
    title: "Quakes and Nukes: (Un)Natural Japanese Environments"
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Japan is richly diverse, from the tundra-like north to the subtropical south. Its islands are shaped by earthquakes, volcanoes, and man-made ecologies. We study the Japanese archipelago from multiple scientific and humanistic perspectives, including material from scientific journals, films, history, anthropology, and Japanese comics. We cover the basics of Japanese geology, Pacific seismology (the ¿Ring of Fire¿), the causes and effects of nuclear radiation, and the changes to the land.
    offered:
      terms:
        - fall
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  JAPN-420:
    code: JAPN 420
    title: Maximizing Study Abroad Experiences
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 2
    description: Your study abroad experience is potentially a rich opportunity for you to enhance your language skills and deepen your understanding of other cultures, people and their practices. This course provides the resources to help you prepare to maximize your study abroad experiences. This course is taught in English.
    offered:
      terms:
        - spring
  JAPN-495:
    code: JAPN 495
    title: Special Topics
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 6
    description: Studies a particular topic relative to the Japanese language or cultures. May be repeated for credit when topics vary.
    offered:
      availability: periodic
  JAPN-496:
    code: JAPN 496
    title: Field Studies
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 6
    description: Individualizes student placement for field study as related to Japanese.
    offered:
