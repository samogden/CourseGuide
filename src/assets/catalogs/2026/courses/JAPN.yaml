schemaVersion: 1
prefix: JAPN
courses:
  JAPN-101:
    code: JAPN 101
    title: Beginning Japanese I
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This is a beginning Japanese course for students with no prior Japanese. Students will learn and use basic Japanese interpersonally and interpretively to communicate and present on familiar topics. Students will learn reading and writing systems including hiragana, katakana and basic kanji. Students will gain appreciation of Japanese customs, practices, products, and perspectives, and be able to compare them with their own culture.
    offered:
      terms:
        - fall
        - spring
  JAPN-102:
    code: JAPN 102
    title: Beginning Japanese II
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This is a continuation of JAPN 101   . Students will continue to learn to use Japanese interpersonally and interpretively to communicate and present on familiar topics in daily situations. Students will learn basic communication strategies and demonstrate an increased appreciation of Japanese customs, practices, products, and perspectives, and are able to compare them with their own.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: JAPN-101
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: JAPN 101   or equivalent with a C- or better)"
  JAPN-185:
    code: JAPN 185
    title: Beg interpersonal and interpretive communication I
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 2
    description: This course focuses on interpersonal and interpretive communication in daily situations at beginning level and is a companion course for JAPN 101   and JAPN 102   .
    offered:
      terms:
        - fall
  JAPN-186:
    code: JAPN 186
    title: Beg interpersonal and interpretive communication II
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 2
    description: This course focuses on interpersonal and interpretive communication in daily situations at beginning level and is a companion course for JAPN 101   and JAPN 102   .
    offered:
      terms:
        - spring
  JAPN-195:
    code: JAPN 195
    title: Special Topics
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 6
    description: Studies a particular topic relative to the Japanese language or culture. May be repeated for credit when topics vary.
    offered:
      availability: periodic
  JAPN-197:
    code: JAPN 197
    title: Independent Study
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 6
    description: Allows lower-division students to independently study a particular aspect of Japanese culture and language. A written proposal for the study/research must be approved in advance by the sponsoring faculty member and the program chair. Number of credits depends on the nature of the student’s academic goals and the consent of the faculty advisor.
    offered:
      availability: periodic
  JAPN-201:
    code: JAPN 201
    title: Intermediate Japanese I
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This is a continuation of JAPN 102   . Students will continue to develop proficiency at an intermediate level of Japanese. Students will use the language to investigate, explain, and reflect on the relationships between the practices, products and perspectives of Japanese culture and compare them with their own.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: JAPN-102
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: JAPN 102   or equivalent with a C- or better)"
  JAPN-211:
    code: JAPN 211
    title: Modern Japanese History
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course offers a survey of Japanese social, political, economic, and cultural developments from the nineteenth century through the present. We will examine such topics as the establishment of the modern Japanese state and emperor system, debates regarding modernization, the changing role of women in society, the rise of Japanese imperialism, the Asia-Pacific War, the American Occupation, and protest movements. Our emphasis will be on a diversity of historical experiences and struggles shaping Japanese society.
    offered:
      availability: periodic
  JAPN-212:
    code: JAPN 212
    title: Samurai Spirit
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course explores the four periods of the samurai tradition to survey changing roles and philosophy behind its existence. The survey will analyze contemporary images/stereotypes of the samurai. The course employs ancient war tales, historical documents and paintings, maps, articles, literary works, different genres of samurai films, and videos to fully examine one of the most popular Japanese cultural icons. Taught in English.
    offered:
      terms:
        - spring
  JAPN-213:
    code: JAPN 213
    title: Manga, Anime & Modern Japan
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course uses Japanese manga (comics) and anime (animated films) as mirrors that reflect the Japanese experience of rapid economic and social transformation over the past 150 years. Starting with the examination of ancient Japanese style of visual expression, we will trace how manga and anime sketch out a parallel world that is linked both historically and culturally to the imagined community of the Japanese nation-state. Taught in English.
    offered:
      terms:
        - fall
        - spring
  JAPN-215:
    code: JAPN 215
    title: Cool Japan Today
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course examines contemporary media culture and products as a conceptual lens to focus on Japanese pop culture and soft power in the 21st Century. Manga, Anime, Cinema, literature, performance art, music, and fine arts will all be surveyed with an eye to understanding what exactly is cool and different about Japanese creative work and whether these kinds of cultural exports could become the foundation of a new post-industrial Japanese economy. Taught in English.
    offered:
      terms:
        - fall
  JAPN-285:
    code: JAPN 285
    title: Intermediate Interpersonal and Interpretive Communication III
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 2
    description: This course focuses on interpersonal and interpretive communication in daily situations at intermediate level and is a companion course for JAPN 201   and JAPN 300   .
    offered:
      terms:
        - fall
  JAPN-286:
    code: JAPN 286
