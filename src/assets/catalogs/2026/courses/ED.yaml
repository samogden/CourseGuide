schemaVersion: 1
prefix: ED
courses:
  ED-212S:
    code: ED 212S
    title: Federal, State, and Local Governments and their Impact on Public Schooling
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: "This course examines historical events and philosophical bases of American education including the development of the US and California Constitutions. Students will examine their impact through civic participation. Major emphasis on political and legislative activities, social issues, and economic developments affecting the schools. We will study the primary sources of law that most directly affect our educational system: constitutional, statutory, judicial, and administrative with an emphasis on Federal and state regulations. The objective is to provide students the information and knowledge necessary for effective civic decision-making."
    offered:
      terms:
        - fall
        - spring
  ED-300:
    code: ED 300
    title: CSET Multiple Subjects Prep Course
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 1
    description: "Multiple Subjects test preparation course will review the test format and analyze the question types. Strategies and techniques for the multiple-choice and constructed-response questions will be discussed with short reviews in selected areas. This course is designed to help students apply their knowledge to meet exam requirements in each of the exam subtests including: Subtest I - History/Social Science and Reading, Language and Literature, Subtest II - Science and Math, and Subtest III"
    offered:
      availability: periodic
  ED-314:
    code: ED 314
    title: Language and Education Policy for Linguistically Diverse Students
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: "We will examine policy & how it connects to local, national, & international contexts; analyze policy research & how it’s defined, theoretically framed, & studied; look at language policy at different levels: international, national, state, and local; explore special topics and application of language policy in our lives and research; pay attention to the impact of policy in education and the role of teachers in the language policy-making process. Course is taught bilingually (Spanish/English). (Crosslisted/Equivalent with ES 314 )"
    offered:
      terms:
        - fall
    prerequisiteNotes:
      - "(Prereq: GE Area 1A and 1B and 1C and 2 with a C- or better)"
  ED-374:
    code: ED 374
    title: PE for Elem Sch Child
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 1
    description: Studies movement in the life of all children and the ways in which various types of activities can affect the development of the child from birth to 13 years in the psychomotor, affective, and cognitive domains, with emphasis placed on practical experience. Meets the physical education and health requirements of the California Commission on Teacher Credentialing for candidates enrolled in the multiple subject program.
    offered:
      availability: periodic
  ED-510:
    code: ED 510
    title: Providing Behavior Supports in the Classroom
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course covers Positive Behavior Intervention and Support (PBIS) strategies for promoting appropriate student behavior in classroom settings. The role of the teacher in developing and aligning classroom behavior supports within the broader context of school-wide PBIS systems will be addressed. Additionally, advanced tiers of support for addressing varying levels of student behavioral needs will be covered. Includes both coursework and fieldwork.
    offered:
      terms:
        - fall
        - spring
  ED-520:
    code: ED 520
    title: Reading Instruction Competence Assessment (RICA) Prep Course
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 1
    description: Reviews the Reading Instruction Competence Assessment (RICA) test format and analyzes the question types. Strategies and techniques for the multiple-choice and constructed-response questions are discussed with short reviews in selected areas. Designed to help candidates apply their knowledge to meet exam requirements.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "(Prereq: Admitted in Multiple Subject Credential or SPED teaching program)"
  ED-538:
    code: ED 538
    title: Intro to Classrm Tech Level 1
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: Meets the California Commission on Teacher Credentialing Level 1 technology requirements for candidates enrolled in the multiple subject, single subject and SPED programs. Focuses on knowledge of basic technology applications and their use in K-12 classrooms. (Commission requirements may also be met through examination.)
    offered:
      availability: periodic
  ED-538B:
    code: ED 538B
    title: Assistive Technology in the Classroom
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 1
    description: This course focuses on providing candidates with knowledge of assistive technology, including low and high tech equipment and materials, to facilitate communication, curriculum access, and skill development of students with disabilities. The course meets the requirements of the California Commission on Teacher Credentialing revised Special Education Standard Six.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: ED-538
          - courseId: ED-538
    prerequisiteNotes:
      - "[(Prereq: ED 538 ) or (Coreq: ED 538 )]"
  ED-540:
    code: ED 540
    title: Science Methods
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Supports candidates in becoming inquiring, analytical, and reflective science educators to build students¿ scientific literacy, agency, and access. Examines science teaching based on contemporary theory, practice, and the Next Generation Science Standards (NGSS). Develops skill in science teaching through practice with hands-on, inquiry-based approaches. Provides experience with structuring equitable science lessons for a diverse student body. Includes both coursework and fieldwork.
    offered:
      terms:
        - fall
        - spring
  ED-550:
    code: ED 550
    title: Health and Physical Education
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: Focuses on Health & Physical Education (PE) topics as they relate to teaching and learning environments. Provides an overview of the Health & PE Content Standards and context for how these are addressed in schools and classrooms. Explores theories, organization, methods, and materials for teaching Health & PE. Identifies current Health & PE issues facing individuals, families, and communities in the social and school context. Includes both coursework and fieldwork.
    offered:
      terms:
        - fall
        - spring
  ED-555:
    code: ED 555
    title: CPR & First Aid Training
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 1
    offered:
      availability: periodic
  ED-570:
    code: ED 570
    title: Classroom Management
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Required introductory course for teacher credential programs (MS & SS). Practical application of teaching theory, methodology, and pedagogy for K-12 schools. Includes observation, participation, planning, and practice teaching in a local K-12 schools.
    offered:
      availability: periodic
  ED-590:
    code: ED 590
    title: Reading & Writing Strategies for Monolingual & Bilingual Learners
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: "Reading & Writing Strategies for Monolingual & Bilingual Learners: This course for the Reading Certificate will continue the foundation gained in MAE 630 &nbsp;and will further develop candidates’ skills in curriculum and evidence-based teaching methods required to create self-sufficient and independent readers from elementary school through high school."
    offered:
      availability: periodic
  ED-592:
    code: ED 592
    title: Advanced Literacy Assessment, Evaluation, Instructional Planning & Delivery
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: "(Formerly titled Reading Academy) Advanced Literacy Assessment, Evaluation, Instructional Planning & Delivery: This course for the Reading Certificate provides an advanced framework for using assessment data in an effective and efficient balanced, comprehensive program of reading instruction. The course presents a variety of informal and formal assessments to diagnose students’ strengths and needs; including instruction and practice in administering assessments, evaluating results and planning appropriate intervention, and implementing targeted instruction based on identified student needs."
    offered:
      availability: periodic
  ED-595:
    code: ED 595
    title: Special Topics
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 8
    description: In-depth study in a particular topic in education. May be repeated for credit when topics vary.
    offered:
      availability: periodic
  ED-597:
