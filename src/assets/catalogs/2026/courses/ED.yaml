  ED-607:
    code: ED 607
    title: Adolescent Development & Learning
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course is designed to provide the prospective secondary school teacher with foundations of educational psychology useful for teaching and essential skills of instructional planning. The course includes principles of teaching, learning and assessment, curriculum and curriculum theory, instructional planning, and cognitive psychology.
    prerequisiteNotes:
      - "(Coreq: ED 628 )"
  ED-609:
    code: ED 609
    title: Math Methods
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Introduces candidates to theory and practice for teaching mathematics in elementary classrooms. Furthers candidates’ understanding of standards, principles, and effective math teaching practices. Candidates practice how concepts are developed concretely, symbolically, and abstractly for a diverse student body through experiences that focus on planning and rehearsing. Includes both coursework and fieldwork.
    offered:
      terms:
        - fall
        - spring
  ED-610:
    code: ED 610
    title: Methods and Inquiry for Bilingual Teachers
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course prepares bilingual teacher candidates for teaching Spanish-speaking students. Includes an examination of program models for bilingual instruction, methods for teaching reading and content areas in bilingual settings, materials and assessment. Conducted in both Spanish and English.
  ED-611:
    code: ED 611
    title: Teaching and Learning
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Introduces the learning process in public schools. Outlines the foundations of educational psychology and child development useful for teaching, as well as principles of teaching, learning and assessment; curriculum and curriculum theory; and instructional planning. Candidates will examine the connection between human development learning strategies and cultural context, and the psychological principles underlying culturally congruent pedagogy.
    offered:
      terms:
        - fall
        - spring
  ED-612:
    code: ED 612
    title: Pedagogy for Ling Diversity
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Contextualizes the education of students from culturally/linguistically diverse backgrounds within historical, social, and political factors. Connects teaching with the background of students and schooling to social justice issues. Blends classroom experience with theory, strategies, and the local community. Explores the foundations of language acquisition and develops approaches for working with emergent bilinguals.
    offered:
      terms:
        - fall
        - spring
  ED-615:
    code: ED 615
    title: Social Studies & Visual/Performing Arts Methods
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Focuses on implementation and integration of CA History-Social Science and Visual/Performing Arts Standards, including the application of content, literacy, equity, citizenship, and inquiry. Explores pedagogy and content knowledge about the history of diverse cultural groups, focusing on historically marginalized and disenfranchised communities. Provides experience in lesson design, curriculum alignment, and cultural proficiency. Includes both coursework and fieldwork.
    offered:
      terms:
        - fall
        - spring
  ED-616:
    code: ED 616
    title: Lang/Literacy Curriculum I
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Introduces approaches to the development of language and literacy at the elementary school level. Analyzes the theoretical foundations of literacy development and skills and strategies for teaching reading and writing across the school curriculum.
