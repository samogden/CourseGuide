    description: Candidates will address issues of classroom management skills, lesson planning, assessment, and the social context of education. This course provides supervision to candidates in field placements and requires candidates to explore and reflect on school-wide policies, classroom environments, classroom management and procedures, and lesson planning. Requires course and fieldwork.
