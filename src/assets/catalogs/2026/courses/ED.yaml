      maximum: 3
    description: Furthers study of approaches to the development of language and literacy at the elementary school level. Continues analysis of the theoretical foundations of literacy development and the skills and strategies for teaching and assessing reading and writing across the school curriculum. Includes four hours of classroom experience and two hours of fieldwork weekly for the first 10 weeks of an academic semester. Cross-listed with ED 627 .
