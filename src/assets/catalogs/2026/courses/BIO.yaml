    title: Freshwater Ecology
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: In-depth exploration of freshwater and estuarine ecosystems, including aquatic organisms and their taxonomy; the ecology of freshwater ecosystems; and the influences of biogeochemistry, water quality, hydrology, and geomorphology on biota. The course focuses on applying ecological and chemical knowledge to assessing and managing freshwater ecosystems. Will include weekend or odd-hour field trips with concurrent field/laboratory section.
    offered:
      terms:
        - fall
    prerequisites:
      - allOf:
          - courseId: BIO-340
            minimumGrade: C-
