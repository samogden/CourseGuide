    code: BIO 441
    title: Biology of Fishes
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: An integrative course that explores the biology and diversity of fishes from multiple perspectives, including their evolution, ecology, behavior, biogeography and physiology. The required lab provides an opportunity for students to learn about fish anatomy, aspects of their physiological systems and roles in ecosystems, as well as develop skills in field study, taxonomic identification and specimen preparation.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
