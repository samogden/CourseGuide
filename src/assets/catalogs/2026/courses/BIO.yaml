    title: Marine Experimental Physiology
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course uses a group project approach to address a real-world marine environmental physiology problem. This course will increase knowledge retention and integration of concepts in marine science, physiology and biology, and teach students what it is like to work in a research laboratory setting. Includes group capstone project option.
    offered:
      terms:
        - spring
    prerequisites:
      - allOf:
          - courseId: STAT-250
            minimumGrade: C-
