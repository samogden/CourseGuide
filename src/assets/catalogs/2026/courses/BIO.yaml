            minimumGrade: C-
          - courseId: BIO-106
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BIO 210 and BIO 211 ) or ( BIO 106 ) with a C- or better]"
  BIO-380:
    code: BIO 380
    title: Practical Computing for Scientists
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course will focus on developing a base data science tool set for implementing professional-level computing in scientific experimental design and analysis. Content of the course is geared toward novice students (i.e. those with little or no previous programming experience) who will learn practical computational approaches to modern research problems by applying programming concepts and approaches to real data sets. Areas of study will focus on skills related to data manipulation, management, and analysis.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - allOf:
          - courseId: STAT-250
            minimumGrade: C-
          - courseId: BIO-211
            minimumGrade: C-
          - courseId: BIO-211L
            minimumGrade: C-
          - anyOf:
              - courseId: BIO-230
                minimumGrade: C-
              - courseId: ENVS-240
                minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: STAT 250 and [( BIO 211 and BIO 211L ) or (BIO 230 or ENVS 240 )] with a C- or better]"
  BIO-392:
    code: BIO 392
    title: Biology Seminar Series
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 1
    description: Upper division seminar course based on lectures from visiting faculty and biology professionals from Research 1 institutions, biotechnology, and other biology-related careers. Includes reading and critical analysis of peer reviewed literature, seminar and journal club discussion, and attendance in seminar series. May be repeated for credit up to three times.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BIO-211
            minimumGrade: C-
    prerequisiteNotes:
