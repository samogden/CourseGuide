    code: BIO 421
    title: Advanced Microbiology
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: An in-depth, advanced exploration of the microbial world, covering fundamental principles and their application to modern topics. The course emphasizes critical analysis of scientific literature, discussion of complex microbial processes, and the impacts of microorganisms on humans and the environment.
    offered:
      availability: periodic
    prerequisites:
