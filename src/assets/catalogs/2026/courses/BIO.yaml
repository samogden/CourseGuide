  BIO-379S:
    code: BIO 379S
    title: Biology Service Learning
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Addresses strategies for supporting equitable formal and informal educational opportunities and access to healthy natural environments for all, regardless of their cultural, linguistic, or economic background. Service learning placements in schools and other agencies help students deepen their understanding of basic biology principles and methodologies for facilitating learning by diverse students and community members.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BIO-210
            minimumGrade: C-
