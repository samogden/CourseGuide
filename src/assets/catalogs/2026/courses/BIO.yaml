    title: Community Ecology
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course will provide students with an in-depth exploration of concepts examining how species interactions shape the structure and composition of plant and animal communities. Lecture covers topics on species interactions such as competition, predation, herbivory, and mutualism, as well as principle theories explaining coexistence and species diversity. Discussion explores classic and modern literature representative of research in the field, with an emphasis on communities in California.
