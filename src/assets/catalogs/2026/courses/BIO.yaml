      - (Instructor permission required)
  BIO-410:
    code: BIO 410
    title: Bioinformatics
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course explores the theory and application of modern data analysis methods to “Big Data” biological research questions. Students will gain a deeper understanding of topics such as molecular biology, evolution, probability, and computational biology by investigating applied and basic research in genomics and using advanced contemporary analytical approaches on genome-scale research projects.
    offered:
      terms:
        - spring
    prerequisites:
      - allOf:
          - anyOf:
              - courseId: BIO-311
                minimumGrade: C-
              - courseId: BIO-341
                minimumGrade: C-
    prerequisiteNotes:
      - "[(Prereq: GWAR and ( BIO 311 or BIO 341 ) with a C- or better)"
  BIO-412:
    code: BIO 412
    title: Comparative Genomics
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course will explore the areas of genomics and comparative biology and their relationships to both basic and applied areas of research. Students will learn about the applications and contributions of a “genomic” perspective to topics such as evolutionary biology, functional genetics, genetic structure, and systems biology.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: BIO-311
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: (GWAR and BIO 311 ) with a C- or better]"
  BIO-413:
    code: BIO 413
    title: Molecular Genetics
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: A comprehensive molecular genetics course for majors covering DNA replication, repair and mutation, regulation of transcription and translation, and analysis and manipulation of genes at the molecular level.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: BIO-311
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: (GWAR and BIO 311 ) with a C- or better]"
  BIO-414:
    code: BIO 414
    title: Molecular Cell Biology
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: "Cell structure, membrane transport, cell division, molecular genetics, recombinant DNA, mechanisms of evolution, and the basis of classification. Applies fundamental principles and experimental approaches in four areas of cell biology: cell cycle regulation, signal transduction, intracellular protein transport, and structure and function of cytoskeleton, including cell-cell and cell-substrate interactions. Explores recent advances in the fields of molecular and cell biology."
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: BIO-311
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: (GWAR and BIO 311 ) with a C- or better]"
  BIO-416:
    code: BIO 416
    title: Immunology
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course introduces the molecular and cellular foundations of immunology. Students will explore the innate and adaptive immune systems, antigen recognition, immune system development, immune responses to infections, autoimmune diseases, immunotherapy, and immunodeficiencies.
    prerequisites:
      - anyOf:
          - courseId: BIO-311
          - courseId: BIO-320
          - courseId: CHEM-310
    prerequisiteNotes:
      - "(Prereq: BIO 311 or BIO 320 or CHEM 310 )"
  BIO-420:
    code: BIO 420
    title: Marine Invertebrate Zoology
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Advanced survey of the biology of invertebrates, stressing comparative functional morphology, evolution, phylogeny, systematics, natural history, behavior, and aspects of physiology and development. Emphasizes the living animal and its habitat.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: MSCI-345
            minimumGrade: C-
          - courseId: BIO-330
            minimumGrade: C-
          - courseId: BIO-341
            minimumGrade: C-
          - courseId: BIO-370
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: MSCI 345 or BIO 330 or BIO 341 or BIO 370 with a C- or better]"
