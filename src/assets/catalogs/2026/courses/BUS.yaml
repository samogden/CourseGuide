    minimumStanding: junior
  BUS-451:
    code: BUS 451
    title: Venture Formation/Finance
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Examines venture formation and growth following completion of a business plan. Focuses on marketing, accounting, financial, and human resource management issues. Students examine startup and growth management issues faced by real-life ventures, and meet with entrepreneurs, and investors. Students also receive guidance on approaching potential sources of capital.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: BUS-307
            minimumGrade: C-
          - courseId: BUS-310
            minimumGrade: C-
    prerequisiteNotes:
      - "[(Prereq or Coreq: BUS 307   and BUS 310   with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-452:
    code: BUS 452
    title: Fixed Income Analysis
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Course provides an advanced treatment of investments in the field of fixed income analysis. Topics include analyses of different bond types (zero-coupon, bullets, annuities, etc), accrued interest, day-counting rules (money market and bond market conventions), yield to maturity and bond returns, term structure of interest rates, interest rate sensitivity of fixed income securities, and managing interest rate risk. Spreadsheet modeling introduced. Course includes student presentations.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-353
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BUS 353   with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-454:
    code: BUS 454
    title: Advanced Agribusiness Credit & Finance
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: "Analyzes the economics of agribusiness operations, and identifies all the potential sources of financing. Performs financial analysis of agricultural projects, using the same methodology as top agricultural leaders in the region. Evaluates various credit and capital market alternatives in terms of their likely financial impacts on borrowers. Interact directly with providers of financing. Highly recommended: take BUS 434 before BUS 454."
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: BUS-204
            minimumGrade: C-
          - courseId: BUS-307
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: (( BUS 204   or Elementary Stats equivalent) and ( BUS 307   ) with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-455:
    code: BUS 455
    title: Agribusiness Finance
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Introduces financial analysis for enterprises operating within agribusiness. Focuses on the time value of money, ethical financial reporting, financial statement analysis, agribusiness company valuation, financing, cost of capital and related subjects. Encompasses opportunity costs, capital budgeting, financial risk for the firm, and measures to mitigate and manage risk using various strategies.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: BUS-205
            minimumGrade: C-
    prerequisiteNotes:
      - "[(Prereq: (( BUS 205   or Managerial Accounting equivalent) with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-460:
    code: BUS 460
    title: Emerging Technology and Digital Organization
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: New technologies such as social media, big data analytics & Internet of Things are impacting the digital organizations. Students develop understanding of these technologies using tools such as SAS, IBM Watson, HTML5, web design & analytics that provide strategic advantages & explore issues such as security, privacy, encryption, & ethical issues.&nbsp;
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-308
            minimumGrade: C-
    prerequisiteNotes:
      - "[(Prereq or Coreq: BUS 308   with a c- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-462:
    code: BUS 462
    title: Web 3.0 Technology and Emerging Opportunities
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Web 3.0 is the next evolution of the current web that utilizes technologies, including blockchain technology, cryptocurrency, distributed identity, virtual reality, the Internet of things, and Artificial Intelligence to provide users and organizations with intelligent, immersive, and private web applications. In this course, students learn how to implement and manage these technologies and how to exploit the emerging business opportunities associated with Web 3.0 in a responsible manner.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: BUS-360
    prerequisiteNotes:
      - "[(Prereq: BUS 360   ) or (Instructor Consent Required)]"
  BUS-463:
    code: BUS 463
    title: "E-Comm: Design & Development"
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Investigates models of designing an electronic commerce initiative, a crucial channel for market expansion. Students gain hands-on experience using the hardware, software, & applications in developing an e-commerce site, & learn ethical & legal responsibilities for data handling. Focuses on learning various technology & design issues, & building a prototype of an e-commerce site.&nbsp;
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: BUS-308
            minimumGrade: C-
          - courseId: BUS-363
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BUS 308   and BUS 363 with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-465:
    code: BUS 465
    title: Systems Analysis and Design
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Introduces the concepts of planning, analysis, and design of modern information systems (IS). Covers structured analysis/design, rapid prototyping techniques, and project management. Investigates the complex nature of IS, dynamic and iterative nature of systems development life cycle (SDLC), and the challenges in the socio-technical process of designing and implementing successful IS.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: BUS-299
            minimumGrade: C-
          - courseId: BUS-301
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq or Coreq: BUS 299   or BUS 301   with a C- or better)"
  BUS-468:
    code: BUS 468
    title: Business Analytics
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Business Analytics (BA) refers to the use of technologies to collect & analyze complex info about an organization for data-driven decision making. BA helps in strategic & operational decision making by improving performance, optimizing customer relations, & monitoring business activity. Course provides an understanding of the BA capabilities using SAS for data visualization, decision support, text analytics, ethics, & other topics.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-308
            minimumGrade: C-
    prerequisiteNotes:
      - "[(Prereq or Coreq: BUS 308   with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-469:
    code: BUS 469
    title: Database Management
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Explores relational database design & implementation using database tools. Discusses data management concepts & terminology currently in practice, fundamentals of relational database management, data sharing, retrieval, data dictionaries, & queries using SQL. Students apply database software to create & query databases to solve real-world problems. Covers ethical issues such as DB security and privacy.&nbsp;
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: BUS-308
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BUS 308   with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-470:
    code: BUS 470
    title: Responsible Global Business and Social Entrepreneurship
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course examines the concepts, theories, and practice of responsible business (People, Ethics, Equity, Planet, and Profit), including how social entrepreneurs create and manage social enterprises and sustainable businesses. Responsible business principles, frameworks, and tools are integrated to design responsible business models, strategies, and activities and are applied to the design, production, commercialization, and marketing of innovative social businesses and products.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: BUS-310
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: BUS 310   with a C- or better and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-472:
    code: BUS 472
    title: Advanced Business Analytics and Visualization
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course provides an introduction to the Python programming language for students without prior programming experience. We cover the fundamental topics of Python following project-based pedagogy. Students will learn how to (a) clean, analyze, visualize, and test and validate data using supervised and unsupervised machine learning methods and (b) write Python programs to create games, Twitter bots, social media archivers and crawlers, and automation scripts. The projects of this course will help students learn and use the Python program to solve real-world scientific and business problems.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-468
            minimumGrade: C-
          - courseId: BUS-469
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: BUS 468 or BUS 469 with a C- or better)"
  BUS-474:
    code: BUS 474
    title: Artificial Intelligence and Applications
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Artificial Intelligence (AI) is a technology that is transforming every industry. AI uses huge amounts of data to develop models that facilitate/automate decision-making for individuals and organizations. This course will discuss the basics of AI and apply AI methods in organizations. Students will learn to apply AI techniques in several areas including marketing, accounting, supply chain, and human resource management using large language models. Students will also learn the responsible and ethical use of AI.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: BUS-301
    prerequisiteNotes:
      - "(Prereq: BUS 301   or equivalent)"
  BUS-481:
    code: BUS 481
    title: Accounting Systems
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course helps students learn to design and use accounting systems. Students will create entity-relationship models of accounting systems, depict those systems in flowcharts and business process diagrams, use spreadsheet and database software to analyze and report accounting information, and design, evaluate, and implement internal controls over transaction processing and systems design and implementation.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: BUS-383
            minimumGrade: C-
          - courseId: BUS-308
            minimumGrade: C-
    prerequisiteNotes:
      - "[(Prereq: ( BUS 383   ) and ( BUS 308   ) with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-482:
    code: BUS 482
    title: Financial Auditing
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Roles and responsibilities of independent auditor. Generally accepted auditing practices and standards; professional ethics. Auditing procedures, planning the audit, work paper preparation, report writing, rendering an opinion on financial statements. Requires use of spreadsheet software.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-383
            minimumGrade: C-
          - courseId: BUS-384
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BUS 383   and BUS 384   with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-483:
    code: BUS 483
    title: Operational Auditing
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Technical, ethical, and policy aspects of operational auditing. Effectiveness of audits in the for-profit and not-for-profit sectors. Issues in operational auditing and case studies of how those issues have been addressed.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: BUS-383
            minimumGrade: C-
          - courseId: BUS-384
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: (BUS 383 and BUS 384 with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-484:
    code: BUS 484
    title: Advanced Accounting I
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Concentrates on the underlying theory and application of business combinations, consolidated financial statements, foreign currency transactions, partnerships, segment and interim reporting, SEC reporting, accounting for non-profit organizations and estates and trusts. Explores current FASB and GASB rulings as well as the Sarbanes-Oxley Act, and ethical/legal issues on account reporting.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-383
            minimumGrade: C-
          - courseId: BUS-384
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BUS 383   and BUS 384   with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-487:
    code: BUS 487
    title: Ethics for Accountants
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Extends ethical frameworks introduced in prerequisite courses. Students learn how ethical reasoning and the core ethical values of integrity, objectivity, and independence are integrated into the professional practice of accounting. Ethical dimensions of accountability and responsibility are examined at the personal, institutional, and professional levels.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: BUS-300S
            minimumGrade: C-
          - courseId: BUS-304
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BUS 300S   and BUS 304   with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-493:
    code: BUS 493
    title: International Business
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Focuses on management concepts and practices across cultures and geographic boundaries; the impact of multinational corporations (MNCs) on the global economy; comparative leadership studies; global competitive strategies; intercultural communication; political risk analyses; negotiations; human resources across cultures; and ethics and social responsibility.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-305
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BUS 305   ) and (GWAR) with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-494:
    code: BUS 494
    title: International Business & Entrepreneurship Consulting
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This project-based course allows students to apply international business knowledge and skills to a concrete business situation. Examples of experiential learning projects may include consulting projects for a corporate client or developing an international new venture.
    offered:
      terms:
        - fall
    prerequisiteNotes:
      - "(Prereq: Junior or Senior Standing)"
    minimumStanding: junior
  BUS-495:
    code: BUS 495
    title: Special Topics
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 6
    description: Studies a particular topic in the major. May be repeated for credit when topics vary.
    offered:
      availability: periodic
    prerequisiteNotes:
      - "(Prereq: Junior or Senior Standing)"
    minimumStanding: junior
  BUS-497:
    code: BUS 497
    title: Independent Study
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 6
    description: Independent study under the direction of a faculty member. The student must prepare a study proposal approved by the appropriate faculty member and major advisor prior to registration.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: BUS-305
            minimumGrade: C-
          - courseId: BUS-306
            minimumGrade: C-
          - courseId: BUS-307
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BUS 305   and BUS 306   and BUS 307   with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-498:
    code: BUS 498
    title: Internship
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 6
    description: Provides a structured work experience. Course faculty must approve objectives, sites & internship agreements. Students work with course faculty throughout the internship. According to BUS school policy only paid internships are accepted. Students must work a minimum of 200 hours during the term. Course faculty approval required. Must secure an internship position before the course starts.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-304
            minimumGrade: C-
          - courseId: BUS-305
            minimumGrade: C-
          - courseId: BUS-306
            minimumGrade: C-
          - courseId: BUS-307
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BUS 304   and BUS 305   and BUS 306   and BUS 307   with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-499:
    code: BUS 499
    title: Strategic Management-Senior Capstone
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This culminating course integrates all BUS core courses within a strategic management framework and applies this knowledge via experiential learning. Students apply business knowledge and the strategic management process to identify and provide solutions to business problems within a client organization.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-305
            minimumGrade: C-
          - courseId: BUS-306
            minimumGrade: C-
          - courseId: BUS-307
            minimumGrade: C-
    prerequisiteNotes:
      - "[(Prereq: BUS 305   and BUS 306   and BUS 307   with a C- or better) and (Senior Standing)]"
  BUS-568:
    code: BUS 568
    title: Business Intelligence and Analytics
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: An executive leadership perspective to business intelligence & analytics (BI&A) that provides insights for evaluation, strategic alignment, planning & investment in BI&A resources & people; addresses the governance of processes for BI&A deployments in business & government. The course reinforces the role of analytics for sound ethical decision-making strategies for creating a culture of evidence-based organization performance and innovation.&nbsp;
    offered:
      availability: periodic
    prerequisiteNotes:
      - Restricted to Senior and Graduate Level Standing Only
  BUS-569:
    code: BUS 569
    title: Introduction to Data Mining
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Social media is generating vast amounts of structured and unstructured data for organizations at an incredible rate. Data mining techniques are utilized in organizations to store, manage, and analyze this data to get useful and actionable intelligence for decision making. Data mining applications are used widely in marketing, banking, fraud detection, and finance. Topics will include data warehousing, dimensional modeling and data mining.
    offered:
      availability: periodic
    prerequisites:
      - courseId: BUS-468
    prerequisiteNotes:
      - "(Prereq: BUS 468   )"
  BUS-570:
    code: BUS 570
    title: Advanced Business Analytics and Visualization
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Social media technologies generate data which is unstructured in nature and require methodologies that can reveal hidden patterns and meaning. Data visualization can assist organizations in gaining valuable, actionable insight to allow an organization to better communicate and interact with its stakeholders. Topics range from text and stream mining, visualization, Hadoop, social media, NoSQL, GIS,and includes business case studies.
    offered:
      availability: periodic
    prerequisites:
      - courseId: BUS-468
    prerequisiteNotes:
      - "(Prereq: BUS 468   )"
  BUS-582:
    code: BUS 582
    title: Auditing & Assurance
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Course focuses on auditing theory, practice, philosophy & environment of the auditing profession. Topics include general auditing standards, professional conduct & ethics, legal liability, audit evidence, audit planning, internal control, auditing sampling, risk assessment, & accounts assurance. Examines SOX and SEC requirements for public companies, applying critical thinking for ethical dilemmas faced by auditors.&nbsp;
    offered:
      availability: periodic
    prerequisiteNotes:
      - Restricted to Senior and Graduate Level Standing Only
  BUS-586:
    code: BUS 586
    title: Accounting Information Systems
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Examines the accounting data that is collected, stored, and processed by computer technology under GAAP accounting practices. Analyzes the efficiency & effectiveness of information technology infrastructure & the operations. Integrates SOX and discuss the ethics, fraud, documents flow, segregation of duties, computer processing, including the risk of cloud computing, and the related control activities in a corporation.&nbsp;
    offered:
      availability: periodic
    prerequisiteNotes:
      - Restricted to Senior and Graduate Level Standing Only
  BUS-588:
    code: BUS 588
    title: Ethics for Accounting Professionals
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Examines the AICPA Code of Professional Conduct as well as the additional requirements for auditors of public companies expressed in the Institute of Internal Auditors Codes of Ethics. Develops critical thinking frameworks to assess cases of ethical dilemmas frequently encountered by accounting professionals. Explores legal requirements & liabilities that govern the accounting profession.&nbsp;
    offered:
      availability: periodic
    prerequisiteNotes:
      - Restricted to Senior and Graduate Level Standing Only
  BUS-595:
    code: BUS 595
    title: Special Topics
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 6
    description: Studies a particular topic in the major. May be repeated for credit when topics vary.
    offered:
      availability: periodic
  BUS-597:
    code: BUS 597
    title: "Independent Study: Grad Level"
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 6
    description: Graduate level independent study under the direction of a faculty member. The student must prepare a study proposal approved by the appropriate faculty member and graduate advisor prior to registration.
    offered:
      availability: periodic
  BUS-600:
    code: BUS 600
    title: Graduate Proseminar
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Introduction to e-commerce, information technology for businesses, and research methodology. Cross-listed as CST 600.
    offered:
      terms:
        - fall
        - spring
  BUS-601:
    code: BUS 601
    title: Responsible Business Communication
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: The course fosters proficiency in business writing/speaking with emphasis on grammar, sentence structure, critical thinking (thought formation), information literacy and presentation skills. Assignments introduce Responsible Business concepts, communication in real-world business situations and enable students to strengthen their ability to write and speak effectively in the workplace.
    offered:
      availability: periodic
    prerequisiteNotes:
      - (Restricted to MBA Majors Only)
  BUS-602:
    code: BUS 602
    title: Micro-Macro Economics
    teachingStatus: active
    credits:
      minimum: 6
      maximum: 6
    description: "Students will become familiar with microeconomic as well as macroeconomic concepts relevant to managerial decision making. Topics will include: demand and supply analysis, consumer demand theory, production theory, price discrimination, perfect competition, externalities and public goods, risk aversion and risk sharing, hidden information and market signaling, moral hazard and incentives, rudimentary game theory, reputation and credibility, and transaction cost economics."
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - (Restricted to MBA Majors Only)
  BUS-603:
    code: BUS 603
    title: Macro Economics
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: The course is designed to equip students with the principles and the analytical tools of Macroeconomics. Students will investigate the economic concepts of output, income, the nature and role of money; and the impact of government expenditure and taxation on the economy. Students will examine economic theory dealing with the aggregate economic problems of employment, inflation, business cycles and growth.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - (Restricted to MBA Majors Only)
  BUS-604:
    code: BUS 604
    title: Micro Economics
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: "The primary goal is to explain and forecast the behavior of consumers and firms under various economic parameters and constraints. Topics include: supply and demand; individual and market demand; consumer behavior, production, cost functions, and competitive and monopolistic markets and strategies."
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - (Restricted to MBA Majors Only)
  BUS-605:
    code: BUS 605
    title: MBA Research Methods
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: "The focus of this course is on assisting practitioners in solving business problems using various statistical and research methods. Topics include: basic descriptive and inferential statistics; appropriate interpretation of statistical results as they apply to the real-world presentation of data; research design and data analysis; inferential statistics; normal distribution using the z - test, t - testing, analysis of variance; and simple regression."
    offered:
      availability: periodic
    prerequisiteNotes:
      - (Restricted to MBA Majors Only)
  BUS-606:
    code: BUS 606
    title: Decision-making Methods for Managers
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: In this course, students will get exposure to and practice the use of quantitative tools for aiding managerial decision-making in the corporate and public sectors. Students will be introduced to several quantitative models proven effective in solving classes of business and public sector problems. Students will also become proficient in the use of Excel for managerial decision-making.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: BUS-204
    prerequisiteNotes:
      - "(Prereq: BUS 204   or equivalent) (Restricted to MBA Majors Only)"
  BUS-610:
    code: BUS 610
    title: Economics for Business
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course teaches students the economic principles used in the business decision and strategy process. It will enable students to understand why firms and markets exist and how they function. How market conditions affect managerial business decisions concerning production, product pricing, and marketing strategy. Students will be introduced to Business Cycle Theory and how the macro economy impacts business decisions.
    offered:
      availability: periodic
    prerequisiteNotes:
      - (Restricted to MBA students only)
  BUS-625:
    code: BUS 625
    title: Organization and Responsible Leadership
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Students analyze organizational effectiveness using theories of leadership, management and organizational behavior. Students study leadership in a responsible business (Profit, People, Planet, Ethics, and Equity) context. Students reflect upon their own leadership styles and those of other leaders to determine how to shape their own management practice to improve their effectiveness.
    offered:
      availability: periodic
    prerequisiteNotes:
      - (Restricted to MBA students only)
  BUS-626:
    code: BUS 626
    title: Marketing and Entrepreneurship
    teachingStatus: active
    credits:
      minimum: 6
      maximum: 6
    description: Students integrate literature (research & practice), historical perspectives, analytical tools, & theoretical frameworks to design & conduct a market analysis. Students make marketing-related decisions based on identification & analysis of target markets, marketing mix variables, & market feasibility. Students identify & analyze high potential opportunities & develop a plan to exploit those opportunities. Students contribute to the startup or growth of entrepreneurial/intrapreneurial ventures.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - (Restricted to MBA students only)
  BUS-631:
    code: BUS 631
    title: Global Business
    teachingStatus: active
    credits:
      minimum: 6
      maximum: 6
    description: "Students develop an “outside/in” perspective: seeing the United States, U.S.-based companies, and foreign-headquartered multinational corporations from the perspective of multi-varied constituencies around the world. Many of the readings are from Africa to provide the diversity of thought needed to break the barriers of U.S.-centric thinking. International governance structures are highlighted in the course. A two-country negotiation case applies what students have learned."
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - (Restricted to MBA students only)
  BUS-632:
    code: BUS 632
    title: Organization & Leadership
    teachingStatus: active
    credits:
      minimum: 6
      maximum: 6
    description: Students analyze organizational effectiveness using theories of leadership, management, and organizational behavior. Students study leadership within the context of sensitivity to cross-cultural differences, firm culture, and employee motivation. Students reflect upon their own leadership styles and that of other leaders to determine how to shape their own management practice to improve their effectiveness. Students apply frameworks for thinking strategically about human resources.
    offered:
      terms:
        - fall
    prerequisiteNotes:
      - (Restricted to MBA students only)
  BUS-633:
    code: BUS 633
    title: Information Systems and Business Analytics
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Uses an executive information systems perspective to explore the emerging technologies that impact enterprise strategy. Focus is on understanding business analytics and its role in managing processes, resources, and people. This course reinforces the role of business analytics for creating a culture of data-driven decision-making and also addresses ethical and data governance issues in embedding business analytics in managerial decision-making.
    offered:
      availability: periodic
    prerequisiteNotes:
      - (Restricted to MBA students only)
  BUS-648:
    code: BUS 648
    title: Accounting for Managers
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: Introduces financial and managerial accounting as tools for responsible managers. Students learn to read, understand, and interpret financial statements as they evaluate organizations’ liquidity, profitability, and leverage. Students learn to use internal reports, budgets, and other accounting information to plan and control operations and make both tactical and strategic decisions.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: BUS-203
    prerequisiteNotes:
      - "(Prereq: BUS 203   or equivalent) (Restricted to MBA students only)"
  BUS-652:
    code: BUS 652
    title: Financial Management
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Students will learn about the time value of money, project and security valuation. They will develop both the skills necessary to make financial decisions, and the ability to understand their impact on a responsible business and its stakeholders. This course will introduce and reinforce high-level financial concepts and principles that will serve as a foundation for financial management decisions.
    offered:
      availability: periodic
    prerequisites:
      - courseId: BUS-307
    prerequisiteNotes:
      - "(Prereq: BUS 307   ) (Restricted to MBA Students Only)"
  BUS-661:
    code: BUS 661
    title: Innovation and Technology Management
    teachingStatus: active
    credits:
      minimum: 6
      maximum: 6
    description: "Students study the importance of innovation for business success. Innovation is analyzed from three perspectives: products, processes, and organizations. Students understand the intricacies of developing new products, processes, and organizations. Students explore how information-based systems are used to address the challenges of adding value to organizations. Principles of operations management are examined to improve strategies, processes, and decision making to meet customer needs."
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - (Restricted to MBA Majors Only)
  BUS-662:
    code: BUS 662
    title: Marketing Management
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Students apply marketing frameworks to develop integrated marketing strategies that leverage market opportunities or address identified problems. Students make responsible marketing decisions based on analyses of target markets, while considering contexts and elements of the marketing mix to offer value to customers.
    offered:
      availability: periodic
    prerequisiteNotes:
      - (Restricted to MBA Majors Only)
  BUS-670:
    code: BUS 670
    title: Database Management
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Examines database design and implementation using relational database management system tools. Discusses data management concepts and terminology currently in practice in the business world, including data and database administration, fundamentals of database management systems and models (network, hierarchical and relational), data sharing, retrieval, data dictionaries, data proliferation, data integrity, and queries using SQL.
    offered:
      availability: periodic
  BUS-671:
    code: BUS 671
    title: Operations and Supply Chain Management
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course reviews operations strategies in a global environment for optimal allocation of resources (material and personnel) by firms to gain competitive advantage in the delivery of products (goods and services). Students will develop the ability to forecast demand; manage projects, inventory, revenue, supply chain risks, capacity planning, procurement, and customer relationship management.
    offered:
      availability: periodic
    prerequisiteNotes:
      - (Restricted to MBA Majors Only)
  BUS-681:
    code: BUS 681
    title: MBA Accounting
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Course examines accounting concepts, the accounting model, measurement processes, financial statements, financial analysis, the accounting cycle, monetary and fixed assets, inventory, current and long-term liabilities and equity structure. Students investigate internal reporting for use in planning and control, in making non-routine decisions and in formulating major plans and policies. Course covers cost-profit relationships, budgets, and standard variance analysis.
    offered:
      availability: periodic
    prerequisiteNotes:
      - (Restricted to MBA Majors Only)
  BUS-682:
    code: BUS 682
    title: Global Sustainable Business
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: In this course, you will gain an understanding of today’s global economy and the people, institutions, and environmental elements that underlie international and global commerce. You will expand your ability to manage diversity and national differences. You will learn how to manage a responsible firm’s quintuple bottom line (Profit, People, Planet, Ethics, and Equity) in a global context of interconnectedness.
    offered:
      availability: periodic
    prerequisiteNotes:
      - (Restricted to MBA Majors Only)
  BUS-684:
    code: BUS 684
    title: Doing Business in World Regions
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 1
    description: This is a faculty-supervised project to enhance global awareness and cultural sensitivity by applying business knowledge acquired in previous courses to an international responsible business issue. The requirement can be fulfilled either through a short study trip abroad (when available) or through a written assignment.
    offered:
      availability: periodic
    prerequisiteNotes:
      - (Restricted to MBA Majors Only)
  BUS-687:
    code: BUS 687
    title: Accounting and Finance
    teachingStatus: active
    credits:
      minimum: 6
      maximum: 6
    description: "Students: read, understand, & use corp. financial statements & published accounting reports; examine alternative costing methods & how cost information can be used for decision making; explore both financial & non-financial performance measures for evaluating business strategies & business unit success; prepare & analyze financial statements & projections for an investment; create a corporation, and/or a proposed project; and evaluate resources of financing for new & existing ventures."
    offered:
      availability: periodic
    prerequisiteNotes:
      - (Restricted to MBA Majors Only)
  BUS-691:
    code: BUS 691
    title: Business Strategy
    teachingStatus: active
    credits:
      minimum: 6
      maximum: 6
