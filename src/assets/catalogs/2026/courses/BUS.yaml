      - "[Prereq: (( BUS 204   or STAT 100   ) and ( BUS 202   ) and ( BUS 299   or BUS 301   with a C- or better) and (Prereq or Coreq: BUS 309   ) with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-436:
    code: BUS 436
    title: Agribusiness Strategy
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Introduces key issues in agricultural strategy and marketing, including market structure, performance measures, strategic positioning and market dynamics. Competitive analysis of agribusiness and food/fruit/vegetable markets in terms of dynamics of pricing, entry/exit, and strategic commitment are presented.
