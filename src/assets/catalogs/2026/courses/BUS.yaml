    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Introduces the fundamentals of risk management and trading, pricing, purchasing and procurement in the agricultural sector. Structure of financial commodity and produce markets and commonly used strategies such as hedging, and futures & options strategies, to manage risk are presented. Application of such strategies to manage financial risk and commodity/produce trading are simulated in the classroom environment.&nbsp;
