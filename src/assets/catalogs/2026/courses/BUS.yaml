schemaVersion: 1
prefix: BUS
courses:
  BUS-121:
    code: BUS 121
    title: "Writing That Matters: Humans and AI Together"
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This first-year composition course develops foundational skills in reading, writing, and critical thinking, with a special emphasis on the ethical use of artificial intelligence (AI) in academic and professional contexts. Students will practice drafting, revising, and editing essays that integrate diverse perspectives and credible evidence. Through analysis of AI-generated texts alongside scholarly and journalistic sources, students strengthen their ability to evaluate arguments, detect fallacies, and write with clarity and purpose.
    offered:
      terms:
        - fall
        - spring
  BUS-195:
    code: BUS 195
    title: Special Topics
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 6
    description: Studies a particular topic in the major. May be repeated for credit when topics vary.
    offered:
      availability: periodic
  BUS-200:
    code: BUS 200
    title: Personal and Professional Responsibility in Business
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: Personal & professional responsibility are the foundation of responsible businesses whose focus is balancing the quintuple bottom line (profit, people, planet, equity & ethics). Personal responsibility explores personal values, identity & career interests. Professional responsibility explores understanding stakeholders & community. Students will apply key concepts of personal & professional responsibility to the quintuple bottom line, using business communication & reading skills.
    offered:
      terms:
        - fall
        - spring
  BUS-201:
    code: BUS 201
    title: Macro Economics
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: "Macroeconomics introduces students to the basic concepts of GDP, inflation, unemployment, trade-balance, consumer price index, and interest. Students apply these concepts to explain real life macroeconomic situations and discuss policy alternatives on topics such as: fairer distribution of income, sustainable economic growth, right mix of fiscal and monetary policies in booms or recessions, impact of trade wars on trade balances, causes of recessions & booms."
    offered:
      terms:
        - fall
        - spring
  BUS-202:
    code: BUS 202
    title: Micro Economics
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Microeconomics is the traditional social science that studies human behavior with respect to how resource allocation decisions are made at the individual, firm, and societal levels. Microeconomics focuses on behavioral theory which explains market behavior and its implications for public policy; income distribution; and contemporary problems of labor and business. Topics include economic issues that focus on equity, diversity, and ethics from a stakeholder perspective.
    offered:
      terms:
        - fall
        - spring
  BUS-203:
    code: BUS 203
    title: Financial Accounting
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Accounting principles and practices related to the collection, classification, use, and reporting of economic events to stakeholders external to the entity. Students reflect on the ethical and compliance implications of financial reporting.
    offered:
      terms:
        - fall
        - spring
  BUS-204:
    code: BUS 204
    title: Business Statistics
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Provides an overview of mathematics skills and elementary statistical procedures used in business applications and applied research settings. Places special preparatory emphasis on quantitative reasoning skills. Develops proficiency in the use of data in tables, graphs, and elementary descriptive statistical applications; linear correlation and regression models; probability theory and probability distributions; hypothesis testing and statistical inference.
    offered:
      terms:
        - fall
        - spring
  BUS-205:
    code: BUS 205
    title: Managerial Accounting
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Explores managers’ uses of internal accounting data for ethical decision making and control. Includes the theory and practice of budgeting, profit planning, cost-volume-profit relationships, breakeven analysis, identifying and tracking product costs, standard costs and variance analysis.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-203
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: BUS 203   with a C- or better)"
  BUS-206:
    code: BUS 206
    title: Business Law
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Examines the principles of law as they apply to everyday business, including ethical-social responsibility. Legal topics include forms of business entities, & legal issues, e.g., corporate governance, shareholders, board of directors & officers, mergers, issuance of securities & taxation. Other legal subjects include constitutional law, torts/Cybertorts, criminal law, agency/employment law, employment discrimination, & contracts and E-commerce.
    offered:
      terms:
        - fall
        - spring
  BUS-232:
    code: BUS 232
    title: Finding Your Voice in the AI Era
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course develops fundamental oral communication skills for academic, professional, and civic contexts while cultivating an eco-centric approach to speaking and listening that values collective dialogue over individual performance. Students practice researching, organizing, delivering, and evaluating speeches while engaging with challenges of communication in the age of artificial intelligence. Through three major speeches (informative, persuasive, and reflective) and group deliberation, students learn that authentic communication creates shared understanding rather than competitive advantage, and that diverse voices enrich rather than threaten our collective discourse.
    offered:
      terms:
        - fall
        - spring
  BUS-295:
    code: BUS 295
    title: Special Topics
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 6
    description: Studies a particular topic in the major. May be repeated for credit when topics vary.
    offered:
      availability: periodic
  BUS-299:
    code: BUS 299
    title: Business Analytics Fundamentals
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Provides fundamentals of business analytics - how to frame and use analytics techniques to solve business problems using Excel to support business decisions. Topics include built-in Excel functions, scenario and what-if analyses using logical nested-IFs, data visualization using charts, database and analyses, automation using VBA, and introduction to SAS.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-204
            minimumGrade: C-
          - courseId: STAT-100
            minimumGrade: C-
    prerequisiteNotes:
      - "(Prereq: BUS 204   or STAT 100   or equivalent with a C- or better)"
  BUS-300:
    code: BUS 300
    title: Major ProSeminar
    teachingStatus: active
    credits:
      minimum: 2
      maximum: 2
    description: Students develop an Individualized Learning Plan that will guide their learning experiences at CSUMB and their continuing professional development.
    prerequisites:
      - anyOf:
          - courseId: BUS-201
            minimumGrade: C-
          - courseId: BUS-203
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BUS 201   and BUS 203   ) and ( GE   Area 1A and 1B and 1C) with a C- or better and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-300S:
    code: BUS 300S
    title: Business Ethics in Action
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Students apply social-scientific vocabulary, concepts, and theoretical perspectives to social issues such as inequality based on social class, race, gender or other factors; allocation of scarce resources; and climate change. Students analyze social issues using theories from the primary disciplines of economics, law, and psychology. Through resources and classroom exercises students examine how their identities and perspectives relate to various social issues via applied ethical constructs.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "[Prereq: ( GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  BUS-301:
    code: BUS 301
    title: Principles of Business Analytics
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This course provides an introduction to business analytics. Students learn to analyze and interpret data to extract useful insights that support organizations in enhancing operational efficiency and strategic decision-making. Students use quantitative analysis to answer complex questions that can benefit individuals, businesses, and society at large. Topics include Excel functions, logical nested IFs, data visualization, pivot tables, database and queries, and automation using VBA.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-204
          - courseId: STAT-100
    prerequisiteNotes:
      - "(Prereq: BUS 204   or STAT 100   )"
  BUS-302:
    code: BUS 302
    title: Bus Milestone Experience
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 1
    description: Students entering into the major will demonstrate their understanding of core concepts of financial and managerial accounting, micro- and macro-economics, and statistics. Core concepts will be reinforced through review and testing. Through an integrative case, students will actively participate to demonstrate critical business skills of teamwork, communication (oral and written), quantitative reasoning and critical thinking.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-201
            minimumGrade: C-
          - courseId: BUS-202
            minimumGrade: C-
          - courseId: BUS-203
            minimumGrade: C-
          - courseId: BUS-204
            minimumGrade: C-
          - courseId: STAT-100
            minimumGrade: C-
          - courseId: BUS-205
            minimumGrade: C-
          - courseId: BUS-299
            minimumGrade: C-
          - courseId: BUS-301
            minimumGrade: C-
          - courseId: BUS-304
            minimumGrade: C-
    prerequisiteNotes:
      - "[(Prereq: BUS 201   and BUS 202   and BUS 203   and ( BUS 204   or STAT 100   or equivalent) and BUS 205   ) with a C- or better) and (Prereq or Coreq: BUS 299   or BUS 301   ) and (Coreq: BUS 304   ) and (Business Majors Only)]"
  BUS-303:
    code: BUS 303
    title: Major Pro-seminar
    teachingStatus: active
    credits:
      minimum: 1
      maximum: 1
    description: Prepares students to explore continuing education, professional opportunities, and specific career paths. Students develop an Individualized Learning Plan that will guide their learning experiences at CSUMB and their continuing professional development.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "(Coreq: BUS 304   )"
  BUS-304:
    code: BUS 304
    title: Business Communications & Critical Thinking
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Enables upper division students to acquire and demonstrate critical thinking, business writing, and speaking skills; meets GWAR requirements. Students learn and demonstrate empathetic written and oral communication skills, problem-solving strategies, and analytical skills applicable to real world business issues and events.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "[Prereq: ( GE   Area 1A and 1B and 1C with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-305:
    code: BUS 305
    title: Principles of Management
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Students learn concepts of management including managerial roles, organizational and team dynamics, leadership and motivation, decision making, ethical and legal issues, communication, and responsible business. Individually and in teams, students explore how organizations do or do not function effectively in multi-cultural contexts.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "[Prereq: ( GE   Area 2 with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-306:
    code: BUS 306
    title: Principles of Marketing
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Market opportunity identification, market and competitive analysis, consumer behavior measurement and analysis, use of marketing tools, strategic market planning and program development, organization and management of marketing and distribution value chain, product management, ethical and legal aspects of marketing along with corporate social responsibility, and applications of Internet marketing are studied.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: GE-2
            minimumGrade: C-
    prerequisiteNotes:
      - "[(Prereq: GE   2 with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-307:
    code: BUS 307
    title: Finance
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Emphasizes the entrepreneur/manager raising funds at minimal cost and risk, and the allocation of those funds to increase shareholders’ wealth and company value. Encompasses financial statements, time value of money, bond/stock valuation, cost of capital, and related subjects. Reviews international aspects of financial management. Develops both the skills and ability to understand the impact of financial decision making to business and its stakeholders. Stresses ethical financial reporting.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  BUS-308:
    code: BUS 308
    title: Information Systems for Decision Making
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Designing effective Information Systems for organizational competitive advantage using data modeling techniques. Students learn quantitative and analytical concepts for decision making in business using data visualization and advanced tools such as nested IFs, macros, database functions, VBA, and SAS. Students understand and apply the data lifecycle process to create and implement complex spreadsheet-based information systems for tactical and strategic decision analysis.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - allOf:
          - courseId: BUS-301
          - anyOf:
              - courseId: BUS-204
              - courseId: STAT-100
    prerequisiteNotes:
      - "[(Prereq: ( BUS 204   or STAT 100   ) and ( BUS 301   or equivalent)]"
  BUS-309:
    code: BUS 309
    title: Principles of Operations Management
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Introduces principles of Operations Management. Emphasis is on applied analytical and quantitative skills using spreadsheets for optimal allocation of resources for an organization in a manufacturing or service industry. Major topics are operations strategies, project mgmt., linear programming/optimization, supply chain, facility location/layout, workforce and capacity planning, forecasting, inventory mgmt., enterprise resource planning, quality control, system reliability, and decision tools.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-299
          - courseId: BUS-301
          - courseId: BUS-204
          - courseId: STAT-100
    prerequisiteNotes:
      - "[Prereq: ( BUS 299   or BUS 301   or equivalent) and ( BUS 204   or STAT 100   equivalent)]"
  BUS-310:
    code: BUS 310
    title: Entrepreneurship
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Students exercise creativity and develop an entrepreneurial mindset useful for any career by learning to identify opportunities, developing innovative business concepts, and formulating effective strategies for execution. In addition, practical skills such as market research, financial analysis, and feasibility studies are honed to refine business ideas into viable ventures.
    offered:
      terms:
        - fall
        - spring
  BUS-311:
    code: BUS 311
    title: Operations Management - Service Organizations
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Explores operational systems in service industries such as banking, hospitality, financial services, and telecommunications. This course is also applicable to nonprofit organizations. Examines the customer service delivery, internal processes, and operational principles that govern service-based industries and nonprofit organizations. May be taken in place of BUS 309   or BUS 312.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - allOf:
          - courseId: BUS-299
            minimumGrade: C-
          - courseId: BUS-304
            minimumGrade: C-
          - courseId: BUS-305
            minimumGrade: C-
          - anyOf:
              - courseId: BUS-300
                minimumGrade: C-
              - courseId: BUS-300S
                minimumGrade: C-
              - courseId: HOSP-300
                minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: (( BUS 299   ) and ( BUS 300   or BUS 300S   or HOSP 300   ) and ( BUS 304   ) and ( BUS 305   ) with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-321:
    code: BUS 321
    title: "Electronic Commerce: Mrkting"
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Firms are experiencing dramatic shifts in standard business practices caused by the emergence of a global electronic marketplace and investment in web commercialization. Explores models firms are applying in a socially responsible and ethical manner. Focuses on the marketing issues in commercialization of computer-mediated environments (CMEs) like the WWW and emerging electronic media.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: BUS-306
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: BUS 306   with a C- or better and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-322:
    code: BUS 322
    title: Integrated Marketing Communications
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course explores the effective use of traditional communication methods such as advertising, sales promotion, public relations, direct marketing, sales, personal selling, events, and word of mouth (WOM) marketing. The course discusses social media marketing strategies including customer engagement, microblogging, blogs, video and photo marketing, mobile marketing, content marketing, and more. Other factors and considerations are discussed using the social media planning cycle.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-306
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: BUS 306   with a C- or better and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-323:
    code: BUS 323
    title: Service Marketing
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Focuses on marketing as applied to service businesses. Topics include marketing a service vs. a manufactured product; marketing (planning, pricing, research, segmentation); customer loyalty; distribution channels; & advertising. Students identify a service industry, develop a marketing plan including situational & SWOT analyses, & action plans with success measures from a legal & ethical perspective.&nbsp;
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-306
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: BUS 306   with a C- or better and (Junior or Senior Standing) or Instructor Consent]"
    minimumStanding: junior
  BUS-330:
    code: BUS 330
    title: Human Resources Management
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Examines human resource management challenges confronting decision making in a rapidly challenging global environment. Focuses on motivation, cross-cultural communication, ethics, recruitment, selection, compensation, benefits, health and safety in the workplace, legal requirements and limitations, affirmative action, and career development.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-305
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: BUS 305   with a C- or better and (Junior or Senior Standing) or Instructor Consent]"
    minimumStanding: junior
  BUS-331:
    code: BUS 331
    title: Organizational Behavior
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Explores individual & organizational behavior within an institution’s environment. Includes personality, group dynamics, organization change, conflict resolution, multiculturalism, ethics, leadership, & motivation. Applies skills in communication, decision making, problem solving, teamwork, handling ambiguity, taking initiative, and interpersonal sensitivity, such as cross-cultural differences.&nbsp;
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-305
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: BUS 305   with a C- or better and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-332:
    code: BUS 332
    title: Global Responsible Business
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Students critically evaluate the global business context with an emphasis on Responsible Business. Students explore the differences and commonalities between countries and regions in political, regulatory, cultural, and socio-economic spheres to give an insight into business practices and other institutional factors. Students develop an understanding of the nature of international business, its evolution and the driving forces that shape changes in global business.
    offered:
      terms:
        - spring
    prerequisiteNotes:
      - "[Prereq: Junior or Senior Standing]"
    minimumStanding: junior
  BUS-333:
    code: BUS 333
    title: Sports Management
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Sports play an important role in individual lives and in society more broadly. Sports are a vehicle for lifelong physical fitness, a source of identity and camaraderie, and a form of live entertainment. In short, sports are big business. This course explores sports from the perspective of business and examines such topics as how profits are generated and distributed, the role of athletes in the sports economy, and the business of gender equity.
    offered:
      terms:
        - fall
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C with C- or better) or (Instructor Consent)"
  BUS-334:
    code: BUS 334
    title: The Impact of AI in Technology, Careers, and Society
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: This interdisciplinary course (intended for students regardless of major) explores the intersection of artificial intelligence (AI) and business, focusing on technological advancements, sociopolitical and ethical implications. Students will examine how AI technologies are reshaping business practices, organizational structures, and societal norms. The course includes theoretical frameworks, use cases, empirical studies, and case analyses to understand AI’s impact on work, employment, power dynamics, ethics, and social inequality within business contexts.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - (Junior or Senior Standing Required)
    minimumStanding: junior
  BUS-350:
    code: BUS 350
    title: Financial Literacy
    teachingStatus: active
    credits:
      minimum: 3
      maximum: 3
    description: Synthesize and connect quantitative reasoning, skills, and experiences across disciplines, emphasizing personal finance challenges, opportunities, and decision-making, allowing them to address new or complex situations relevant to their lives or careers. Understand and manage personal financial planning, money management, insurance, and investments; develop a plan for incorporating these concepts now and in the future; and extend ideas to develop a plan for giving back to the community.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "(Prereq: GE   Area 1A and 1B and 1C and 2 with a C- or better)"
  BUS-351:
    code: BUS 351
    title: Risk Management & Tax Planning
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Risk Management & Tax Planning introduces the student to the principles, procedures, terminology and applications of Federal Income Tax law all types of Insurance (Risk Management) that individuals and businesses pursue. This course is designed to provide the student with an understanding of fundamental concepts for income taxation and the management of risk through insurance.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-307
            minimumGrade: C-
          - courseId: BUS-350
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BUS 307   or BUS 350   with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-352:
    code: BUS 352
    title: Estate Planning & Professional Conduct
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Teaches a framework for identifying solutions to estate planning issues affecting both business and individuals, understanding property ownership, estate planning documents, lifetime and death transfer strategies, and an understanding of both tax and non-tax estate planning objectives and issues. Will also examine professional conduct and regulation of Certified Financial Planners subject to the CFP Board’s Code of Ethics and Professional Responsibility and Rules of Conduct.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: BUS-307
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BUS 307   with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-353:
    code: BUS 353
    title: Advanced Financial Management
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course examines financial aspects of firm decisions; presents theoretical underpinings for financial management, together with quantitative techniques used to analyze financial questions. Covers financial analysis and planning; valuation methods; determination of required return; effect of capital structure decisions; funding alternatives; and corporate risk management.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: BUS-307
            minimumGrade: C-
          - courseId: BUS-350
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BUS 307   or BUS 350   with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-354:
    code: BUS 354
    title: Investment
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: The course presents procedures and tools necessary to determine value and analyze risk/return characteristics of equity, fixed income securities, and alternative individual investments. Furthermore, it emphasizes responsible decisions and provides background for portfolio analysis and investment valuation. Although the ultimate objective of the course is to develop a conceptual/theoretical and applied background for investment decisions, emphasis will also be put on practical applications.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: BUS-307
    prerequisiteNotes:
      - "[Prereq: BUS 307   and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-355:
    code: BUS 355
    title: International Finance
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Provides an integrated view of int’l financial markets and the mgmt of multinational firms. Introduces students to markets for spot currency transactions, currency forwards, options, and swaps. Students learn tools for valuing instruments traded in these markets. Course focuses on the opportunities and challenges these markets present to multinational managers attempting to manage exposure to exchange rates, raise capital in int’l capital markets, and evaluate int’l capital budgeting projects.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: BUS-307
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BUS 307   with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-356:
    code: BUS 356
    title: Personal Financial Management
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Focuses on general financial planning principles, education planning, retirement savings and income planning. You will learn the discipline of personal finance and how to effectively utilize personal financial statements. Topics include how to successfully purchase and finance a home. HR management strategies and career planning will be explored. Students will be able to understand concepts of saving money, investing for the future, debt management, and being fiscally responsible.
    offered:
      terms:
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-305
            minimumGrade: C-
    prerequisiteNotes:
      - "[(Prereq: ( BUS 305   ) and ( GE   Area 2) with a C- or better) and (Junior or Senior Standing))]"
    minimumStanding: junior
  BUS-357:
    code: BUS 357
    title: Financial Markets & Institutions
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Examines depository institutions and other financial intermediaries, asset management companies, and other financial institutions. Analyzes money and capital markets and the institutions that operate within those markets. Through case studies, exercises, and field research, students face and solve problems faced by mid-level managers of these institutions.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: BUS-307
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BUS 307   with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-358:
    code: BUS 358
    title: Principles of Microeconomics
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Theory of prices and markets; industrial organization; innovation and growth; limitations of markets and public policy; income distribution; and contemporary problems of labor and business, including issues of equity, diversity, and ethics from a stakeholder perspective.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "(Prereq: Junior or Senior Standing)"
    minimumStanding: junior
  BUS-360:
    code: BUS 360
    title: Emerging Technology and Digital Organization
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: New technologies such as social media, big data analytics & Internet of Things are impacting the digital organizations. Students develop understanding of these technologies using tools such as SAS, IBM Watson, HTML5, web design & analytics that provide strategic advantages & explore issues such as security, privacy, encryption, & ethical issues.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
