  BUS-364:
    code: BUS 364
    title: Cybersecurity and Privacy Management Strategies
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course introduces the policy and management aspects of cybersecurity for responsible organizations. The course will focus on understanding the business, technical, legal, and ethical issues related to cybersecurity and privacy, the cybersecurity challenges, the role of stakeholders, security metrics, and developing cybersecurity policies and processes to maintain confidentiality, integrity, and availability of the information, networks, computing systems, and applications managed by the organization.
    offered:
      availability: periodic
    prerequisites:
