    offered:
      availability: periodic
    prerequisiteNotes:
      - "(Prereq: Junior or Senior Standing)"
    minimumStanding: junior
  BUS-399S:
    code: BUS 399S
    title: "Business Pre-Capstone: Responsible Business Models for Community & Societal Impact"
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course allows students to learn and apply the principles of responsible business in a culminating experience of applied learning from all their previous courses. Students will engage in service learning with local organizations, individuals, and companies to cultivate understanding, empathy, and reflection as they seek to balance multiple “bottom line” considerations and reconcile tensions between profit and purpose. Students will analyze the external environment using tools from strategic management and then actively create innovative, responsible, and financially sustainable business models/concepts that contribute to social and/or environmental justice. Student teams will develop a business model/concept that positively and sustainably impacts a specific target community or market.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-304
            minimumGrade: C-
          - courseId: BUS-305
            minimumGrade: C-
          - courseId: BUS-306
            minimumGrade: C-
          - courseId: BUS-307
            minimumGrade: C-
    prerequisiteNotes:
      - "[(Prereq: BUS 304   and BUS 305   and BUS 306   with a C- or better) and (Junior or Senior Standing) and (Prereq or Coreq: BUS 307   )]"
    minimumStanding: junior
  BUS-410:
    code: BUS 410
    title: New Venture Design
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: An intensive experience in designing a startup business. Participants will develop skills in teamwork and presentation and learn tools for designing a startup business or social enterprise, including business models, prototyping, market validation and feasibility, and pitching the business. The course requires participation in Startup Factory (typically the first weekend of the Spring semester) and two additional half day sessions. Course not restricted to Business majors.
    offered:
      terms:
        - spring
  BUS-421:
    code: BUS 421
    title: Marketing Research
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: A practical, comprehensive, applied, and managerial approach to both quantitative and qualitative marketing research. Explores a step-by-step framework to defining problems, understanding ethical research considerations, preparing a research design and sampling, information gathering, interpretation, and analysis and report preparation in a domestic and international context.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - allOf:
          - courseId: BUS-306
            minimumGrade: C-
          - anyOf:
              - courseId: BUS-204
                minimumGrade: C-
              - courseId: STAT-100
                minimumGrade: C-
    prerequisiteNotes:
      - "[(Prereq: (( BUS 204   or STAT 100   ) and ( BUS 306   ) with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-422:
    code: BUS 422
    title: Professional Selling and Sales Management
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Developing selling and communications skills is critical for business professionals. The course explores how to build and maintain mutually beneficial relationships among various organizational forms, customers, investors and stakeholders. This is a hands-on course that includes role-playing, presentations and guest speakers. The course addresses how to improve sales force effectiveness using analytic tools, and issues in recruiting, training, motivating, compensating and retaining salespeople.
    offered:
      availability: periodic
    prerequisites:
      - anyOf:
          - courseId: BUS-306
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BUS 306   ) and ( GE   Area 2) with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-423:
    code: BUS 423
    title: Advanced Professional Selling
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: This course focuses on major account selling, coordination between a salesperson and other functional areas, team selling, career management, and personal productivity. It also provides negotiation techniques and strategies relevant to individual, group, and organizational decision making as well as the development of skills to enhance the resolution of personal and professional conflicts. The course employs student presentations, role plays, and exposure to advanced software tools.
    offered:
      terms:
        - fall
    prerequisites:
      - anyOf:
          - courseId: BUS-306
          - courseId: BUS-422
    prerequisiteNotes:
      - "(Prereq: BUS 306   and BUS 422   with C- or higher)"
  BUS-425:
    code: BUS 425
    title: Global Marketing
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Examines the global marketing environment, the differences and similarities in societies and cultures with regard to the legal and ethical implications of marketing strategies, developing global readiness, and global marketing strategies. Each student engages in a specific country’s market analysis, developing marketing strategies and marketing of a specific product or service.
    offered:
      terms:
        - fall
        - spring
    prerequisites:
      - anyOf:
          - courseId: BUS-306
            minimumGrade: C-
    prerequisiteNotes:
      - "[Prereq: ( BUS 306   with a C- or better) and (Junior or Senior Standing)]"
    minimumStanding: junior
  BUS-430:
    code: BUS 430
    title: Introduction to Social Entrepreneurship
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Social entrepreneurship is a rapidly developing field in which business and nonprofit leaders design and grow financially sustainable enterprises to address socio-environmental problems. As the lines blur between nonprofit organizations, government agencies, and businesses, it is critical to understand emerging opportunities and challenges in this interdisciplinary field. This introductory course builds on human-centered design approaches to problem-solving and draws from mini-case studies, guest lectures/speaker experiences, and student inquiry and presentations.
    offered:
      availability: periodic
    prerequisiteNotes:
      - "(Prereq: Junior or Senior Standing)"
    minimumStanding: junior
  BUS-433:
    code: BUS 433
    title: Management of Nonprofit Organizations
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Covers the principles and practices of managing a not-for-profit organization. Knowledge areas include strategic planning, human resource management, ethics and social responsibility, volunteer development, and influences of multiple stakeholders. Students examine actual practices of community organizations in education, health care, social services, and the arts.
    offered:
      terms:
        - fall
        - spring
    prerequisiteNotes:
      - "[Prereq: Junior or Senior Standing]"
    minimumStanding: junior
  BUS-434:
    code: BUS 434
    title: Policy/Regulation in Environmental Agribusiness
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Examines the complex agribusiness policy and regulatory environment. Students survey governmental policies and regulations, and analyze their effect on local agribusiness. Explores the process by which policies and regulations are made and enforced. Students address specific ethical and stakeholder issues such as water and land use, pesticides, food and worker safety.
    offered:
      terms:
        - fall
    prerequisiteNotes:
      - "(Prereq: Junior OR Senior Standing)"
    minimumStanding: junior
  BUS-435:
    code: BUS 435
    title: Supply Chain Management
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Provides an introduction to principles of supply chain management, risks & uncertainties associated with various stages of the supply chain, inventory management, forecasting, material resource planning, cost-price & value analysis, purchasing & procurement with ethical & social responsibility. Emphasis on using contemporary tools in spatial mapping, data visualization and data analytics such as Microsoft Excel, Geographical Information Systems (GIS), SAS, and SAP etc.
