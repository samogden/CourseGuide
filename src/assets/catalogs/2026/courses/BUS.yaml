    minimumStanding: junior
  BUS-442:
    code: BUS 442
    title: Purchasing and Procurement
    teachingStatus: active
    credits:
      minimum: 4
      maximum: 4
    description: Principles of procurement management in supply chain management and logistics. Topics include evaluating suppliers on standardized metrics, cost-price analysis, negotiation, risk management, strategic decisions, and developments in the project procurement and supply chain fields, global sourcing, and contract management. Emphasis on the application using Microsoft Excel and Enterprise Resource Planning platforms such as SAP, ERPSim, @risk by Palisade.
