question_html: |-
  <p>Use the chain rule. Enter the coefficient of x in the derivative.</p>
  <div class='math'>$$ \displaystyle f(x) = (5x+1)^{4} \; $$</div> <p><label>Coefficient: <input class="quizgen-answer-input" data-accepted="[&quot;20&quot;]" data-blank-id="q05-v083-a01" aria-label="Coefficient"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Coefficient
  accepted_values:
  - '20'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Differentiate the outside power first, keeping (5x+1) in place. Then multiply by the derivative of the inside, which is 5.</p>
  <p>Multiplying 4 by 5 gives 20.</p>
  <div class='math'>$$ \displaystyle f'(x) = 4(5x+1)^{3}(5) = 20(5x+1)^{3} \; $$</div>
