question_html: |-
  <p>Use the chain rule. Enter the coefficient of x in the derivative.</p>
  <div class='math'>$$ \displaystyle f(x) = (3x+1)^{5} \; $$</div> <p><label>Coefficient: <input class="quizgen-answer-input" data-accepted="[&quot;15&quot;]" data-blank-id="q05-v167-a01" aria-label="Coefficient"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Coefficient
  accepted_values:
  - '15'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Differentiate the outside power first, keeping (3x+1) in place. Then multiply by the derivative of the inside, which is 3.</p>
  <p>Multiplying 5 by 3 gives 15.</p>
  <div class='math'>$$ \displaystyle f'(x) = 5(3x+1)^{4}(3) = 15(3x+1)^{4} \; $$</div>
