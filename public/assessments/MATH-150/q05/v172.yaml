question_html: |-
  <p>Use the chain rule. Enter the coefficient of x in the derivative.</p>
  <div class='math'>$$ \displaystyle f(x) = (3x+1)^{2} \; $$</div> <p><label>Coefficient: <input class="quizgen-answer-input" data-accepted="[&quot;6&quot;]" data-blank-id="q05-v172-a01" aria-label="Coefficient"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Coefficient
  accepted_values:
  - '6'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Differentiate the outside power first, keeping (3x+1) in place. Then multiply by the derivative of the inside, which is 3.</p>
  <p>Multiplying 2 by 3 gives 6.</p>
  <div class='math'>$$ \displaystyle f'(x) = 2(3x+1)^{1}(3) = 6(3x+1)^{1} \; $$</div>
