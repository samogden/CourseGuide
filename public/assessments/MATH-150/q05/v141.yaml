question_html: |-
  <p>Use the chain rule. Enter the coefficient of x in the derivative.</p>
  <div class='math'>$$ \displaystyle f(x) = (5x+1)^{3} \; $$</div> <p><label>Coefficient: <input class="quizgen-answer-input" data-accepted="[&quot;15&quot;]" data-blank-id="q05-v141-a01" aria-label="Coefficient"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Coefficient
  accepted_values:
  - '15'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Differentiate the outside power first, keeping (5x+1) in place. Then multiply by the derivative of the inside, which is 5.</p>
  <p>Multiplying 3 by 5 gives 15.</p>
  <div class='math'>$$ \displaystyle f'(x) = 3(5x+1)^{2}(5) = 15(5x+1)^{2} \; $$</div>
