question_html: |-
  <p>Use the chain rule. Enter the coefficient of x in the derivative.</p>
  <div class='math'>$$ \displaystyle f(x) = (2x+1)^{4} \; $$</div> <p><label>Coefficient: <input class="quizgen-answer-input" data-accepted="[&quot;8&quot;]" data-blank-id="q05-v066-a01" aria-label="Coefficient"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Coefficient
  accepted_values:
  - '8'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Differentiate the outside power first, keeping (2x+1) in place. Then multiply by the derivative of the inside, which is 2.</p>
  <p>Multiplying 4 by 2 gives 8.</p>
  <div class='math'>$$ \displaystyle f'(x) = 4(2x+1)^{3}(2) = 8(2x+1)^{3} \; $$</div>
