question_html: |-
  <p>Use the chain rule. Enter the coefficient of x in the derivative.</p>
  <div class='math'>$$ \displaystyle f(x) = (2x+1)^{3} \; $$</div> <p><label>Coefficient: <input class="quizgen-answer-input" data-accepted="[&quot;6&quot;]" data-blank-id="q05-v131-a01" aria-label="Coefficient"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Coefficient
  accepted_values:
  - '6'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Differentiate the outside power first, keeping (2x+1) in place. Then multiply by the derivative of the inside, which is 2.</p>
  <p>Multiplying 3 by 2 gives 6.</p>
  <div class='math'>$$ \displaystyle f'(x) = 3(2x+1)^{2}(2) = 6(2x+1)^{2} \; $$</div>
