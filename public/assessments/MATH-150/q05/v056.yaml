question_html: |-
  <p>Use the chain rule. Enter the coefficient of x in the derivative.</p>
  <div class='math'>$$ \displaystyle f(x) = (5x+1)^{2} \; $$</div> <p><label>Coefficient: <input class="quizgen-answer-input" data-accepted="[&quot;10&quot;]" data-blank-id="q05-v056-a01" aria-label="Coefficient"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Coefficient
  accepted_values:
  - '10'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Differentiate the outside power first, keeping (5x+1) in place. Then multiply by the derivative of the inside, which is 5.</p>
  <p>Multiplying 2 by 5 gives 10.</p>
  <div class='math'>$$ \displaystyle f'(x) = 2(5x+1)^{1}(5) = 10(5x+1)^{1} \; $$</div>
