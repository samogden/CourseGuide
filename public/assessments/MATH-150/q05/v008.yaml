question_html: |-
  <p>Use the chain rule. Enter the coefficient of x in the derivative.</p>
  <div class='math'>$$ \displaystyle f(x) = (4x+1)^{4} \; $$</div> <p><label>Coefficient: <input class="quizgen-answer-input" data-accepted="[&quot;16&quot;]" data-blank-id="q05-v008-a01" aria-label="Coefficient"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Coefficient
  accepted_values:
  - '16'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Differentiate the outside power first, keeping (4x+1) in place. Then multiply by the derivative of the inside, which is 4.</p>
  <p>Multiplying 4 by 4 gives 16.</p>
  <div class='math'>$$ \displaystyle f'(x) = 4(4x+1)^{3}(4) = 16(4x+1)^{3} \; $$</div>
