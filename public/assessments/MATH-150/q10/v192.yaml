  - '4.5'
  - '4.5000'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>An antiderivative of x is x squared divided by 2. Evaluate that antiderivative at the upper limit and subtract its value at the lower limit.</p>
  <p>At x = 3, the antiderivative is 3 squared divided by 2, which is 4.5.</p>
  <div class='math'>$$ \displaystyle \left.\frac{x^2}{2}\right|_0^{3} = \frac{3^2}{2} - 0 = 4.5 \; $$</div>
