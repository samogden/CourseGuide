question_html: |-
  <p>Evaluate the definite integral using an antiderivative.</p>
  <div class='math'>$$ \displaystyle \int_0^{3} x\,dx \; $$</div> <p><label>Integral: <input class="quizgen-answer-input" data-accepted="[&quot;4.5&quot;, &quot;4.5000&quot;]" data-blank-id="q10-v192-a01" aria-label="Integral"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Round floats to 4 decimal places (fewer if exact, e.g., <code>1.25</code>). No mixed numbers (e.g. use <code>5/4</code>, not <code>1 1/4</code>). Integers as integers (e.g., <code>2</code>, not <code>2/1</code>).</li></ul></div>
answer:
- label: Integral
