question_html: |-
  <p>Evaluate the definite integral using an antiderivative.</p>
  <div class='math'>$$ \displaystyle \int_0^{6} x\,dx \; $$</div> <p><label>Integral: <input class="quizgen-answer-input" data-accepted="[&quot;18&quot;, &quot;18.0000&quot;]" data-blank-id="q10-v091-a01" aria-label="Integral"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Round floats to 4 decimal places (fewer if exact, e.g., <code>1.25</code>). No mixed numbers (e.g. use <code>5/4</code>, not <code>1 1/4</code>). Integers as integers (e.g., <code>2</code>, not <code>2/1</code>).</li></ul></div>
answer:
