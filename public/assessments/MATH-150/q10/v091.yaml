explanation_html: |-
  <p>An antiderivative of x is x squared divided by 2. Evaluate that antiderivative at the upper limit and subtract its value at the lower limit.</p>
  <p>At x = 6, the antiderivative is 6 squared divided by 2, which is 18.0.</p>
  <div class='math'>$$ \displaystyle \left.\frac{x^2}{2}\right|_0^{6} = \frac{6^2}{2} - 0 = 18.0 \; $$</div>
