question_html: |-
  <p>Differentiate the function. Enter the coefficient of the derivative term.</p>
  <div class='math'>$$ \displaystyle f(x) = 2x^{3} \; $$</div> <p><label>Coefficient: <input class="quizgen-answer-input" data-accepted="[&quot;6&quot;]" data-blank-id="q03-v129-a01" aria-label="Coefficient"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Coefficient
  accepted_values:
  - '6'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The power rule says to multiply the coefficient by the exponent, then reduce the exponent by 1.</p>
  <p>The coefficient of f&#x27;(x) is 6.</p>
  <div class='math'>$$ \displaystyle f'(x) = 2(3)x^{2} = 6x^{2} \; $$</div>
