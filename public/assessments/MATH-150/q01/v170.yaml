  <div class='math'>$$ \displaystyle \lim_{x \to 2} (4x +5) \; $$</div> <p><label>Limit: <input class="quizgen-answer-input" data-accepted="[&quot;13&quot;]" data-blank-id="q01-v170-a01" aria-label="Limit"><span class="quizgen-feedback"></span></label></p>
