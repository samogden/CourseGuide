  <div class='math'>$$ \displaystyle \lim_{x \to 1} (6x -3) \; $$</div> <p><label>Limit: <input class="quizgen-answer-input" data-accepted="[&quot;3&quot;]" data-blank-id="q01-v132-a01" aria-label="Limit"><span class="quizgen-feedback"></span></label></p>
