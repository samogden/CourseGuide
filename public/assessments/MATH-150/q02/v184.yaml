question_html: |-
  <p>Is this rational function continuous at the stated x-value? Enter YES or NO.</p>
  <div class='math'>$$ \displaystyle f(x) = \frac{x+1}{x-(-2)}, \qquad x=-2 \; $$</div> <p><label>Continuous?: <input class="quizgen-answer-input" data-accepted="[&quot;NO&quot;]" data-blank-id="q02-v184-a01" aria-label="Continuous?"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Continuous?
  accepted_values:
  - 'NO'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>A rational function is not continuous where its denominator is zero. At x = -2, the denominator becomes -2 - (-2) = 0.</p>
  <p>Because division by zero is undefined, the function is not continuous at x = -2.</p>
