question_html: |-
  <p>A circle&#x27;s radius is 2 cm and growing at 1 cm/s. Find how fast its area is growing.</p>
  <div class='math'>$$ \displaystyle A = \pi r^2 \; $$</div> <p><label>dA/dt: <input class="quizgen-answer-input" data-accepted="[&quot;12.5664&quot;]" data-blank-id="q08-v040-a01" aria-label="dA/dt"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Round floats to 4 decimal places (fewer if exact, e.g., <code>1.25</code>). No mixed numbers (e.g. use <code>5/4</code>, not <code>1 1/4</code>). Integers as integers (e.g., <code>2</code>, not <code>2/1</code>).</li></ul></div>
answer:
- label: dA/dt
  accepted_values:
  - '12.5664'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Differentiate the area formula with respect to time. The radius changes with time, so multiply by dr/dt.</p>
  <p>Use r = 2 and dr/dt = 1.</p>
  <div class='math'>$$ \displaystyle \frac{dA}{dt} = 2\pi r\frac{dr}{dt} = 2\pi(2)(1) = 12.566370614359172 \; $$</div>
