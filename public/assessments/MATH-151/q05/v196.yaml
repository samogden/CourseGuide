question_html: |-
  <p>Identify the coefficient A in the partial-fraction form.</p>
  <div class='math'>$$ \displaystyle \frac{1}{(x+4)(x+5)} = \frac{A}{x+4} + \frac{B}{x+5} \; $$</div> <p><label>A: <input class="quizgen-answer-input" data-accepted="[&quot;1&quot;, &quot;1.0000&quot;]" data-blank-id="q05-v196-a01" aria-label="A"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Round floats to 4 decimal places (fewer if exact, e.g., <code>1.25</code>). No mixed numbers (e.g. use <code>5/4</code>, not <code>1 1/4</code>). Integers as integers (e.g., <code>2</code>, not <code>2/1</code>).</li></ul></div>
answer:
- label: A
  accepted_values:
  - '1'
  - '1.0000'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply by both denominators. Then set x equal to -4; this makes the B term disappear.</p>
  <p>That leaves 1 = A(1), so A = 1/1.</p>
  <div class='math'>$$ \displaystyle 1 = A(-4+5) = 1A \quad \Rightarrow \quad A=\frac{1}{1} \; $$</div>
