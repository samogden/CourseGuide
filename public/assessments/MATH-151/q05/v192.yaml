question_html: |-
  <p>Identify the coefficient A in the partial-fraction form.</p>
  <div class='math'>$$ \displaystyle \frac{1}{(x+4)(x+9)} = \frac{A}{x+4} + \frac{B}{x+9} \; $$</div> <p><label>A: <input class="quizgen-answer-input" data-accepted="[&quot;0.2&quot;, &quot;0.2000&quot;]" data-blank-id="q05-v192-a01" aria-label="A"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Round floats to 4 decimal places (fewer if exact, e.g., <code>1.25</code>). No mixed numbers (e.g. use <code>5/4</code>, not <code>1 1/4</code>). Integers as integers (e.g., <code>2</code>, not <code>2/1</code>).</li></ul></div>
answer:
- label: A
  accepted_values:
