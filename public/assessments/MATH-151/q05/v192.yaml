  - '0.2000'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply by both denominators. Then set x equal to -4; this makes the B term disappear.</p>
  <p>That leaves 1 = A(5), so A = 1/5.</p>
  <div class='math'>$$ \displaystyle 1 = A(-4+9) = 5A \quad \Rightarrow \quad A=\frac{1}{5} \; $$</div>
