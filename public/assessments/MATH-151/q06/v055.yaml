question_html: |-
  <p>Solve the separable differential equation at t = 2.</p>
  <div class='math'>$$ \displaystyle \frac{dy}{dt} = 2y, \qquad y(0)=4 \; $$</div> <p><label>y(t): <input class="quizgen-answer-input" data-accepted="[&quot;218.3926&quot;]" data-blank-id="q06-v055-a01" aria-label="y(t)"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Round floats to 4 decimal places (fewer if exact, e.g., <code>1.25</code>). No mixed numbers (e.g. use <code>5/4</code>, not <code>1 1/4</code>). Integers as integers (e.g., <code>2</code>, not <code>2/1</code>).</li></ul></div>
