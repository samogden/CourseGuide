explanation_html: |-
  <p>For y&#x27; = ky, the solution has the form y(t) = Ce to the kt. The initial value gives C.</p>
  <p>Here C = 4, so substitute t = 2.</p>
  <div class='math'>$$ \displaystyle y(2) = 4e^{2(2)} = 218.3926 \; $$</div>
