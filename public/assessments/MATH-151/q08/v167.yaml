question_html: |-
  <p>Evaluate the indeterminate limit using L&#x27;Hopital&#x27;s rule.</p>
  <div class='math'>$$ \displaystyle \lim_{x\to 3}\frac{x^2-9}{x-3} \; $$</div> <p><label>Limit: <input class="quizgen-answer-input" data-accepted="[&quot;6&quot;]" data-blank-id="q08-v167-a01" aria-label="Limit"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Limit
  accepted_values:
  - '6'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Direct substitution gives 0/0, so differentiate the numerator and denominator once. The derivatives are 2x and 1.</p>
  <p>Now substitute x = 3 into 2x.</p>
  <div class='math'>$$ \displaystyle \lim_{x\to 3}\frac{2x}{1} = 2(3) = 6 \; $$</div>
