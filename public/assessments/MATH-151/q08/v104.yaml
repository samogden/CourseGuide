question_html: |-
  <p>Evaluate the indeterminate limit using L&#x27;Hopital&#x27;s rule.</p>
  <div class='math'>$$ \displaystyle \lim_{x\to 2}\frac{x^2-4}{x-2} \; $$</div> <p><label>Limit: <input class="quizgen-answer-input" data-accepted="[&quot;4&quot;]" data-blank-id="q08-v104-a01" aria-label="Limit"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Limit
  accepted_values:
  - '4'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Direct substitution gives 0/0, so differentiate the numerator and denominator once. The derivatives are 2x and 1.</p>
  <p>Now substitute x = 2 into 2x.</p>
  <div class='math'>$$ \displaystyle \lim_{x\to 2}\frac{2x}{1} = 2(2) = 4 \; $$</div>
