  - '1.345'
  - '1.3450'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The second-degree Taylor polynomial for e to the x is 1 + x + x squared divided by 2. Replace x with the given value.</p>
  <p>This gives an approximation of 1.3450.</p>
  <div class='math'>$$ \displaystyle 1+0.3+\frac{(0.3)^2}{2}=1.345 \; $$</div>
