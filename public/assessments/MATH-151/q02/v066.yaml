question_html: |-
  <p>Differentiate and enter the numerator of the derivative.</p>
  <div class='math'>$$ \displaystyle f(x) = 3\ln(x) \; $$</div> <p><label>Numerator: <input class="quizgen-answer-input" data-accepted="[&quot;3&quot;]" data-blank-id="q02-v066-a01" aria-label="Numerator"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Numerator
  accepted_values:
  - '3'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The derivative of ln(x) is 1/x. A constant multiplier stays in front.</p>
  <p>The derivative is 3/x, so its numerator is 3.</p>
  <div class='math'>$$ \displaystyle f'(x) = 3\cdot\frac{1}{x} = \frac{3}{x} \; $$</div>
