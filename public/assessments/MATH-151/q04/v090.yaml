question_html: |-
  <p>Evaluate this integral using integration by parts.</p>
  <div class='math'>$$ \displaystyle \int_1^{5} \ln(x)\,dx \; $$</div> <p><label>Integral: <input class="quizgen-answer-input" data-accepted="[&quot;4.0472&quot;]" data-blank-id="q04-v090-a01" aria-label="Integral"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Round floats to 4 decimal places (fewer if exact, e.g., <code>1.25</code>). No mixed numbers (e.g. use <code>5/4</code>, not <code>1 1/4</code>). Integers as integers (e.g., <code>2</code>, not <code>2/1</code>).</li></ul></div>
answer:
- label: Integral
  accepted_values:
  - '4.0472'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>For the integral of ln(x), choose u = ln(x) and dv = dx. Then du = 1/x dx and v = x.</p>
  <p>The antiderivative is x ln(x) - x. Evaluate it at 5 and at 1.</p>
  <div class='math'>$$ \displaystyle \left[x\ln(x)-x\right]_1^{5} = 5\ln(5)-5+1 = 4.0472 \; $$</div>
