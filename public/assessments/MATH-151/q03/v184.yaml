question_html: |-
  <p>Evaluate the inverse trigonometric expression in radians.</p>
  <div class='math'>$$ \displaystyle \arcsin\left(\frac{1}{2}\right) \; $$</div> <p><label>Angle: <input class="quizgen-answer-input" data-accepted="[&quot;0.5236&quot;]" data-blank-id="q03-v184-a01" aria-label="Angle"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Round floats to 4 decimal places (fewer if exact, e.g., <code>1.25</code>). No mixed numbers (e.g. use <code>5/4</code>, not <code>1 1/4</code>). Integers as integers (e.g., <code>2</code>, not <code>2/1</code>).</li></ul></div>
answer:
- label: Angle
  accepted_values:
  - '0.5236'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Arcsine asks for the angle whose sine is the input. The special angle with sine one-half is 30 degrees.</p>
  <p>Convert 30 degrees to radians: 30 degrees is pi divided by 6.</p>
  <div class='math'>$$ \displaystyle \sin\left(\frac{\pi}{6}\right)=\frac{1}{2} \; $$</div>
