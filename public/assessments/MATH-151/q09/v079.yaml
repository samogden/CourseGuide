question_html: |-
  <p>Evaluate the improper integral.</p>
  <div class='math'>$$ \displaystyle \int_{3}^{\infty} \frac{1}{x^2}\,dx \; $$</div> <p><label>Integral: <input class="quizgen-answer-input" data-accepted="[&quot;0.3333&quot;]" data-blank-id="q09-v079-a01" aria-label="Integral"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Round floats to 4 decimal places (fewer if exact, e.g., <code>1.25</code>). No mixed numbers (e.g. use <code>5/4</code>, not <code>1 1/4</code>). Integers as integers (e.g., <code>2</code>, not <code>2/1</code>).</li></ul></div>
answer:
- label: Integral
  accepted_values:
  - '0.3333'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Replace infinity with a limit. An antiderivative of 1/x squared is -1/x.</p>
  <p>As the upper bound grows without limit, -1/x approaches 0. Subtracting the lower-bound value gives 1/3.</p>
  <div class='math'>$$ \displaystyle \lim_{b\to\infty}\left[-\frac{1}{x}\right]_{3}^b = 0-\left(-\frac{1}{3}\right) = \frac{1}{3} \; $$</div>
