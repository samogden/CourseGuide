question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (2,-3)\cdot(2,-1) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;7&quot;]" data-blank-id="q03-v185-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Dot product
  accepted_values:
  - '7'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 2 times 2 and -3 times -1.</p>
  <div class='math'>$$ \displaystyle 2(2)+-3(-1)=4+3=7 \; $$</div>
