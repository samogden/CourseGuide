question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (-3,4)\cdot(4,-2) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;-20&quot;]" data-blank-id="q03-v088-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
