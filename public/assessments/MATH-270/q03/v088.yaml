explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are -3 times 4 and 4 times -2.</p>
  <div class='math'>$$ \displaystyle -3(4)+4(-2)=-12+-8=-20 \; $$</div>
