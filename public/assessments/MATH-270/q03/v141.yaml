question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (1,1)\cdot(-4,3) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;-1&quot;]" data-blank-id="q03-v141-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Dot product
  accepted_values:
  - '-1'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 1 times -4 and 1 times 3.</p>
  <div class='math'>$$ \displaystyle 1(-4)+1(3)=-4+3=-1 \; $$</div>
