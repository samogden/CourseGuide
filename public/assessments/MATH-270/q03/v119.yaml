question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (-2,-4)\cdot(1,-3) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;10&quot;]" data-blank-id="q03-v119-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Dot product
  accepted_values:
  - '10'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are -2 times 1 and -4 times -3.</p>
  <div class='math'>$$ \displaystyle -2(1)+-4(-3)=-2+12=10 \; $$</div>
