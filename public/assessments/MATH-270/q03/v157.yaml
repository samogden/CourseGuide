question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (-1,3)\cdot(1,2) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;5&quot;]" data-blank-id="q03-v157-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Dot product
  accepted_values:
  - '5'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are -1 times 1 and 3 times 2.</p>
  <div class='math'>$$ \displaystyle -1(1)+3(2)=-1+6=5 \; $$</div>
