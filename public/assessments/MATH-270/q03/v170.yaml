question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (4,-3)\cdot(-4,-1) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;-13&quot;]" data-blank-id="q03-v170-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
