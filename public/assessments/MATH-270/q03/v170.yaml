explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 4 times -4 and -3 times -1.</p>
  <div class='math'>$$ \displaystyle 4(-4)+-3(-1)=-16+3=-13 \; $$</div>
