explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are -1 times -2 and 5 times 3.</p>
  <div class='math'>$$ \displaystyle -1(-2)+5(3)=2+15=17 \; $$</div>
