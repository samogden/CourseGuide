question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (0,1)\cdot(1,4) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;4&quot;]" data-blank-id="q03-v009-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Dot product
  accepted_values:
  - '4'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 0 times 1 and 1 times 4.</p>
  <div class='math'>$$ \displaystyle 0(1)+1(4)=0+4=4 \; $$</div>
