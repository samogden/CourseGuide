question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (-4,0)\cdot(-4,4) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;16&quot;]" data-blank-id="q03-v124-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Dot product
  accepted_values:
  - '16'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are -4 times -4 and 0 times 4.</p>
  <div class='math'>$$ \displaystyle -4(-4)+0(4)=16+0=16 \; $$</div>
