explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 5 times 1 and 1 times 2.</p>
  <div class='math'>$$ \displaystyle 5(1)+1(2)=5+2=7 \; $$</div>
