explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 2 times 5 and -1 times 5.</p>
  <div class='math'>$$ \displaystyle 2(5)+-1(5)=10+-5=5 \; $$</div>
