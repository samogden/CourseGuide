question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (3,3)\cdot(4,-3) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;3&quot;]" data-blank-id="q03-v153-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Dot product
  accepted_values:
  - '3'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 3 times 4 and 3 times -3.</p>
  <div class='math'>$$ \displaystyle 3(4)+3(-3)=12+-9=3 \; $$</div>
