explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 4 times 5 and -3 times 4.</p>
  <div class='math'>$$ \displaystyle 4(5)+-3(4)=20+-12=8 \; $$</div>
