question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (-4,1)\cdot(0,3) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;3&quot;]" data-blank-id="q03-v079-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Dot product
  accepted_values:
  - '3'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are -4 times 0 and 1 times 3.</p>
  <div class='math'>$$ \displaystyle -4(0)+1(3)=0+3=3 \; $$</div>
