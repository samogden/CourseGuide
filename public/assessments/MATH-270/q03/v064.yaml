explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 4 times 5 and -2 times -2.</p>
  <div class='math'>$$ \displaystyle 4(5)+-2(-2)=20+4=24 \; $$</div>
