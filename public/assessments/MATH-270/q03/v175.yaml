question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (3,-1)\cdot(1,4) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;-1&quot;]" data-blank-id="q03-v175-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Dot product
  accepted_values:
  - '-1'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 3 times 1 and -1 times 4.</p>
  <div class='math'>$$ \displaystyle 3(1)+-1(4)=3+-4=-1 \; $$</div>
