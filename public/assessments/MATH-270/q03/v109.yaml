explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are -1 times -4 and 5 times -2.</p>
  <div class='math'>$$ \displaystyle -1(-4)+5(-2)=4+-10=-6 \; $$</div>
