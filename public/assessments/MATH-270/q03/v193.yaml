question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (3,-2)\cdot(4,5) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;2&quot;]" data-blank-id="q03-v193-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Dot product
  accepted_values:
  - '2'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 3 times 4 and -2 times 5.</p>
  <div class='math'>$$ \displaystyle 3(4)+-2(5)=12+-10=2 \; $$</div>
