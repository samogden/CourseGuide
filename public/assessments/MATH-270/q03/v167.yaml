explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are -4 times 4 and -2 times 3.</p>
  <div class='math'>$$ \displaystyle -4(4)+-2(3)=-16+-6=-22 \; $$</div>
