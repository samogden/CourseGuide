explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 1 times 1 and 5 times -3.</p>
  <div class='math'>$$ \displaystyle 1(1)+5(-3)=1+-15=-14 \; $$</div>
