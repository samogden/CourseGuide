explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are -4 times -1 and -4 times 1.</p>
  <div class='math'>$$ \displaystyle -4(-1)+-4(1)=4+-4=0 \; $$</div>
