explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 5 times 5 and -1 times 2.</p>
  <div class='math'>$$ \displaystyle 5(5)+-1(2)=25+-2=23 \; $$</div>
