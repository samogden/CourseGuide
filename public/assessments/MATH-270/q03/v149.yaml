explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 4 times 0 and 2 times 2.</p>
  <div class='math'>$$ \displaystyle 4(0)+2(2)=0+4=4 \; $$</div>
