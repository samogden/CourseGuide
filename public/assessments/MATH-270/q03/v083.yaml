question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (-2,-4)\cdot(-4,5) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;-12&quot;]" data-blank-id="q03-v083-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Dot product
  accepted_values:
  - '-12'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are -2 times -4 and -4 times 5.</p>
  <div class='math'>$$ \displaystyle -2(-4)+-4(5)=8+-20=-12 \; $$</div>
