question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (-1,-4)\cdot(-4,2) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;-4&quot;]" data-blank-id="q03-v169-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Dot product
  accepted_values:
  - '-4'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are -1 times -4 and -4 times 2.</p>
  <div class='math'>$$ \displaystyle -1(-4)+-4(2)=4+-8=-4 \; $$</div>
