explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 0 times 1 and 2 times 3.</p>
  <div class='math'>$$ \displaystyle 0(1)+2(3)=0+6=6 \; $$</div>
