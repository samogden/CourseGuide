question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (2,-3)\cdot(4,-2) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;14&quot;]" data-blank-id="q03-v154-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Dot product
  accepted_values:
  - '14'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 2 times 4 and -3 times -2.</p>
  <div class='math'>$$ \displaystyle 2(4)+-3(-2)=8+6=14 \; $$</div>
