explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 1 times -2 and -4 times 5.</p>
  <div class='math'>$$ \displaystyle 1(-2)+-4(5)=-2+-20=-22 \; $$</div>
