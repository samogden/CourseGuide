explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 4 times 4 and 5 times 1.</p>
  <div class='math'>$$ \displaystyle 4(4)+5(1)=16+5=21 \; $$</div>
