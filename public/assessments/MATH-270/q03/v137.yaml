question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (5,-3)\cdot(-1,-1) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;-2&quot;]" data-blank-id="q03-v137-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Dot product
  accepted_values:
  - '-2'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 5 times -1 and -3 times -1.</p>
  <div class='math'>$$ \displaystyle 5(-1)+-3(-1)=-5+3=-2 \; $$</div>
