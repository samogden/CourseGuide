explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 0 times -3 and 4 times 3.</p>
  <div class='math'>$$ \displaystyle 0(-3)+4(3)=0+12=12 \; $$</div>
