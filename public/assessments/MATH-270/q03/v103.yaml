  <div class='math'>$$ \displaystyle (0,4)\cdot(-3,3) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;12&quot;]" data-blank-id="q03-v103-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
