explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 2 times 1 and 4 times 4.</p>
  <div class='math'>$$ \displaystyle 2(1)+4(4)=2+16=18 \; $$</div>
