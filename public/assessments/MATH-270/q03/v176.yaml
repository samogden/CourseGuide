explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 1 times 5 and -2 times -3.</p>
  <div class='math'>$$ \displaystyle 1(5)+-2(-3)=5+6=11 \; $$</div>
