explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 5 times 3 and -2 times -2.</p>
  <div class='math'>$$ \displaystyle 5(3)+-2(-2)=15+4=19 \; $$</div>
