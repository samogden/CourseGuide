question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (5,-2)\cdot(3,-2) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;19&quot;]" data-blank-id="q03-v187-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
