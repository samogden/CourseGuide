explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 0 times -2 and 5 times -4.</p>
  <div class='math'>$$ \displaystyle 0(-2)+5(-4)=0+-20=-20 \; $$</div>
