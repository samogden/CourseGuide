explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 4 times 2 and 1 times 5.</p>
  <div class='math'>$$ \displaystyle 4(2)+1(5)=8+5=13 \; $$</div>
