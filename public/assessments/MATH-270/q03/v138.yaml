question_html: |-
  <p>Find the dot product of the vectors.</p>
  <div class='math'>$$ \displaystyle (1,1)\cdot(-2,5) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;3&quot;]" data-blank-id="q03-v138-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Dot product
  accepted_values:
  - '3'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 1 times -2 and 1 times 5.</p>
  <div class='math'>$$ \displaystyle 1(-2)+1(5)=-2+5=3 \; $$</div>
