  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 4 times -4 and -3 times -4.</p>
  <div class='math'>$$ \displaystyle 4(-4)+-3(-4)=-16+12=-4 \; $$</div>
