explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 2 times 1 and 1 times 5.</p>
  <div class='math'>$$ \displaystyle 2(1)+1(5)=2+5=7 \; $$</div>
