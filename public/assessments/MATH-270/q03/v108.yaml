  <div class='math'>$$ \displaystyle (-2,5)\cdot(-3,3) \; $$</div> <p><label>Dot product: <input class="quizgen-answer-input" data-accepted="[&quot;21&quot;]" data-blank-id="q03-v108-a01" aria-label="Dot product"><span class="quizgen-feedback"></span></label></p>
