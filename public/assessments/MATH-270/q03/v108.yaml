explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are -2 times -3 and 5 times 3.</p>
  <div class='math'>$$ \displaystyle -2(-3)+5(3)=6+15=21 \; $$</div>
