explanation_html: |-
  <p>Multiply corresponding components, then add those products.</p>
  <p>The products are 5 times 2 and 1 times 0.</p>
  <div class='math'>$$ \displaystyle 5(2)+1(0)=10+0=10 \; $$</div>
