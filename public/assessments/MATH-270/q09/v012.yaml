question_html: |-
  <p>What is the expected value of the Python expression below?</p>
  <pre><code>sum([1, 2, 3]) / 3</code></pre> <p><label>Expected value: <input class="quizgen-answer-input" data-accepted="[&quot;2&quot;]" data-blank-id="q09-v012-a01" aria-label="Expected value"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Expected value
  accepted_values:
  - '2'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>This code adds the three equally likely values and divides by how many values there are. That is the same calculation as a discrete expected value with equal probabilities.</p>
  <p>The total is 1 + 2 + 3 = 6, and 6 divided by 3 is 2.</p>
  <div class='math'>$$ \displaystyle E[X]=\frac{1+2+3}{3}=2 \; $$</div>
