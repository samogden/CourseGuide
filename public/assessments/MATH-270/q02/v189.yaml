question_html: |-
  <p>Find the top-left entry of the matrix product.</p>
  <div class='math'>$$ \displaystyle \begin{bmatrix}2&5\\0&1\end{bmatrix}\begin{bmatrix}1&0\\4&1\end{bmatrix} \; $$</div> <p><label>Top-left entry: <input class="quizgen-answer-input" data-accepted="[&quot;22&quot;]" data-blank-id="q02-v189-a01" aria-label="Top-left entry"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Top-left entry
  accepted_values:
  - '22'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The top-left entry is the dot product of the first row of the left matrix and the first column of the right matrix.</p>
  <p>Multiply 2 by 1, multiply 5 by 4, and add the results.</p>
  <div class='math'>$$ \displaystyle 2(1)+5(4)=2+20=22 \; $$</div>
