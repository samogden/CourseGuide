question_html: |-
  <p>Find the top-left entry of the matrix product.</p>
  <div class='math'>$$ \displaystyle \begin{bmatrix}3&1\\0&1\end{bmatrix}\begin{bmatrix}3&0\\4&1\end{bmatrix} \; $$</div> <p><label>Top-left entry: <input class="quizgen-answer-input" data-accepted="[&quot;13&quot;]" data-blank-id="q02-v078-a01" aria-label="Top-left entry"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Top-left entry
  accepted_values:
  - '13'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The top-left entry is the dot product of the first row of the left matrix and the first column of the right matrix.</p>
  <p>Multiply 3 by 3, multiply 1 by 4, and add the results.</p>
  <div class='math'>$$ \displaystyle 3(3)+1(4)=9+4=13 \; $$</div>
