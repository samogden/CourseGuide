question_html: |-
  <p>Find the top-left entry of the matrix product.</p>
  <div class='math'>$$ \displaystyle \begin{bmatrix}4&5\\0&1\end{bmatrix}\begin{bmatrix}4&0\\1&1\end{bmatrix} \; $$</div> <p><label>Top-left entry: <input class="quizgen-answer-input" data-accepted="[&quot;21&quot;]" data-blank-id="q02-v095-a01" aria-label="Top-left entry"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Top-left entry
  accepted_values:
  - '21'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The top-left entry is the dot product of the first row of the left matrix and the first column of the right matrix.</p>
  <p>Multiply 4 by 4, multiply 5 by 1, and add the results.</p>
  <div class='math'>$$ \displaystyle 4(4)+5(1)=16+5=21 \; $$</div>
