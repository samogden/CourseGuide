question_html: |-
  <p>Find the top-left entry of the matrix product.</p>
  <div class='math'>$$ \displaystyle \begin{bmatrix}1&4\\0&1\end{bmatrix}\begin{bmatrix}5&0\\4&1\end{bmatrix} \; $$</div> <p><label>Top-left entry: <input class="quizgen-answer-input" data-accepted="[&quot;21&quot;]" data-blank-id="q02-v159-a01" aria-label="Top-left entry"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Top-left entry
  accepted_values:
  - '21'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The top-left entry is the dot product of the first row of the left matrix and the first column of the right matrix.</p>
  <p>Multiply 1 by 5, multiply 4 by 4, and add the results.</p>
  <div class='math'>$$ \displaystyle 1(5)+4(4)=5+16=21 \; $$</div>
