question_html: |-
  <p>Find the determinant of the matrix.</p>
  <div class='math'>$$ \displaystyle \begin{vmatrix}4&5\\4&3\end{vmatrix} \; $$</div> <p><label>Determinant: <input class="quizgen-answer-input" data-accepted="[&quot;-8&quot;]" data-blank-id="q04-v126-a01" aria-label="Determinant"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Determinant
  accepted_values:
  - '-8'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>For a 2 by 2 matrix, multiply the main diagonal and subtract the product of the other diagonal.</p>
  <p>Compute 4 times 3, then subtract 5 times 4.</p>
  <div class='math'>$$ \displaystyle 4(3)-5(4)=12-20=-8 \; $$</div>
