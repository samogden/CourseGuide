question_html: |-
  <p>Find the determinant of the matrix.</p>
  <div class='math'>$$ \displaystyle \begin{vmatrix}2&2\\3&5\end{vmatrix} \; $$</div> <p><label>Determinant: <input class="quizgen-answer-input" data-accepted="[&quot;4&quot;]" data-blank-id="q04-v143-a01" aria-label="Determinant"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Determinant
  accepted_values:
  - '4'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>For a 2 by 2 matrix, multiply the main diagonal and subtract the product of the other diagonal.</p>
  <p>Compute 2 times 5, then subtract 2 times 3.</p>
  <div class='math'>$$ \displaystyle 2(5)-2(3)=10-6=4 \; $$</div>
