question_html: |-
  <p>Find the determinant of the matrix.</p>
  <div class='math'>$$ \displaystyle \begin{vmatrix}2&1\\2&1\end{vmatrix} \; $$</div> <p><label>Determinant: <input class="quizgen-answer-input" data-accepted="[&quot;0&quot;]" data-blank-id="q04-v194-a01" aria-label="Determinant"><span class="quizgen-feedback"></span></label></p>
