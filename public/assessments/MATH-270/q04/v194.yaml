explanation_html: |-
  <p>For a 2 by 2 matrix, multiply the main diagonal and subtract the product of the other diagonal.</p>
  <p>Compute 2 times 1, then subtract 1 times 2.</p>
  <div class='math'>$$ \displaystyle 2(1)-1(2)=2-2=0 \; $$</div>
