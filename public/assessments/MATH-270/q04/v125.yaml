question_html: |-
  <p>Find the determinant of the matrix.</p>
  <div class='math'>$$ \displaystyle \begin{vmatrix}6&5\\1&6\end{vmatrix} \; $$</div> <p><label>Determinant: <input class="quizgen-answer-input" data-accepted="[&quot;31&quot;]" data-blank-id="q04-v125-a01" aria-label="Determinant"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Determinant
  accepted_values:
  - '31'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>For a 2 by 2 matrix, multiply the main diagonal and subtract the product of the other diagonal.</p>
  <p>Compute 6 times 6, then subtract 5 times 1.</p>
  <div class='math'>$$ \displaystyle 6(6)-5(1)=36-5=31 \; $$</div>
