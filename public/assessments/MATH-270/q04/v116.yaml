question_html: |-
  <p>Find the determinant of the matrix.</p>
  <div class='math'>$$ \displaystyle \begin{vmatrix}6&5\\2&1\end{vmatrix} \; $$</div> <p><label>Determinant: <input class="quizgen-answer-input" data-accepted="[&quot;-4&quot;]" data-blank-id="q04-v116-a01" aria-label="Determinant"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Determinant
  accepted_values:
  - '-4'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>For a 2 by 2 matrix, multiply the main diagonal and subtract the product of the other diagonal.</p>
  <p>Compute 6 times 1, then subtract 5 times 2.</p>
  <div class='math'>$$ \displaystyle 6(1)-5(2)=6-10=-4 \; $$</div>
