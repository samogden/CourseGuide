question_html: |-
  <p>Find the determinant of the matrix.</p>
  <div class='math'>$$ \displaystyle \begin{vmatrix}4&6\\1&4\end{vmatrix} \; $$</div> <p><label>Determinant: <input class="quizgen-answer-input" data-accepted="[&quot;10&quot;]" data-blank-id="q04-v101-a01" aria-label="Determinant"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Determinant
  accepted_values:
  - '10'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>For a 2 by 2 matrix, multiply the main diagonal and subtract the product of the other diagonal.</p>
  <p>Compute 4 times 4, then subtract 6 times 1.</p>
  <div class='math'>$$ \displaystyle 4(4)-6(1)=16-6=10 \; $$</div>
