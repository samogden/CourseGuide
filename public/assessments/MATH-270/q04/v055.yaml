explanation_html: |-
  <p>For a 2 by 2 matrix, multiply the main diagonal and subtract the product of the other diagonal.</p>
  <p>Compute 3 times 2, then subtract 2 times 3.</p>
  <div class='math'>$$ \displaystyle 3(2)-2(3)=6-6=0 \; $$</div>
