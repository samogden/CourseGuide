question_html: |-
  <p>Enter one eigenvalue of this diagonal matrix.</p>
  <div class='math'>$$ \displaystyle \begin{bmatrix}4&0\\0&7\end{bmatrix} \; $$</div> <p><label>Eigenvalue: <input class="quizgen-answer-input" data-accepted="[&quot;4&quot;]" data-blank-id="q05-v131-a01" aria-label="Eigenvalue"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Eigenvalue
  accepted_values:
  - '4'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>For a diagonal matrix, the entries on the diagonal are its eigenvalues.</p>
  <p>The diagonal entries are 4 and 7, so 4 is one valid eigenvalue.</p>
