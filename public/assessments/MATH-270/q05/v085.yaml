question_html: |-
  <p>Enter one eigenvalue of this diagonal matrix.</p>
  <div class='math'>$$ \displaystyle \begin{bmatrix}1&0\\0&3\end{bmatrix} \; $$</div> <p><label>Eigenvalue: <input class="quizgen-answer-input" data-accepted="[&quot;1&quot;]" data-blank-id="q05-v085-a01" aria-label="Eigenvalue"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Eigenvalue
  accepted_values:
  - '1'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>For a diagonal matrix, the entries on the diagonal are its eigenvalues.</p>
  <p>The diagonal entries are 1 and 3, so 1 is one valid eigenvalue.</p>
