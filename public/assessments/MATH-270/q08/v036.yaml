question_html: |-
  <p>For four independent fair coin flips, find the probability of exactly two heads.</p>
  <div class='math'>$$ \displaystyle X\sim\operatorname{Binomial}(4,0.5) \; $$</div> <p><label>Probability: <input class="quizgen-answer-input" data-accepted="[&quot;0.375&quot;, &quot;0.3750&quot;]" data-blank-id="q08-v036-a01" aria-label="Probability"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Round floats to 4 decimal places (fewer if exact, e.g., <code>1.25</code>). No mixed numbers (e.g. use <code>5/4</code>, not <code>1 1/4</code>). Integers as integers (e.g., <code>2</code>, not <code>2/1</code>).</li></ul></div>
answer:
- label: Probability
  accepted_values:
  - '0.375'
  - '0.3750'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Choose which two of the four flips are heads, then multiply by the probability of each particular sequence.</p>
  <p>There are 6 choices of two positions, and each four-flip sequence has probability (1/2) to the fourth.</p>
  <div class='math'>$$ \displaystyle P(X=2)=\binom{4}{2}(0.5)^2(0.5)^2=\frac{6}{16}=0.375 \; $$</div>
