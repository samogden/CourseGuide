question_html: |-
  <p>Solve the system and enter x.</p>
  <div class='math'>$$ \displaystyle x+y=8,\qquad x-y=2 \; $$</div> <p><label>x: <input class="quizgen-answer-input" data-accepted="[&quot;5&quot;]" data-blank-id="q01-v086-a01" aria-label="x"><span class="quizgen-feedback"></span></label></p>
answer:
- label: x
  accepted_values:
  - '5'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Add the equations so that y and -y cancel. This leaves 2x equal to the sum of the right sides.</p>
  <p>The sum is 8 + (2) = 10, so x = 5.</p>
  <div class='math'>$$ \displaystyle 2x=10\quad\Rightarrow\quad x=5 \; $$</div>
