question_html: |-
  <p>Solve the system and enter x.</p>
  <div class='math'>$$ \displaystyle x+y=7,\qquad x-y=1 \; $$</div> <p><label>x: <input class="quizgen-answer-input" data-accepted="[&quot;4&quot;]" data-blank-id="q01-v095-a01" aria-label="x"><span class="quizgen-feedback"></span></label></p>
answer:
- label: x
  accepted_values:
  - '4'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Add the equations so that y and -y cancel. This leaves 2x equal to the sum of the right sides.</p>
  <p>The sum is 7 + (1) = 8, so x = 4.</p>
  <div class='math'>$$ \displaystyle 2x=8\quad\Rightarrow\quad x=4 \; $$</div>
