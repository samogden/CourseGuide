question_html: |-
  <p>Use one trapezoid to approximate the integral from 0 to the stated upper bound.</p>
  <div class='math'>$$ \displaystyle f(0)=3,\quad f(5)=7 \; $$</div> <p><label>Approximation: <input class="quizgen-answer-input" data-accepted="[&quot;25&quot;, &quot;25.0000&quot;]" data-blank-id="q06-v059-a01" aria-label="Approximation"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Round floats to 4 decimal places (fewer if exact, e.g., <code>1.25</code>). No mixed numbers (e.g. use <code>5/4</code>, not <code>1 1/4</code>). Integers as integers (e.g., <code>2</code>, not <code>2/1</code>).</li></ul></div>
answer:
- label: Approximation
  accepted_values:
  - '25'
  - '25.0000'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The trapezoid rule with one interval is width times the average of the two endpoint heights.</p>
  <p>The width is 5, and the endpoint heights are 3 and 7.</p>
  <div class='math'>$$ \displaystyle 5\cdot\frac{3+7}{2}=25.0 \; $$</div>
