question_html: |-
  <p>Use one trapezoid to approximate the integral from 0 to the stated upper bound.</p>
  <div class='math'>$$ \displaystyle f(0)=4,\quad f(4)=11 \; $$</div> <p><label>Approximation: <input class="quizgen-answer-input" data-accepted="[&quot;30&quot;, &quot;30.0000&quot;]" data-blank-id="q06-v178-a01" aria-label="Approximation"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Round floats to 4 decimal places (fewer if exact, e.g., <code>1.25</code>). No mixed numbers (e.g. use <code>5/4</code>, not <code>1 1/4</code>). Integers as integers (e.g., <code>2</code>, not <code>2/1</code>).</li></ul></div>
answer:
- label: Approximation
  accepted_values:
  - '30'
  - '30.0000'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The trapezoid rule with one interval is width times the average of the two endpoint heights.</p>
  <p>The width is 4, and the endpoint heights are 4 and 11.</p>
  <div class='math'>$$ \displaystyle 4\cdot\frac{4+11}{2}=30.0 \; $$</div>
