question_html: |-
  <p>Find the real zeros of  \(p(x) = (x + 3)(x - 1)\) . Enter them separated by commas.</p>
  <p><label>Zeros: <input class="quizgen-answer-input" data-accepted="[&quot;-3, 1&quot;, &quot;1, -3&quot;]" data-blank-id="q03-v053-a01" aria-label="Zeros"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Enter lists as comma-separated values with a space after the comma (e.g., <code>1, 2, 3</code>).</li></ul></div>
answer:
- label: Zeros
  accepted_values:
  - -3, 1
  - 1, -3
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>A product equals zero when at least one factor equals zero. Set each factor equal to zero and solve for x.</p>
  <div class='math'>$$ \displaystyle x + 3 = 0 \quad \text{or} \quad x - 1 = 0 \; $$</div>
  <p>This gives x = -3 or x = 1, so those are the two real zeros.</p>
