question_html: |-
  <p>Find the real zeros of  \(p(x) = (x + 5)(x - 1)\) . Enter them separated by commas.</p>
  <p><label>Zeros: <input class="quizgen-answer-input" data-accepted="[&quot;-5, 1&quot;, &quot;1, -5&quot;]" data-blank-id="q03-v031-a01" aria-label="Zeros"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Enter lists as comma-separated values with a space after the comma (e.g., <code>1, 2, 3</code>).</li></ul></div>
answer:
- label: Zeros
  accepted_values:
  - -5, 1
  - 1, -5
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>A product equals zero when at least one factor equals zero. Set each factor equal to zero and solve for x.</p>
  <div class='math'>$$ \displaystyle x + 5 = 0 \quad \text{or} \quad x - 1 = 0 \; $$</div>
  <p>This gives x = -5 or x = 1, so those are the two real zeros.</p>
