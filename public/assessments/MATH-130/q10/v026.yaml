question_html: |-
  <p>Find the mean of this data set: 8, 7, 7, 1, 3.</p>
  <p><label>Mean: <input class="quizgen-answer-input" data-accepted="[&quot;5.2&quot;, &quot;5.2000&quot;]" data-blank-id="q10-v026-a01" aria-label="Mean"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Round floats to 4 decimal places (fewer if exact, e.g., <code>1.25</code>). No mixed numbers (e.g. use <code>5/4</code>, not <code>1 1/4</code>). Integers as integers (e.g., <code>2</code>, not <code>2/1</code>).</li></ul></div>
answer:
- label: Mean
  accepted_values:
  - '5.2'
  - '5.2000'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The mean is the average. To find it, add every data value and then divide by the number of values.</p>
  <div class='math'>$$ \displaystyle \frac{8 + 7 + 7 + 1 + 3}{5} = \frac{26}{5} = 5.2 \; $$</div>
  <p>There are 5 values, so the mean is 5.20.</p>
