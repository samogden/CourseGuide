question_html: |-
  <p>Solve  \(\sin(\theta) = 0.5\)  for 0 &lt;= theta &lt;= 360 degrees. Enter all angles separated by commas.</p>
  <p><label>Angles (degrees): <input class="quizgen-answer-input" data-accepted="[&quot;30, 150&quot;, &quot;150, 30&quot;]" data-blank-id="q08-v005-a01" aria-label="Angles (degrees)"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Enter lists as comma-separated values with a space after the comma (e.g., <code>1, 2, 3</code>).</li></ul></div>
answer:
- label: Angles (degrees)
  accepted_values:
  - 30, 150
  - 150, 30
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>First find the unit-circle angles whose vertical coordinate (sine) is  \(0.5\) . Then keep only the angles from 0 through 360 degrees.</p>
  <div class='math'>$$ \displaystyle \sin(\theta) = 0.5 \quad \Rightarrow \quad \theta = 30^\circ, \; \theta = 150^\circ \; $$</div>
  <p>Therefore the solutions are 30, 150 degrees.</p>
