question_html: |-
  <p>Solve  \(\sin(\theta) = 1.0\)  for 0 &lt;= theta &lt;= 360 degrees. Enter all angles separated by commas.</p>
  <p><label>Angles (degrees): <input class="quizgen-answer-input" data-accepted="[&quot;90&quot;]" data-blank-id="q08-v123-a01" aria-label="Angles (degrees)"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Enter lists as comma-separated values with a space after the comma (e.g., <code>1, 2, 3</code>).</li></ul></div>
answer:
- label: Angles (degrees)
  accepted_values:
  - '90'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>First find the unit-circle angles whose vertical coordinate (sine) is  \(1.0\) . Then keep only the angles from 0 through 360 degrees.</p>
  <div class='math'>$$ \displaystyle \sin(\theta) = 1.0 \quad \Rightarrow \quad \theta = 90^\circ \; $$</div>
  <p>Therefore the solutions are 90 degrees.</p>
