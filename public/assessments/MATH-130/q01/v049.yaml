question_html: |-
  <p>Let  \(f(x) = 5x + 2\) . Find f(-3).</p>
  <p><label>f(x): <input class="quizgen-answer-input" data-accepted="[&quot;-13&quot;]" data-blank-id="q01-v049-a01" aria-label="f(x)"><span class="quizgen-feedback"></span></label></p>
answer:
- label: f(x)
