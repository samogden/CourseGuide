explanation_html: |-
  <p>The notation f( \(-3\) ) means that we use  \(-3\)  in place of every  \(x\)  in the rule for the function.</p>
  <div class='math'>$$ \displaystyle f(-3) = 5(-3) + 2 = -13 \; $$</div>
  <p>So the value of the function at x = -3 is -13.</p>
