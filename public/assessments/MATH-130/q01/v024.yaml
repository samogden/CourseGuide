question_html: |-
  <p>Let  \(f(x) = -4x + 5\) . Find f(1).</p>
  <p><label>f(x): <input class="quizgen-answer-input" data-accepted="[&quot;1&quot;]" data-blank-id="q01-v024-a01" aria-label="f(x)"><span class="quizgen-feedback"></span></label></p>
answer:
- label: f(x)
  accepted_values:
  - '1'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The notation f( \(1\) ) means that we use  \(1\)  in place of every  \(x\)  in the rule for the function.</p>
  <div class='math'>$$ \displaystyle f(1) = -4(1) + 5 = 1 \; $$</div>
  <p>So the value of the function at x = 1 is 1.</p>
