explanation_html: |-
  <p>The notation f( \(0\) ) means that we use  \(0\)  in place of every  \(x\)  in the rule for the function.</p>
  <div class='math'>$$ \displaystyle f(0) = -5(0) + 0 = 0 \; $$</div>
  <p>So the value of the function at x = 0 is 0.</p>
