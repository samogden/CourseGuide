question_html: |-
  <p>Let  \(f(x) = -5x + 0\) . Find f(0).</p>
  <p><label>f(x): <input class="quizgen-answer-input" data-accepted="[&quot;0&quot;]" data-blank-id="q01-v121-a01" aria-label="f(x)"><span class="quizgen-feedback"></span></label></p>
answer:
- label: f(x)
