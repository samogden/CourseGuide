question_html: |-
  <p>Let  \(f(x) = -5x - 3\) . Find f(3).</p>
  <p><label>f(x): <input class="quizgen-answer-input" data-accepted="[&quot;-18&quot;]" data-blank-id="q01-v130-a01" aria-label="f(x)"><span class="quizgen-feedback"></span></label></p>
answer:
- label: f(x)
  accepted_values:
  - '-18'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The notation f( \(3\) ) means that we use  \(3\)  in place of every  \(x\)  in the rule for the function.</p>
  <div class='math'>$$ \displaystyle f(3) = -5(3) - 3 = -18 \; $$</div>
  <p>So the value of the function at x = 3 is -18.</p>
