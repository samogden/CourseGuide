question_html: |-
  <p>Let  \(f(x) = 2x - 1\) . Find f(4).</p>
  <p><label>f(x): <input class="quizgen-answer-input" data-accepted="[&quot;7&quot;]" data-blank-id="q01-v033-a01" aria-label="f(x)"><span class="quizgen-feedback"></span></label></p>
answer:
- label: f(x)
  accepted_values:
  - '7'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The notation f( \(4\) ) means that we use  \(4\)  in place of every  \(x\)  in the rule for the function.</p>
  <div class='math'>$$ \displaystyle f(4) = 2(4) - 1 = 7 \; $$</div>
  <p>So the value of the function at x = 4 is 7.</p>
