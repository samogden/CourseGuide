question_html: |-
  <p>Let  \(f(x) = -1x + 1\) . Find f(0).</p>
  <p><label>f(x): <input class="quizgen-answer-input" data-accepted="[&quot;1&quot;]" data-blank-id="q01-v147-a01" aria-label="f(x)"><span class="quizgen-feedback"></span></label></p>
answer:
- label: f(x)
  accepted_values:
  - '1'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The notation f( \(0\) ) means that we use  \(0\)  in place of every  \(x\)  in the rule for the function.</p>
  <div class='math'>$$ \displaystyle f(0) = -1(0) + 1 = 1 \; $$</div>
  <p>So the value of the function at x = 0 is 1.</p>
