explanation_html: |-
  <p>The notation f( \(2\) ) means that we use  \(2\)  in place of every  \(x\)  in the rule for the function.</p>
  <div class='math'>$$ \displaystyle f(2) = 0(2) + 0 = 0 \; $$</div>
  <p>So the value of the function at x = 2 is 0.</p>
