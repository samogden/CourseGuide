question_html: |-
  <p>Let  \(f(x) = 3x + 0\) . Find f(-3).</p>
  <p><label>f(x): <input class="quizgen-answer-input" data-accepted="[&quot;-9&quot;]" data-blank-id="q01-v078-a01" aria-label="f(x)"><span class="quizgen-feedback"></span></label></p>
answer:
- label: f(x)
