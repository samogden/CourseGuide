explanation_html: |-
  <p>The notation f( \(4\) ) means that we use  \(4\)  in place of every  \(x\)  in the rule for the function.</p>
  <div class='math'>$$ \displaystyle f(4) = -5(4) + 1 = -19 \; $$</div>
  <p>So the value of the function at x = 4 is -19.</p>
