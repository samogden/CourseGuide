question_html: |-
  <p>Let  \(f(x) = -5x + 1\) . Find f(4).</p>
  <p><label>f(x): <input class="quizgen-answer-input" data-accepted="[&quot;-19&quot;]" data-blank-id="q01-v037-a01" aria-label="f(x)"><span class="quizgen-feedback"></span></label></p>
