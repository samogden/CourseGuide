question_html: |-
  <p>Let  \(f(x) = 1x - 5\) . Find f(-2).</p>
  <p><label>f(x): <input class="quizgen-answer-input" data-accepted="[&quot;-7&quot;]" data-blank-id="q01-v010-a01" aria-label="f(x)"><span class="quizgen-feedback"></span></label></p>
answer:
- label: f(x)
  accepted_values:
  - '-7'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The notation f( \(-2\) ) means that we use  \(-2\)  in place of every  \(x\)  in the rule for the function.</p>
  <div class='math'>$$ \displaystyle f(-2) = 1(-2) - 5 = -7 \; $$</div>
  <p>So the value of the function at x = -2 is -7.</p>
