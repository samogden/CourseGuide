question_html: |-
  <div class='math'>$$ \displaystyle y = (x - 4)^2 - 4 \; $$</div>
  <p>Find the turning point (also called the vertex) and enter it as (h, k).</p>
  <p><label>Turning point: <input class="quizgen-answer-input" data-accepted="[&quot;(4, -4)&quot;]" data-blank-id="q02-v112-a01" aria-label="Turning point"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Turning point
  accepted_values:
  - (4, -4)
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>A quadratic written in vertex form has the pattern  \(y = a(x - h)^2 + k\) . Its turning point is  \((h, k)\) .</p>
  <p>Here, h = 4 and k = -4, so the turning point is (4, -4). Because the squared term has a positive coefficient, the parabola has a minimum at that point.</p>
