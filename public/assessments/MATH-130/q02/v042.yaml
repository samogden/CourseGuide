question_html: |-
  <div class='math'>$$ \displaystyle y = -(x - 1)^2 + 2 \; $$</div>
  <p>Find the turning point (also called the vertex) and enter it as (h, k).</p>
  <p><label>Turning point: <input class="quizgen-answer-input" data-accepted="[&quot;(1, 2)&quot;]" data-blank-id="q02-v042-a01" aria-label="Turning point"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Turning point
  accepted_values:
  - (1, 2)
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>A quadratic written in vertex form has the pattern  \(y = a(x - h)^2 + k\) . Its turning point is  \((h, k)\) .</p>
  <p>Here, h = 1 and k = 2, so the turning point is (1, 2). Because the squared term has a negative coefficient, the parabola has a maximum at that point.</p>
