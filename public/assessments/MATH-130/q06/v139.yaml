question_html: |-
  <p>Evaluate  \(\log_{10}(10000)\) .</p>
  <p><label>Logarithm value: <input class="quizgen-answer-input" data-accepted="[&quot;4&quot;]" data-blank-id="q06-v139-a01" aria-label="Logarithm value"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Logarithm value
  accepted_values:
  - '4'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>A logarithm asks: what exponent must be placed on the base to make the given number? Look for the exponent that makes 10 become 10000.</p>
  <div class='math'>$$ \displaystyle 10^{4} = 10000 \; $$</div>
  <p>Because this equation is true,  \(\log_{10}(10000) = 4\) .</p>
