question_html: |-
  <p>Evaluate  \(\log_{2}(16)\) .</p>
  <p><label>Logarithm value: <input class="quizgen-answer-input" data-accepted="[&quot;4&quot;]" data-blank-id="q06-v141-a01" aria-label="Logarithm value"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Logarithm value
  accepted_values:
  - '4'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>A logarithm asks: what exponent must be placed on the base to make the given number? Look for the exponent that makes 2 become 16.</p>
  <div class='math'>$$ \displaystyle 2^{4} = 16 \; $$</div>
  <p>Because this equation is true,  \(\log_{2}(16) = 4\) .</p>
