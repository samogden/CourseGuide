question_html: |-
  <p>Evaluate  \(\log_{3}(3)\) .</p>
  <p><label>Logarithm value: <input class="quizgen-answer-input" data-accepted="[&quot;1&quot;]" data-blank-id="q06-v197-a01" aria-label="Logarithm value"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Logarithm value
  accepted_values:
  - '1'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>A logarithm asks: what exponent must be placed on the base to make the given number? Look for the exponent that makes 3 become 3.</p>
  <div class='math'>$$ \displaystyle 3^{1} = 3 \; $$</div>
  <p>Because this equation is true,  \(\log_{3}(3) = 1\) .</p>
