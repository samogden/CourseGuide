question_html: |-
  <p>Evaluate  \(\log_{3}(27)\) .</p>
  <p><label>Logarithm value: <input class="quizgen-answer-input" data-accepted="[&quot;3&quot;]" data-blank-id="q06-v090-a01" aria-label="Logarithm value"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Logarithm value
  accepted_values:
  - '3'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>A logarithm asks: what exponent must be placed on the base to make the given number? Look for the exponent that makes 3 become 27.</p>
  <div class='math'>$$ \displaystyle 3^{3} = 27 \; $$</div>
  <p>Because this equation is true,  \(\log_{3}(27) = 3\) .</p>
