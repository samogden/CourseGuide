question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 17 + 4m\) , where m is miles. Predict the fare for 3 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;29&quot;]" data-blank-id="q09-v052-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '29'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 3 miles, so replace m with 3.</p>
  <div class='math'>$$ \displaystyle C(3) = 17 + 4(3) = 17 + 12 = 29 \; $$</div>
  <p>The 17 is the starting fare, and 4 times 3 is the mileage charge. Together, the predicted fare is 29.</p>
