question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 18 + 5m\) , where m is miles. Predict the fare for 10 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;68&quot;]" data-blank-id="q09-v075-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '68'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 10 miles, so replace m with 10.</p>
  <div class='math'>$$ \displaystyle C(10) = 18 + 5(10) = 18 + 50 = 68 \; $$</div>
  <p>The 18 is the starting fare, and 5 times 10 is the mileage charge. Together, the predicted fare is 68.</p>
