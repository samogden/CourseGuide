question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 9 + 7m\) , where m is miles. Predict the fare for 10 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;79&quot;]" data-blank-id="q09-v038-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '79'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 10 miles, so replace m with 10.</p>
  <div class='math'>$$ \displaystyle C(10) = 9 + 7(10) = 9 + 70 = 79 \; $$</div>
  <p>The 9 is the starting fare, and 7 times 10 is the mileage charge. Together, the predicted fare is 79.</p>
