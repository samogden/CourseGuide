question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 11 + 4m\) , where m is miles. Predict the fare for 10 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;51&quot;]" data-blank-id="q09-v124-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '51'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 10 miles, so replace m with 10.</p>
  <div class='math'>$$ \displaystyle C(10) = 11 + 4(10) = 11 + 40 = 51 \; $$</div>
  <p>The 11 is the starting fare, and 4 times 10 is the mileage charge. Together, the predicted fare is 51.</p>
