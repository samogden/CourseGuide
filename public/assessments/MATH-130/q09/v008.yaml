question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 17 + 3m\) , where m is miles. Predict the fare for 7 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;38&quot;]" data-blank-id="q09-v008-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '38'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 7 miles, so replace m with 7.</p>
  <div class='math'>$$ \displaystyle C(7) = 17 + 3(7) = 17 + 21 = 38 \; $$</div>
  <p>The 17 is the starting fare, and 3 times 7 is the mileage charge. Together, the predicted fare is 38.</p>
