question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 5 + 2m\) , where m is miles. Predict the fare for 9 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;23&quot;]" data-blank-id="q09-v024-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '23'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 9 miles, so replace m with 9.</p>
  <div class='math'>$$ \displaystyle C(9) = 5 + 2(9) = 5 + 18 = 23 \; $$</div>
  <p>The 5 is the starting fare, and 2 times 9 is the mileage charge. Together, the predicted fare is 23.</p>
