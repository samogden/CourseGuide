question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 11 + 8m\) , where m is miles. Predict the fare for 8 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;75&quot;]" data-blank-id="q09-v023-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '75'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 8 miles, so replace m with 8.</p>
  <div class='math'>$$ \displaystyle C(8) = 11 + 8(8) = 11 + 64 = 75 \; $$</div>
  <p>The 11 is the starting fare, and 8 times 8 is the mileage charge. Together, the predicted fare is 75.</p>
