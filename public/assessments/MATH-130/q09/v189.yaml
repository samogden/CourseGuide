question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 20 + 3m\) , where m is miles. Predict the fare for 7 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;41&quot;]" data-blank-id="q09-v189-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '41'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 7 miles, so replace m with 7.</p>
  <div class='math'>$$ \displaystyle C(7) = 20 + 3(7) = 20 + 21 = 41 \; $$</div>
  <p>The 20 is the starting fare, and 3 times 7 is the mileage charge. Together, the predicted fare is 41.</p>
