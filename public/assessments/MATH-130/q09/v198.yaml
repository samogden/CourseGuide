question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 14 + 5m\) , where m is miles. Predict the fare for 8 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;54&quot;]" data-blank-id="q09-v198-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '54'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 8 miles, so replace m with 8.</p>
  <div class='math'>$$ \displaystyle C(8) = 14 + 5(8) = 14 + 40 = 54 \; $$</div>
  <p>The 14 is the starting fare, and 5 times 8 is the mileage charge. Together, the predicted fare is 54.</p>
