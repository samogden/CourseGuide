question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 17 + 8m\) , where m is miles. Predict the fare for 10 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;97&quot;]" data-blank-id="q09-v185-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '97'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 10 miles, so replace m with 10.</p>
  <div class='math'>$$ \displaystyle C(10) = 17 + 8(10) = 17 + 80 = 97 \; $$</div>
  <p>The 17 is the starting fare, and 8 times 10 is the mileage charge. Together, the predicted fare is 97.</p>
