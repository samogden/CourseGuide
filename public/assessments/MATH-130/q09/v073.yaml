question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 11 + 4m\) , where m is miles. Predict the fare for 9 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;47&quot;]" data-blank-id="q09-v073-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '47'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 9 miles, so replace m with 9.</p>
  <div class='math'>$$ \displaystyle C(9) = 11 + 4(9) = 11 + 36 = 47 \; $$</div>
  <p>The 11 is the starting fare, and 4 times 9 is the mileage charge. Together, the predicted fare is 47.</p>
