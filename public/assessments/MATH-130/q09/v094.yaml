question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 7 + 6m\) , where m is miles. Predict the fare for 5 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;37&quot;]" data-blank-id="q09-v094-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '37'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 5 miles, so replace m with 5.</p>
  <div class='math'>$$ \displaystyle C(5) = 7 + 6(5) = 7 + 30 = 37 \; $$</div>
  <p>The 7 is the starting fare, and 6 times 5 is the mileage charge. Together, the predicted fare is 37.</p>
