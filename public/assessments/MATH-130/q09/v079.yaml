question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 9 + 8m\) , where m is miles. Predict the fare for 5 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;49&quot;]" data-blank-id="q09-v079-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '49'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 5 miles, so replace m with 5.</p>
  <div class='math'>$$ \displaystyle C(5) = 9 + 8(5) = 9 + 40 = 49 \; $$</div>
  <p>The 9 is the starting fare, and 8 times 5 is the mileage charge. Together, the predicted fare is 49.</p>
