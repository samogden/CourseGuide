question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 10 + 7m\) , where m is miles. Predict the fare for 7 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;59&quot;]" data-blank-id="q09-v180-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '59'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 7 miles, so replace m with 7.</p>
  <div class='math'>$$ \displaystyle C(7) = 10 + 7(7) = 10 + 49 = 59 \; $$</div>
  <p>The 10 is the starting fare, and 7 times 7 is the mileage charge. Together, the predicted fare is 59.</p>
