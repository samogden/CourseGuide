question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 11 + 8m\) , where m is miles. Predict the fare for 4 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;43&quot;]" data-blank-id="q09-v049-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '43'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 4 miles, so replace m with 4.</p>
  <div class='math'>$$ \displaystyle C(4) = 11 + 8(4) = 11 + 32 = 43 \; $$</div>
  <p>The 11 is the starting fare, and 8 times 4 is the mileage charge. Together, the predicted fare is 43.</p>
