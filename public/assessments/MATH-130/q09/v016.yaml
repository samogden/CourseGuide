question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 11 + 3m\) , where m is miles. Predict the fare for 6 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;29&quot;]" data-blank-id="q09-v016-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '29'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 6 miles, so replace m with 6.</p>
  <div class='math'>$$ \displaystyle C(6) = 11 + 3(6) = 11 + 18 = 29 \; $$</div>
  <p>The 11 is the starting fare, and 3 times 6 is the mileage charge. Together, the predicted fare is 29.</p>
