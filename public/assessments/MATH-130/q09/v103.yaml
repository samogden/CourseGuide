question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 20 + 8m\) , where m is miles. Predict the fare for 7 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;76&quot;]" data-blank-id="q09-v103-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '76'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 7 miles, so replace m with 7.</p>
  <div class='math'>$$ \displaystyle C(7) = 20 + 8(7) = 20 + 56 = 76 \; $$</div>
  <p>The 20 is the starting fare, and 8 times 7 is the mileage charge. Together, the predicted fare is 76.</p>
