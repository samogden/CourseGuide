question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 17 + 5m\) , where m is miles. Predict the fare for 9 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;62&quot;]" data-blank-id="q09-v001-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '62'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 9 miles, so replace m with 9.</p>
  <div class='math'>$$ \displaystyle C(9) = 17 + 5(9) = 17 + 45 = 62 \; $$</div>
  <p>The 17 is the starting fare, and 5 times 9 is the mileage charge. Together, the predicted fare is 62.</p>
