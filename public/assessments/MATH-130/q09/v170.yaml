question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 17 + 5m\) , where m is miles. Predict the fare for 4 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;37&quot;]" data-blank-id="q09-v170-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '37'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 4 miles, so replace m with 4.</p>
  <div class='math'>$$ \displaystyle C(4) = 17 + 5(4) = 17 + 20 = 37 \; $$</div>
  <p>The 17 is the starting fare, and 5 times 4 is the mileage charge. Together, the predicted fare is 37.</p>
