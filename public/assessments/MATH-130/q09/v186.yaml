question_html: |-
  <p>A taxi fare is modeled by  \(C(m) = 6 + 4m\) , where m is miles. Predict the fare for 8 miles.</p>
  <p><label>Prediction: <input class="quizgen-answer-input" data-accepted="[&quot;38&quot;]" data-blank-id="q09-v186-a01" aria-label="Prediction"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Prediction
  accepted_values:
  - '38'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The model uses m for the number of miles traveled. This trip is 8 miles, so replace m with 8.</p>
  <div class='math'>$$ \displaystyle C(8) = 6 + 4(8) = 6 + 32 = 38 \; $$</div>
  <p>The 6 is the starting fare, and 4 times 8 is the mileage charge. Together, the predicted fare is 38.</p>
