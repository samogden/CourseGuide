question_html: |-
  <p>For  \(R(x) = \frac{1}{x - 6}\) , which x-value is not in the domain?</p>
  <p><label>Excluded x-value: <input class="quizgen-answer-input" data-accepted="[&quot;6&quot;]" data-blank-id="q04-v153-a01" aria-label="Excluded x-value"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Excluded x-value
  accepted_values:
  - '6'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>A fraction is undefined when its denominator is zero, so we only need to find the value of x that makes the denominator zero.</p>
  <div class='math'>$$ \displaystyle x - 6 = 0 \quad \Rightarrow \quad x = 6 \; $$</div>
  <p>Therefore x = 6 is not allowed in the domain.</p>
