  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>On the unit circle, sine is the vertical coordinate (the y-coordinate) of the point at the angle. At 270 degrees, that vertical coordinate is -1.0.</p>
  <div class='math'>$$ \displaystyle \sin(270^\circ) = -1.0 \; $$</div>
  <p>So the requested sine value is -1.0.</p>
