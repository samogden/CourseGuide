question_html: |-
  <p>A population follows  \(P(t) = 200(1.1)^t\) . Find P(2).</p>
  <p><label>Amount: <input class="quizgen-answer-input" data-accepted="[&quot;242&quot;, &quot;242.0000&quot;]" data-blank-id="q05-v171-a01" aria-label="Amount"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Round floats to 4 decimal places (fewer if exact, e.g., <code>1.25</code>). No mixed numbers (e.g. use <code>5/4</code>, not <code>1 1/4</code>). Integers as integers (e.g., <code>2</code>, not <code>2/1</code>).</li></ul></div>
answer:
- label: Amount
  accepted_values:
  - '242'
  - '242.0000'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The input t tells us how many time periods have passed. Since the question asks for 2 time periods, replace t with 2 in the model.</p>
  <div class='math'>$$ \displaystyle P(2) = 200(1.1)^{2} = 200(1.2100000000000002) = 242.00000000000003 \; $$</div>
  <p>The population after 2 time periods is 242.00.</p>
