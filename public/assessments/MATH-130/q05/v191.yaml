question_html: |-
  <p>A population follows  \(P(t) = 500(1.2)^t\) . Find P(3).</p>
  <p><label>Amount: <input class="quizgen-answer-input" data-accepted="[&quot;864&quot;, &quot;864.0000&quot;]" data-blank-id="q05-v191-a01" aria-label="Amount"><span class="quizgen-feedback"></span></label></p> <div class="answer-warnings"><p><strong>Notes for answer entry</strong></p><ul><li>Round floats to 4 decimal places (fewer if exact, e.g., <code>1.25</code>). No mixed numbers (e.g. use <code>5/4</code>, not <code>1 1/4</code>). Integers as integers (e.g., <code>2</code>, not <code>2/1</code>).</li></ul></div>
answer:
- label: Amount
  accepted_values:
  - '864'
  - '864.0000'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>The input t tells us how many time periods have passed. Since the question asks for 3 time periods, replace t with 3 in the model.</p>
  <div class='math'>$$ \displaystyle P(3) = 500(1.2)^{3} = 500(1.7279999999999998) = 863.9999999999999 \; $$</div>
  <p>The population after 3 time periods is 864.00.</p>
