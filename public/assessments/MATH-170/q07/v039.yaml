question_html: |-
  <p>For the relation a ~ b when a and b have the same parity, are 3 and 7 related? Enter YES or NO.</p>
  <div class='math'>$$ \displaystyle a\sim b \iff a\equiv b\pmod 2 \; $$</div> <p><label>Related?: <input class="quizgen-answer-input" data-accepted="[&quot;YES&quot;]" data-blank-id="q07-v039-a01" aria-label="Related?"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Related?
  accepted_values:
  - 'YES'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Two numbers have the same parity when they leave the same remainder after division by 2. Both 3 and 7 are odd.</p>
  <p>They both have remainder 1 modulo 2, so 3 is related to 7.</p>
