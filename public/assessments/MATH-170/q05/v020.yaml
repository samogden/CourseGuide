question_html: |-
  <p>Evaluate the summation.</p>
  <div class='math'>$$ \displaystyle \sum_{k=1}^{6} k \; $$</div> <p><label>Sum: <input class="quizgen-answer-input" data-accepted="[&quot;21&quot;]" data-blank-id="q05-v020-a01" aria-label="Sum"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Sum
  accepted_values:
  - '21'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>This sum adds every integer from 1 through the upper index. The formula for this total is n(n+1)/2.</p>
  <p>With n = 6, the sum is 6(7)/2 = 21.</p>
  <div class='math'>$$ \displaystyle \frac{6(7)}{2}=21 \; $$</div>
