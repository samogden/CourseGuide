question_html: |-
  <p>Evaluate the summation.</p>
  <div class='math'>$$ \displaystyle \sum_{k=1}^{8} k \; $$</div> <p><label>Sum: <input class="quizgen-answer-input" data-accepted="[&quot;36&quot;]" data-blank-id="q05-v162-a01" aria-label="Sum"><span class="quizgen-feedback"></span></label></p>
