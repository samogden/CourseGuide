question_html: |-
  <p>Evaluate the summation.</p>
  <div class='math'>$$ \displaystyle \sum_{k=1}^{3} k \; $$</div> <p><label>Sum: <input class="quizgen-answer-input" data-accepted="[&quot;6&quot;]" data-blank-id="q05-v091-a01" aria-label="Sum"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Sum
  accepted_values:
  - '6'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>This sum adds every integer from 1 through the upper index. The formula for this total is n(n+1)/2.</p>
  <p>With n = 3, the sum is 3(4)/2 = 6.</p>
  <div class='math'>$$ \displaystyle \frac{3(4)}{2}=6 \; $$</div>
