explanation_html: |-
  <p>An arithmetic sequence adds 2 each time. From the first term to term 7, there are 6 additions.</p>
  <p>Start at 3 and add 6 groups of 2 to get 15.</p>
  <div class='math'>$$ \displaystyle a_7=3+(6)(2)=15 \; $$</div>
