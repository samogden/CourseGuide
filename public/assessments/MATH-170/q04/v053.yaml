explanation_html: |-
  <p>An arithmetic sequence adds 2 each time. From the first term to term 10, there are 9 additions.</p>
  <p>Start at 3 and add 9 groups of 2 to get 21.</p>
  <div class='math'>$$ \displaystyle a_10=3+(9)(2)=21 \; $$</div>
