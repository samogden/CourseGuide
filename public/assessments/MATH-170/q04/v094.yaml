explanation_html: |-
  <p>An arithmetic sequence adds 5 each time. From the first term to term 10, there are 9 additions.</p>
  <p>Start at 4 and add 9 groups of 5 to get 49.</p>
  <div class='math'>$$ \displaystyle a_10=4+(9)(5)=49 \; $$</div>
