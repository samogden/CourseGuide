explanation_html: |-
  <p>An arithmetic sequence adds 7 each time. From the first term to term 9, there are 8 additions.</p>
  <p>Start at 5 and add 8 groups of 7 to get 61.</p>
  <div class='math'>$$ \displaystyle a_9=5+(8)(7)=61 \; $$</div>
