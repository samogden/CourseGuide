explanation_html: |-
  <p>An arithmetic sequence adds 2 each time. From the first term to term 9, there are 8 additions.</p>
  <p>Start at 2 and add 8 groups of 2 to get 18.</p>
  <div class='math'>$$ \displaystyle a_9=2+(8)(2)=18 \; $$</div>
