explanation_html: |-
  <p>An arithmetic sequence adds 3 each time. From the first term to term 9, there are 8 additions.</p>
  <p>Start at 2 and add 8 groups of 3 to get 26.</p>
  <div class='math'>$$ \displaystyle a_9=2+(8)(3)=26 \; $$</div>
