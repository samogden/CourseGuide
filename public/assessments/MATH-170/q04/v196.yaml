explanation_html: |-
  <p>An arithmetic sequence adds 3 each time. From the first term to term 10, there are 9 additions.</p>
  <p>Start at 3 and add 9 groups of 3 to get 30.</p>
  <div class='math'>$$ \displaystyle a_10=3+(9)(3)=30 \; $$</div>
