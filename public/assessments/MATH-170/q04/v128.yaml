explanation_html: |-
  <p>An arithmetic sequence adds 7 each time. From the first term to term 5, there are 4 additions.</p>
  <p>Start at 2 and add 4 groups of 7 to get 30.</p>
  <div class='math'>$$ \displaystyle a_5=2+(4)(7)=30 \; $$</div>
