explanation_html: |-
  <p>An arithmetic sequence adds 4 each time. From the first term to term 7, there are 6 additions.</p>
  <p>Start at 2 and add 6 groups of 4 to get 26.</p>
  <div class='math'>$$ \displaystyle a_7=2+(6)(4)=26 \; $$</div>
