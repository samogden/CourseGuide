explanation_html: |-
  <p>An arithmetic sequence adds 6 each time. From the first term to term 7, there are 6 additions.</p>
  <p>Start at 4 and add 6 groups of 6 to get 40.</p>
  <div class='math'>$$ \displaystyle a_7=4+(6)(6)=40 \; $$</div>
