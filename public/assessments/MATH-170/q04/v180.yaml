explanation_html: |-
  <p>An arithmetic sequence adds 6 each time. From the first term to term 10, there are 9 additions.</p>
  <p>Start at 1 and add 9 groups of 6 to get 55.</p>
  <div class='math'>$$ \displaystyle a_10=1+(9)(6)=55 \; $$</div>
