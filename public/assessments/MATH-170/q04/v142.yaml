explanation_html: |-
  <p>An arithmetic sequence adds 7 each time. From the first term to term 9, there are 8 additions.</p>
  <p>Start at 2 and add 8 groups of 7 to get 58.</p>
  <div class='math'>$$ \displaystyle a_9=2+(8)(7)=58 \; $$</div>
