explanation_html: |-
  <p>An arithmetic sequence adds 6 each time. From the first term to term 9, there are 8 additions.</p>
  <p>Start at 5 and add 8 groups of 6 to get 53.</p>
  <div class='math'>$$ \displaystyle a_9=5+(8)(6)=53 \; $$</div>
