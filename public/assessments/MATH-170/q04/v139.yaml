explanation_html: |-
  <p>An arithmetic sequence adds 4 each time. From the first term to term 10, there are 9 additions.</p>
  <p>Start at 2 and add 9 groups of 4 to get 38.</p>
  <div class='math'>$$ \displaystyle a_10=2+(9)(4)=38 \; $$</div>
