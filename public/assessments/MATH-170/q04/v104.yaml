explanation_html: |-
  <p>An arithmetic sequence adds 2 each time. From the first term to term 10, there are 9 additions.</p>
  <p>Start at 5 and add 9 groups of 2 to get 23.</p>
  <div class='math'>$$ \displaystyle a_10=5+(9)(2)=23 \; $$</div>
