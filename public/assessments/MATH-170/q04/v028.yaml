explanation_html: |-
  <p>An arithmetic sequence adds 4 each time. From the first term to term 8, there are 7 additions.</p>
  <p>Start at 4 and add 7 groups of 4 to get 32.</p>
  <div class='math'>$$ \displaystyle a_8=4+(7)(4)=32 \; $$</div>
