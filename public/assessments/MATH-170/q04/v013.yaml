explanation_html: |-
  <p>An arithmetic sequence adds 5 each time. From the first term to term 7, there are 6 additions.</p>
  <p>Start at 3 and add 6 groups of 5 to get 33.</p>
  <div class='math'>$$ \displaystyle a_7=3+(6)(5)=33 \; $$</div>
