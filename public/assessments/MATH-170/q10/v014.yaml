question_html: |-
  <p>How many edges does a complete graph with the stated number of vertices have?</p>
  <div class='math'>$$ \displaystyle K_{7} \; $$</div> <p><label>Edges: <input class="quizgen-answer-input" data-accepted="[&quot;21&quot;]" data-blank-id="q10-v014-a01" aria-label="Edges"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Edges
  accepted_values:
  - '21'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>In a complete graph, every pair of different vertices has exactly one edge. The number of pairs is n(n-1)/2.</p>
  <p>For 7 vertices, this is 7(6)/2 = 21.</p>
  <div class='math'>$$ \displaystyle \binom{7}{2}=21 \; $$</div>
