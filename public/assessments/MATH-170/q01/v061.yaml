question_html: |-
  <p>Find the number of elements in the union of the two sets.</p>
  <div class='math'>$$ \displaystyle |A|=7,\quad |B|=5,\quad |A\cap B|=2 \; $$</div> <p><label>|A union B|: <input class="quizgen-answer-input" data-accepted="[&quot;10&quot;]" data-blank-id="q01-v061-a01" aria-label="|A union B|"><span class="quizgen-feedback"></span></label></p>
answer:
- label: '|A union B|'
  accepted_values:
  - '10'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>Add the sizes of A and B, but subtract the overlap because those elements were counted twice.</p>
  <p>There are 7 + 5 - 2 = 10 elements in the union.</p>
  <div class='math'>$$ \displaystyle |A\cup B|=7+5-2=10 \; $$</div>
