question_html: |-
  <p>How many outcomes are possible when choosing one item from each independent group?</p>
  <div class='math'>$$ \displaystyle 7\text{ shirt choices and }2\text{ pants choices} \; $$</div> <p><label>Outcomes: <input class="quizgen-answer-input" data-accepted="[&quot;14&quot;]" data-blank-id="q08-v194-a01" aria-label="Outcomes"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Outcomes
  accepted_values:
  - '14'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>For each of the 7 shirt choices, there are 2 pants choices. The multiplication principle tells us to multiply independent choices.</p>
  <p>That gives 7 times 2, or 14 possible outfits.</p>
  <div class='math'>$$ \displaystyle 7\cdot 2=14 \; $$</div>
