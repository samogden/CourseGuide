question_html: |-
  <p>How many outcomes are possible when choosing one item from each independent group?</p>
  <div class='math'>$$ \displaystyle 3\text{ shirt choices and }4\text{ pants choices} \; $$</div> <p><label>Outcomes: <input class="quizgen-answer-input" data-accepted="[&quot;12&quot;]" data-blank-id="q08-v014-a01" aria-label="Outcomes"><span class="quizgen-feedback"></span></label></p>
answer:
- label: Outcomes
  accepted_values:
  - '12'
  kind: fill_in_multiple_blanks_question
explanation_html: |-
  <p>For each of the 3 shirt choices, there are 4 pants choices. The multiplication principle tells us to multiply independent choices.</p>
  <p>That gives 3 times 4, or 12 possible outfits.</p>
  <div class='math'>$$ \displaystyle 3\cdot 4=12 \; $$</div>
